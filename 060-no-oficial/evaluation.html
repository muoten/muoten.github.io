talarlo.\nPincha aquí para acceder a información sobre este proceso y evitar posibles errores\nPaso 2. Solicita el certificado\nTienes que rellenar el formulario que está en esta página ."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p04", "question": "que diferencia hay entre clave pin y clave permanente", "answerable": true, "expected": "Cl@ve permanente es una contraseña de validez duradera, para usuarios habituales; Cl@ve PIN es una contraseña de validez muy limitada, para quien accede con poca frecuencia.", "answer": "Cl@ve PIN ofrece una contraseña temporal cada vez que necesitas hacer un trámite y está orientada a quienes acceden de vez en cuando. Cl@ve Permanente utiliza una contraseña de validez más duradera, que hay que renovar, y está orientada a quienes acceden habitualmente [1].", "cited": [{"n": 1, "title": "Registrarte en Cl@ve > Usos del sistema Cl@ve", "text": "Registrarte en Cl@ve > Usos del sistema Cl@ve\nHay 3 formas de usar el sistema Cl@ve:\nCl@ve PIN Te da una contraseña temporal cada vez que necesitas hacer un trámite. Es más útil para personas que acceden de vez en cuando. Más información sobre Cl@ve PIN\nCl@ve permanente Con este sistema tienes una contraseña que dura mucho más, aunque también tienes que renovarla. Es más útil para personas que acceden de forma habitual. Más información sobre Cl@ve permanente\nCl@ve móvil Con este sistema recibes una notificación en tu móvil, y no necesitas ninguna contraseña. Más información sobre Cl@ve móvil"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p05", "question": "como me registro en cl@ve sin ir a una oficina", "answerable": true, "expected": "Por internet: con vídeoidentificación en la App Cl@ve, sin certificado mediante carta de invitación o videollamada (nivel básico), o con certificado electrónico o DNIe en la sede de la Agencia Tributaria.", "answer": "Puedes registrarte sin acudir a una oficina de estas formas:\n\n- **Con la app Cl@ve y vídeoidentificación:** obtienes el nivel básico; tras revisar las evidencias, puedes obtener el avanzado. Temporalmente, esta opción solo está disponible para personas españolas con DNI en vigor. [4]\n- **Por internet, sin certificado electrónico:** mediante carta de invitación o videollamada. Es un registro básico y solo permite acceder a algunos servicios. [3][4]\n- **Por internet, con certificado electrónico o DNIe:** el registro se realiza en la sede electrónica de la Agencia Tributaria. [3][4]\n\nPara registrarte, se solicitan un teléfono móvil y correo electrónico, además de la documentación de identidad correspondiente. [1]", "cited": [{"n": 1, "title": "Registrarte en cl@ve", "text": "Registrarte en cl@ve\nCl@ve es un sistema para identificarte electrónicamente ante las Administraciones Públicas con garantías de seguridad, sin tener que recordar claves diferentes para acceder a los distintos servicios.\nTienes más información en la página web de Cl@ve , que también incluye preguntas frecuentes.\nAntes de usar Cl@ve, tienes que registrarte en el sistema, aportando los datos necesarios:\nNúmero de teléfono móvil nacional o extranjero\nCorreo electrónico\nSi eres español, DNI\nSi eres extranjero y tienes NIE : Certificado de registro de ciudadano de la UE, tarjeta de identidad de extranjero o permiso de residencia, y además Pasaporte (si eres ciudadano de la UE, también puedes identificarte con el documento de identidad del país de origen, en lugar del pasaporte)\n​Para garantizar que sólo la persona registrada tiene acceso a los códigos PIN enviados al teléfono móvil, sólo se puede asociar un DNI/NIE a un mismo número de móvil.\nHay 4 formas:"}, {"n": 3, "title": "Registrarte en Cl@ve > ¿Cómo puedes registrarte en Cl@ve?", "text": "Registrarte en Cl@ve > ¿Cómo puedes registrarte en Cl@ve?\nHay 4 formas de registrarte en Cl@ve:\nCon vídeoidentificación automática, con la App móvil Cl@ve. Este es un registro básico, solo sirve para algunos servicios. Más adelante, revisan los archivos y te dan el registro avanzado. Pincha aquí para acceder\nA través de internet, sin certificado electrónico. Este es un registro básico, solo sirve para algunos servicios. Puedes hacerlo por una carta de invitación. Pincha aquí para acceder También puedes hacerlo por videollamada. Pincha aquí para acceder\nA través de internet, con certificado electrónico o DNI electrónico. El registro a través de internet se hace en la sede electrónica de la Agencia Tributaria Pincha aquí para acceder\nDe forma presencial. Para registrarte de forma presencial, tienes que ir a una oficina de registro de Cl@ve. Pincha aquí para acceder a Oficinas de Registro Cl@ve\nTienes más información en la web de Cl@ve.\nPincha aquí para acceder a la web de Cl@ve .\nTambién puedes consultar las preguntas frecuentes sobre el registro en Cl@ve.\nPincha aquí para acceder a las preguntas frecuentes ."}, {"n": 4, "title": "Registrarte en cl@ve", "text": "Registrarte en cl@ve\nCon vídeoidentificación automática con la App Cl@ve. Siguiendo las instrucciones de la aplicación, obtendrás en pocos minutos el nivel de registro básico en Cl@ve. En un proceso posterior, una vez completada satisfactoriamente la revisión de evidencias electrónicas (vídeo, documento de identidad y biometría facial) por parte de un empleado público autorizado, puedes obtener directamente el nivel de registro avanzado . Temporalmente sólo se ofrece este servicio a personas españolas con DNI en vigor.\nA través de internet, sin certificado electrónico . Este tipo de registro es de nivel básico y no permite acceder a todos los servicios. Puede ser mediante carta de invitación o por videollamada\nA través de internet, con certificado electrónico o DNIe (DNI electrónico). El registro en Cl@ve a través de internet se realiza en la sede electrónica de la Agencia Tributaria (AEAT)\nDe forma presencial . El registro de forma presencial se realiza acudiendo a una oficina de registro Cl@ve\nPuedes encontrar más información en la web de Cl@ve y en las preguntas frecuentes sobre el registro en Cl@ve\nUna vez que te hayas registrado en Cl@ve, hay tres posibilidades de uso:"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p06", "question": "se puede firmar con cl@ve?", "answerable": true, "expected": "Sí, con Cl@ve Firma, en determinados trámites; requiere registro de nivel avanzado, Cl@ve Permanente activada y generar el certificado de firma. Una de las guías dice lo contrario, así que una respuesta que señale la contradicción también es correcta.", "answer": "Sí, mediante Cl@ve Firma, que permite firmar electrónicamente en determinados trámites [4]. Para usarla tienes que registrarte en el nivel avanzado, activar Cl@ve Permanente y crear el certificado de firma [2]. Cl@ve Firma solo está disponible en algunos trámites [9].", "cited": [{"n": 2, "title": "Registrarte en Cl@ve", "text": "Registrarte en Cl@ve\nCl@ve Firma\nPara utilizar la firma centralizada tienes que realizar los siguientes pasos:\nRegistrarte en el Nivel avanzado del sistema Cl@ve,\nactivar la Cl@ve Permanente\ny crear el certificado de firma.\nPuedes encontrar más información en el apartado Cl@ve Firma de la web de Cl@ve.\nPincha aquí para acceder .\nNormas y leyes\nOrden PRE/1838/2014, de 8 de octubre , por la que se publica el Acuerdo de Consejo de Ministros, de 19 de septiembre de 2014, por el que se aprueba Cl@ve, la plataforma común del Sector Público Administrativo Estatal para la identificación, autenticación y firma electrónica mediante el uso de claves concertadas."}, {"n": 4, "title": "Identificación Electrónica > Identificación y firma electrónica", "text": "Identificación Electrónica > Identificación y firma electrónica\nCertificado electrónico\nCon el certificado electrónico puedes tanto identificarte como firmar electrónicamente.\nLa firma electrónica basada en certificados tiene la misma validez que la firma manuscrita.\nPuedes utilizar la firma electrónica en los siguientes casos, entre otros:\nFirmar documentos. Por ejemplo, un PDF.\nRealizar trámites que requieran firma. Por ejemplo, formular una solicitud.\nAdemás del certificado electrónico, necesitas una aplicación de firma\nPara trámites que requieran firma, necesitarás tener instalada la aplicación de firma AutoFirma. La puedes descargar aquí.\nCl@ve\nCl@ve es un sistema que simplifica el acceso electrónico a los servicios públicos mediante claves concertadas, complementando el DNI electrónico y los certificados digitales. Permite identificarse y autenticarse de forma sencilla y segura, así como firmar electrónicamente en determinados trámites mediante certificados personales en la nube Cl@ve Firma . Además, facilita la realización de gestiones desde dispositivos móviles."}, {"n": 9, "title": "Identificación electrónica > Identificación y firma electrónica", "text": "Identificación electrónica > Identificación y firma electrónica\nCertificado electrónico\nCon el certificado electrónico puedes identificarte y firmar documentos.\nLa firma electrónica vale igual que la firma a mano.\nPuedes firmar documentos PDF y otro tipo de documentos oficiales. Por ejemplo, una solicitud.\nPara firmar de forma electrónica necesitas una aplicación de firma.\nPincha aquí para acceder a más información sobre aplicaciones de firma\nPara hacer trámites que necesitan firma necesitas la aplicación AutoFirma.\nPincha aquí para descargar la aplicación AutoFirma .\nCl@ve\nCon Cl@ve puedes identificarte pero no puedes firmar documentos.\nExiste Cl@ve Firma que sí te deja firmar documentos. Pero solo se puede usar en muy pocos trámites de momento.\nPincha aquí para acceder a más información sobre Cl@ve Firma ."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p07", "question": "he perdido el dni, puedo registrarme en clave igualmente?", "answerable": true, "expected": "Sí: además del DNI, la identidad se puede acreditar con el NIE, un certificado electrónico u otro documento que la acredite, y con certificado electrónico el registro se hace por internet en la sede electrónica de la Agencia Tributaria.", "answer": "Para registrarte, los fragmentos indican que, si eres español, necesitas el DNI; también mencionan vías de registro con certificado electrónico o de forma presencial [3][4]. No indican si puedes registrarte específicamente si has perdido el DNI.", "cited": [{"n": 3, "title": "Registrarte en cl@ve", "text": "Registrarte en cl@ve\nCl@ve es un sistema para identificarte electrónicamente ante las Administraciones Públicas con garantías de seguridad, sin tener que recordar claves diferentes para acceder a los distintos servicios.\nTienes más información en la página web de Cl@ve , que también incluye preguntas frecuentes.\nAntes de usar Cl@ve, tienes que registrarte en el sistema, aportando los datos necesarios:\nNúmero de teléfono móvil nacional o extranjero\nCorreo electrónico\nSi eres español, DNI\nSi eres extranjero y tienes NIE : Certificado de registro de ciudadano de la UE, tarjeta de identidad de extranjero o permiso de residencia, y además Pasaporte (si eres ciudadano de la UE, también puedes identificarte con el documento de identidad del país de origen, en lugar del pasaporte)\n​Para garantizar que sólo la persona registrada tiene acceso a los códigos PIN enviados al teléfono móvil, sólo se puede asociar un DNI/NIE a un mismo número de móvil.\nHay 4 formas:"}, {"n": 4, "title": "Registrarte en cl@ve", "text": "Registrarte en cl@ve\nCon vídeoidentificación automática con la App Cl@ve. Siguiendo las instrucciones de la aplicación, obtendrás en pocos minutos el nivel de registro básico en Cl@ve. En un proceso posterior, una vez completada satisfactoriamente la revisión de evidencias electrónicas (vídeo, documento de identidad y biometría facial) por parte de un empleado público autorizado, puedes obtener directamente el nivel de registro avanzado . Temporalmente sólo se ofrece este servicio a personas españolas con DNI en vigor.\nA través de internet, sin certificado electrónico . Este tipo de registro es de nivel básico y no permite acceder a todos los servicios. Puede ser mediante carta de invitación o por videollamada\nA través de internet, con certificado electrónico o DNIe (DNI electrónico). El registro en Cl@ve a través de internet se realiza en la sede electrónica de la Agencia Tributaria (AEAT)\nDe forma presencial . El registro de forma presencial se realiza acudiendo a una oficina de registro Cl@ve\nPuedes encontrar más información en la web de Cl@ve y en las preguntas frecuentes sobre el registro en Cl@ve\nUna vez que te hayas registrado en Cl@ve, hay tres posibilidades de uso:"}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "The document mentions registration with a digital certificate or in person, but it does not say that another document can be used instead of a DNI, nor does it specify that registration with a digital certificate can be completed online at the Tax Agency’s electronic office. The response is not correct."}, "citation_notes": []}, {"id": "p08", "question": "me ha llegado un aviso de notificacion electronica, donde la veo?", "answerable": true, "expected": "En la Dirección Electrónica Habilitada única (DEHú) o en la Carpeta Ciudadana, con certificado digital o Cl@ve; a veces también en la sede electrónica del organismo que la emite.", "answer": "Puedes ver la notificación en la Dirección Electrónica Habilitada única (DEHú) o en Carpeta Ciudadana. Para acceder necesitas un certificado digital o Cl@ve. [2][4] En algunos casos también estará disponible en la sede electrónica del organismo que la envía. [2]", "cited": [{"n": 2, "title": "Notificaciones > Notificaciones electrónicas", "text": "Notificaciones > Notificaciones electrónicas\nEn general, y siempre que esté disponible, la Administración te enviará tus notificaciones de manera electrónica, independientemente de que también elijas recibirlas en formato papel.\nPodrás acceder a tus notificaciones directamente a través de la Dirección Electrónica Habilitada única (DEHú) , o bien a través de tu Carpeta Ciudadana . Para poder acceder a la DEHú o a la Carpeta Ciudadana necesitarás un medio de identificación electrónico (certificado digital o Cl@ve).\nAsimismo, en algunos casos también se puede acceder a las notificaciones electrónicas en las sedes electrónicas de los organismos públicos que las emiten. Dicha información la encontrarás a la hora de realizar el trámite vía electrónica."}, {"n": 4, "title": "Notificaciones > Notificaciones electrónicas", "text": "Notificaciones > Notificaciones electrónicas\nAunque elijas recibir las notificaciones en papel, la Administración suele enviarlas de forma electrónica también, siempre que esta opción esté disponible.\nPuedes acceder a tus notificaciones electrónicas en:\nla Dirección Electrónica Habilitada Única Pincha aquí para acceder a la Dirección Electrónica Habilitada Única\nla Carpeta Ciudadana Pincha aquí para acceder a la Carpeta Ciudadana\nalgunas sedes electrónicas de los organismos que envían las notificaciones. Cuando inicies un trámite de forma electrónica, encontrarás información sobre esto.\nPara acceder a la Carpeta Ciudadana y a la Dirección Electrónica Habilitada Única necesitas un certificado digital o estar registrado en Cl@ve.\nUna persona jurídica es una empresa, entidad o grupos de personas que comparten una responsabilidad.\nUna persona física es una persona real.\nOpositar es participar en un proceso selectivo para conseguir un puesto de trabajo en la Administración Pública."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p09", "question": "cuantos dias tengo para abrir una notificacion electronica antes de que cuente como rechazada", "answerable": false, "expected": null, "answer": "No tengo información suficiente para responder.", "cited": [], "outcome": "declined", "correct_votes": [true, true, true], "grounded_votes": null, "reason": null, "citation_notes": []}, {"id": "p10", "question": "soy autonomo, estoy obligado a hacer los tramites por internet?", "answerable": false, "expected": null, "answer": "Los fragmentos no indican si las personas autónomas están obligadas, en general, a hacer sus trámites por internet. Sí señalan que algunas personas físicas pueden estar obligadas y que depende del trámite concreto [1][4].", "cited": [{"n": 1, "title": "Cómo realizar trámites > Información general", "text": "Cómo realizar trámites > Información general\nEn este apartado puedes conocer los pasos que tienes que seguir para solucionar tus asuntos con un organismo público.\nLa Administración pública se guía por el derecho administrativo.\nEl derecho administrativo es el conjunto de normas que explican cómo tiene que ser la relación entre la ciudadanía y la Administración pública.\nEsto significa que la Administración pública no puede actuar de forma injusta o abusiva ni según sus deseos. Tiene que actuar según el derecho administrativo.\nEsto da la garantía de que tus asuntos con un organismo público se tratarán de forma justa y legal.\nSi no estás conforme con la resolución que recibes de un organismo público, puedes reclamar.\nLa mayoría de veces, la ciudadanía puede hacer todos sus trámites de forma presencial y electrónica.\nPuede ser que tengas la obligación de hacer tus trámites de forma electrónica. Por ejemplo, las empresas, entidades y algunas personas físicas están obligadas a hacer los trámites de forma electrónica.\nTambién puede pasar que un trámite solo se pueda hacer de forma electrónica. Por ejemplo, si opositas .\nDe la misma manera, hay trámites que solo se pueden hacer de forma presencial."}, {"n": 4, "title": "Cómo realizar trámites > Ciudadanos", "text": "Cómo realizar trámites > Ciudadanos\nEn el caso de los ciudadanos , siempre que no estén obligados a relacionarse electrónicamente con la Administración, toda tramitación con la Administración pública se puede llevar a cabo de forma presencial y, en la mayoría de casos, también de forma electrónica . También puedes elegir recibir las notificaciones de la Administración pública tanto en formato papel como de forma electrónica .\nEn el caso de que, debido al trámite particular que estés realizando, estés obligado a relacionarte por medios electrónicos con la Administración, únicamente podrás comunicarte mediante este medio, sin posibilidad de hacerlo presencialmente en formato papel. Consulta más información al respecto en los apartados siguientes de esta página.\nPara obtener más información sobre los trámites existentes, puedes acceder a las distintas secciones del menú Más sobre \"Trámites\" , situado a la derecha de esta página.\nAl expandir este botón se cierra el botón expandido previamente.\nEn caso de que elijas llevar a cabo la tramitación de manera presencial , puedes presentar tus solicitudes en las oficinas de registro . Hay casos, como la obtención del DNI, que únicamente están disponibles de manera presencial."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p11", "question": "puedo entregar un papel en cualquier oficina de registro aunque sea para otro ministerio?", "answerable": false, "expected": null, "answer": "Puedes presentar solicitudes presencialmente en las Oficinas de asistencia en materia de registros [1][3]. Sin embargo, los fragmentos no indican expresamente que pueda ser en cualquier oficina aunque corresponda a otro ministerio. Si el escrito tiene un formulario concreto, se presenta en la sede electrónica del ministerio correspondiente [3].", "cited": [{"n": 1, "title": "Dónde, cómo presentar un escrito > Información sobre la presentación", "text": "Dónde, cómo presentar un escrito > Información sobre la presentación\nPara la mayoría de procedimientos, las Administraciones disponen de un modelo normalizado para realizar las solicitudes. De ello te informarán en las Oficinas de Información o de Asistencia en Materia de Registros y también en las Sedes Electrónicas y Portales públicos de internet de los organismos.\nPuedes presentar tu solicitud:\nEn los registros electrónicos de las Administraciones Públicas.\nEn las oficinas de asistencia en materia de registros (OAMR).\nEn las oficinas de correos. En este caso tienes que entregar el sobre abierto para que sellen tu escrito con la fecha de entrega, y te faciliten copia del mismo.\nSi te encuentras en el extranjero, en las representaciones diplomáticas y oficinas consulares de España. Accede a las Embajadas y Consulados de España en el Extranjero.\nEn cualquier otro que establezcan las disposiciones vigentes.\nAccede al Buscador de oficinas del Punto de Acceso General.\nPuedes presentar tu solicitud en soporte papel o por medios informáticos, electrónicos o telemáticos en los registros electrónicos. Las oficinas de asistencia en materia de registros tienen un horario concreto para que puedas presentar tu solicitud, mientras que los registros electrónicos están abiertos las 24 horas al día los 365 días del año."}, {"n": 3, "title": "Presentar un escrito > Cómo presentar", "text": "Presentar un escrito > Cómo presentar\nPuedes presentar tu solicitud de forma presencial o por vía electrónica.\nPara hacerlo de forma electrónica, puedes utilizar a los registros electrónicos, donde puedes presentar tu solicitud a cualquier hora en cualquier día del año.\nPara hacerlo de forma presencial, puedes ir a las Oficinas de asistencia en materia de registros.\nEstas oficinas tienen un horario.\nLas solicitudes y escritos que tienen un formulario concreto se presentan en la sede electrónica del ministerio que corresponda.\nAccede a las Sedes Electrónicas de la Administración General del Estado y los Departamentos Ministeriales\nHay solicitudes y escritos que no tienen un formulario concreto.\nEstas solicitudes se pueden presentar en el Registro Electrónico de la Administración General del Estado.\nAccede al Registro Electrónico de la Administración General del Estado\nTambién puedes acudir a las Oficinas de asistencia en materia de registro y te ayudarán a presentar tu solicitud en el Registro Electrónico de la Administración General del Estado o en las sedes electrónicas de los Ministerios.\nEn vigor significa que está activo y no ha caducado."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p12", "question": "que es la sede electronica", "answerable": true, "expected": "Es la dirección de internet a través de la cual se realizan los trámites de una administración u organismo público; equivale a la sede física.", "answer": "La sede electrónica es el sitio web de una Administración donde puedes realizar trámites y gestiones por Internet. [6]", "cited": [{"n": 6, "title": "Relacionarte con la Administración de forma electrónica > Portales de internet y sedes electrónicas", "text": "Relacionarte con la Administración de forma electrónica > Portales de internet y sedes electrónicas\nPortal de Internet\nEs el sitio web de una Administración. Tiene información sobre esa Administración Pública.\nEs el lugar al que puedes entrar sin clave ni contraseña para consultar información de interés.\nSede electrónica\nEs el sitio web en el que puedes hacer trámites y gestiones a través de Internet.\nPor ejemplo, presentar una solicitud para pedir una subvención.\nLa mayoría de las veces, puedes acceder a la sede electrónica de una Administración Pública a través de su portal de internet.\nUna persona jurídica es una empresa, entidad o un grupo de personas que comparten responsabilidad.\nUn proceso selectivo es un conjunto de pruebas que se deben pasar para conseguir una plaza de empleo público."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p13", "question": "que diferencia hay entre el portal y la sede electronica", "answerable": true, "expected": "El portal da acceso a la información que publica la Administración; la sede electrónica es donde se realizan los trámites.", "answer": "El portal de internet ofrece información sobre una Administración y permite acceder a su sede electrónica. La sede electrónica es el sitio web donde puedes realizar trámites y gestiones por internet. [1][2]", "cited": [{"n": 1, "title": "Relacionarte electrónicamente con la Administración > Portales de Internet y Sedes Electrónicas", "text": "Relacionarte electrónicamente con la Administración > Portales de Internet y Sedes Electrónicas\nPor lo general, podemos distinguir entre dos tipos de sitios web a través de los cuáles te puedes relacionar electrónicamente con la Administraciones Públicas. ¿Cuáles son las diferencias?:\nPortal de internet. Es el punto de acceso electrónico a través del cual puedes acceder, a través de internet, a la información que publica una Administración Pública u organismo público. También te permite el acceso a la sede electrónica correspondiente.\nSede electrónica. Es la dirección de internet a través de la cual puedes realizar los trámites correspondientes a una administración u organismo público. Las sedes electrónicas son el equivalente a las sedes físicas donde la ciudadanía se dirige para hacer un trámite."}, {"n": 2, "title": "Relacionarte con la Administración de forma electrónica > Portales de internet y sedes electrónicas", "text": "Relacionarte con la Administración de forma electrónica > Portales de internet y sedes electrónicas\nPortal de Internet\nEs el sitio web de una Administración. Tiene información sobre esa Administración Pública.\nEs el lugar al que puedes entrar sin clave ni contraseña para consultar información de interés.\nSede electrónica\nEs el sitio web en el que puedes hacer trámites y gestiones a través de Internet.\nPor ejemplo, presentar una solicitud para pedir una subvención.\nLa mayoría de las veces, puedes acceder a la sede electrónica de una Administración Pública a través de su portal de internet.\nUna persona jurídica es una empresa, entidad o un grupo de personas que comparten responsabilidad.\nUn proceso selectivo es un conjunto de pruebas que se deben pasar para conseguir una plaza de empleo público."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p14", "question": "no tengo certificado ni clave, como presento una solicitud?", "answerable": true, "expected": "Si no tienes obligación de relacionarte electrónicamente, puedes presentarla de forma presencial en una oficina de registro; también tienes derecho a asistencia, incluida la de un funcionario habilitado que actúa en tu nombre.", "answer": "Puedes presentarla **en papel**, acudiendo a una Oficina de asistencia en materia de registros. También puedes entregarla en una oficina de correos con el sobre abierto para que sellen el escrito y te den una copia [10].\n\nSi estás en el extranjero, puedes acudir a una representación diplomática u oficina consular de España [10]. Los fragmentos indican que para presentar electrónicamente necesitas DNI electrónico o certificado electrónico en vigor [9].", "cited": [{"n": 9, "title": "Presentar un escrito", "text": "Presentar un escrito\n¡Importante!\nPara presentar tu solicitud o escrito de forma electrónica necesitas DNI electrónico o certificado electrónico en vigor . Con ellos puedes firmar la solicitud.\nAccede al sitio web de Firma electrónica y recibe más información\nNormas y Leyes que explican cómo presentar un escrito\nLey 39/2015, de 1 de octubre , del Procedimiento Administrativo Común de las Administraciones Públicas"}, {"n": 10, "title": "Dónde, cómo presentar un escrito > Información sobre la presentación", "text": "Dónde, cómo presentar un escrito > Información sobre la presentación\nPara la mayoría de procedimientos, las Administraciones disponen de un modelo normalizado para realizar las solicitudes. De ello te informarán en las Oficinas de Información o de Asistencia en Materia de Registros y también en las Sedes Electrónicas y Portales públicos de internet de los organismos.\nPuedes presentar tu solicitud:\nEn los registros electrónicos de las Administraciones Públicas.\nEn las oficinas de asistencia en materia de registros (OAMR).\nEn las oficinas de correos. En este caso tienes que entregar el sobre abierto para que sellen tu escrito con la fecha de entrega, y te faciliten copia del mismo.\nSi te encuentras en el extranjero, en las representaciones diplomáticas y oficinas consulares de España. Accede a las Embajadas y Consulados de España en el Extranjero.\nEn cualquier otro que establezcan las disposiciones vigentes.\nAccede al Buscador de oficinas del Punto de Acceso General.\nPuedes presentar tu solicitud en soporte papel o por medios informáticos, electrónicos o telemáticos en los registros electrónicos. Las oficinas de asistencia en materia de registros tienen un horario concreto para que puedas presentar tu solicitud, mientras que los registros electrónicos están abiertos las 24 horas al día los 365 días del año."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento indica que se puede presentar en papel acudiendo a una Oficina de asistencia en materia de registros. Sin embargo, no menciona la condición de que solo pueda hacerse así si no se tiene obligación de usar la vía electrónica. The response is not correct"}, "citation_notes": []}, {"id": "p15", "question": "el dni electronico sirve para firmar?", "answerable": true, "expected": "Sí, el DNI electrónico permite firmar electrónicamente.", "answer": "Sí, el DNI electrónico permite firmar electrónicamente [1][3].", "cited": [{"n": 1, "title": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico", "text": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico\nCertificado software\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas instalarlo en un dispositivo electrónico (como un PC)\nSi quieres utilizarlo en varios dispositivos, tendrás que exportarlo e instalarlo en cada uno de ellos\nDNI electrónico\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nNo necesitas instalarlo en un dispositivo electrónico\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas un lector de tarjetas. A partir de la versión 3.0 del DNIe puedes utilizar el móvil como lector de tarjetas\nPuedes necesitar instalar algún programa informático adicional\nCl@ve\nVentajas:\nNo necesitas instalarlo en un dispositivo electrónico\nPuedes utilizarlo desde cualquier dispositivo (PC o móvil)\nInconvenientes:\nNo puedes utilizarlo en todos los procedimientos y trámites\nNo puedes utilizarlo en todas las Administraciones públicas\nNo te permite firmar electrónicamente"}, {"n": 3, "title": "Identificación electrónica > Características de los sistemas de identificación", "text": "Identificación electrónica > Características de los sistemas de identificación\nCertificado software\nVentajas\nTe puedes identificar con él para hacer cualquier trámite de la Administración.\nPuedes firmar documentos.\nDesventajas\nTienes que instalarlo en un dispositivo, como un ordenador, una tablet o un móvil.\nSi lo quieres utilizar en varios dispositivos tienes que instalarlo en cada uno de ellos.\nDNI electrónico\nVentajas\nTe puedes identificar con él para hacer cualquier trámite de la Administración.\nNo tienes que instalarlo en ningún dispositivo.\nPuedes firmar documentos.\nDesventajas\nNecesitas un lector de tarjetas. Es un aparato que permite al dispositivo que usas leer el DNI electrónico. Si tienes la versión 3.0 o una superior del DNI electrónico puedes usar tu móvil como lector de tarjetas. Pincha aquí para más información .\nEs posible que tengas que instalar algún programa para usarlo.\nCl@ve\nVentajas\nNo necesitas instalarla en tu dispositivo.\nPuedes usarla desde cualquier dispositivo, ordenador, móvil o tablet.\nDesventajas\nSolo puedes hacer algunos trámites, no sirve para todos.\nRegular es definir cómo debe hacerse una tarea o función y con qué normas."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p16", "question": "que necesito para usar el dnie en el ordenador", "answerable": true, "expected": "Un lector de tarjetas (desde la versión 3.0 del DNIe sirve el móvil) y puede que algún programa adicional.", "answer": "Para usar el DNIe en el ordenador necesitas un lector de tarjetas; si tienes la versión 3.0 o superior, puedes usar el móvil como lector. También es posible que necesites instalar algún programa adicional. [3]", "cited": [{"n": 3, "title": "Identificación electrónica > Características de los sistemas de identificación", "text": "Identificación electrónica > Características de los sistemas de identificación\nCertificado software\nVentajas\nTe puedes identificar con él para hacer cualquier trámite de la Administración.\nPuedes firmar documentos.\nDesventajas\nTienes que instalarlo en un dispositivo, como un ordenador, una tablet o un móvil.\nSi lo quieres utilizar en varios dispositivos tienes que instalarlo en cada uno de ellos.\nDNI electrónico\nVentajas\nTe puedes identificar con él para hacer cualquier trámite de la Administración.\nNo tienes que instalarlo en ningún dispositivo.\nPuedes firmar documentos.\nDesventajas\nNecesitas un lector de tarjetas. Es un aparato que permite al dispositivo que usas leer el DNI electrónico. Si tienes la versión 3.0 o una superior del DNI electrónico puedes usar tu móvil como lector de tarjetas. Pincha aquí para más información .\nEs posible que tengas que instalar algún programa para usarlo.\nCl@ve\nVentajas\nNo necesitas instalarla en tu dispositivo.\nPuedes usarla desde cualquier dispositivo, ordenador, móvil o tablet.\nDesventajas\nSolo puedes hacer algunos trámites, no sirve para todos.\nRegular es definir cómo debe hacerse una tarea o función y con qué normas."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p17", "question": "cuanto cuesta el certificado digital de la fnmt", "answerable": true, "expected": "Es gratuito; solo la obtención con vídeo identificación cuesta 2,99 € más impuestos.", "answer": "El certificado de ciudadano de la FNMT es gratuito. Si lo obtienes mediante vídeo identificación, el servicio cuesta 2,99 € más impuestos. [1]", "cited": [{"n": 1, "title": "Obtención del Certificado Electrónico de la FNMT", "text": "Obtención del Certificado Electrónico de la FNMT\n¿Tiene coste la obtención de un certificado de ciudadano?\nNo. El certificado de ciudadano de la FNMT es gratuito .\nÚnicamente, en el caso de que obtengas el certificado con vídeo identificación, tendrás que abonar un coste de 2,99€ más impuestos por este servicio.\n¿Qué pasos debo seguir para obtener el certificado de ciudadano?\nA lo largo del proceso de obtención del certificado, será necesario que acredites tu identidad. Hay 3 formas de acreditar tu identidad:"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p18", "question": "se me ha caducado el certificado digital, como lo renuevo?", "answerable": true, "expected": "La renovación se puede hacer durante los 60 días previos a la caducidad, si no ha sido revocado.", "answer": "La renovación se puede hacer durante los 60 días anteriores a la caducidad, siempre que el certificado no haya sido revocado [1]; también se indica que debe estar activo [2]. Los fragmentos no indican cómo renovarlo una vez caducado.", "cited": [{"n": 1, "title": "Obtención del Certificado Electrónico de la FNMT > ¿Cómo renovar mi certificado de ciudadano?", "text": "Obtención del Certificado Electrónico de la FNMT > ¿Cómo renovar mi certificado de ciudadano?\nPuedes llevar a cabo la renovación de tu certificado durante los 60 días previos a la fecha de caducidad del certificado, siempre y cuando no haya sido previamente revocado.\nPara más información, consulta la sede electrónica de la FNMT:\nPasos a seguir sobre la renovación de tu certificado\nDudas frecuentes (cómo saber cuándo caduca tu certificado, etc.)"}, {"n": 2, "title": "Obtener el certificado electrónico de la Fábrica Nacional de Moneda y Timbre", "text": "Obtener el certificado electrónico de la Fábrica Nacional de Moneda y Timbre\n¿Cómo puedes renovar tu certificado?\nSi tu certificado está activo, puedes renovarlo durante 60 días antes de que caduque.\nPuedes encontrar más información en las páginas de la Fábrica Nacional de Moneda y Timbre:\nRenovar tu certificado\nDudas frecuentes\nPreguntas frecuentes sobre el certificado de ciudadano\nPara conseguir más información o consultar dudas sobre el certificado de ciudadano, puedes consultar la página de preguntas frecuentes de la Fábrica Nacional de Moneda y Timbre."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p19", "question": "tengo que pedir cita para acreditar mi identidad para el certificado?", "answerable": false, "expected": null, "answer": "Para la acreditación presencial, debes acudir a una oficina con el código de solicitud y la documentación correspondiente [1]. Los fragmentos no indican si hace falta pedir cita. También mencionan la acreditación electrónica mediante vídeo identificación o DNIe [2].", "cited": [{"n": 1, "title": "Obtención del Certificado Electrónico de la FNMT > ¿Qué pasos debo seguir para obtener el certificado de ciudadano? > Antes de solicitar el certificado", "text": "Obtención del Certificado Electrónico de la FNMT > ¿Qué pasos debo seguir para obtener el certificado de ciudadano? > Antes de solicitar el certificado\nAccede a esta página de la sede electrónica de la FNMT y rellena el formulario, siguiendo las instrucciones que se indican.\nUna vez cumplimentado el formulario, lee y acepta las condiciones de expedición del certificado y pulsa el botón de “enviar petición”.\nTerminado este proceso, recibirás un código de solicitud en tu correo electrónico, que necesitarás para el siguiente paso.\nSi ya tuvieras un certificado de ciudadano, al solicitar el nuevo, se dejaría sin efecto el que ya tengas.\nPaso 3. Acreditar tu identidad\nPara acreditar tu identidad, debes ir a una oficina presencialmente, llevando\nSi tu nacionalidad es española, tu DNI\nSi tu nacionalidad es extranjera, tu NIE y pasaporte\nEn los 2 casos anteriores, el código de solicitud que recibiste al realizar el paso 2\nPuedes consultar aquí el mapa de oficinas . Debes elegir la opción de certificados de persona física.\nUna vez que hayas acreditado tu identidad en una oficina, podrás descargar tu certificado inmediatamente en tu ordenador; se recomienda descargarlo lo antes posible.\nConsulta la sede electrónica de la FNMT para más información sobre cómo acreditar tu identidad ."}, {"n": 2, "title": "Obtención del Certificado Electrónico de la FNMT > ¿Qué pasos debo seguir para obtener el certificado de ciudadano?", "text": "Obtención del Certificado Electrónico de la FNMT > ¿Qué pasos debo seguir para obtener el certificado de ciudadano?\nPresencialmente, en una oficina\nElectrónicamente, con vídeo identificación\nElectrónicamente, utilizando tu DNIe\nSegún como vayas a acreditar tu identidad, hay 4 formas de obtener el certificado:\nObtención del certificado con acreditación presencial\nObtención del certificado con vídeo identificación\nObtención del certificado utilizando tu DNIe\nObtención del certificado a través de la App\nA continuación, te indicamos los pasos a seguir para obtener el certificado con acreditación presencial.\nAntes de solicitar el certificado\nAntes de solicitar el certificado, tienes que decidir en qué equipo informático (ordenador) quieres tenerlo instalado, ya que la solicitud debes hacerla desde ese mismo ordenador.\nA continuación, tienes que seguir 4 pasos , que te explicamos seguidamente.\nLa configuración previa consiste en que tienes que asegurarte de que tu ordenador tiene instalados los programas informáticos (software) necesarios para poder solicitar el certificado e instalarlo.\nPaso 1. Configuración previa de tu equipo informático\nConsulta en la sede electrónica de la FNMT los detalles para realizar la configuración, así como instrucciones para evitar posibles errores durante el proceso de obtención del certificado.\nPaso 2. Solicitar el certificado"}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p20", "question": "no me llega el sms de clave pin, que hago", "answerable": true, "expected": "Puedes comunicarlo a través del formulario de soporte para dudas o problemas con Cl@ve.", "answer": "Puedes comunicar el problema mediante el formulario de dudas o problemas con Cl@ve [5]. Los fragmentos no indican una solución específica para cuando no llega el SMS de Cl@ve PIN.", "cited": [{"n": 5, "title": "Registrarte en Cl@ve", "text": "Registrarte en Cl@ve\nNormas y leyes\nResolución de 14 de diciembre de 2015 , de la Dirección de Tecnologías de la Información y las Comunicaciones, por la que se establecen las prescripciones técnicas necesarias para el desarrollo y aplicación del sistema Cl@ve.\nMás información\nPuedes ver los vídeos sobre Cl@ve PIN en la sección de vídeos de la Agencia Tributaria\nSi tienes algún problema o duda, puedes comunicarlo a través del formulario para dudas o problemas con Cl@ve."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p21", "question": "que es la dehu", "answerable": true, "expected": "Es la Dirección Electrónica Habilitada única, donde puedes acceder a tus notificaciones electrónicas con certificado digital o Cl@ve.", "answer": "La DEHú (Dirección Electrónica Habilitada única) permite acceder a notificaciones y comunicaciones de Administraciones Públicas adheridas; también puedes leer comunicaciones y comparecer notificaciones propias o de personas representadas con un sistema de autenticación admitido por Cl@ve. [1]", "cited": [{"n": 1, "title": "Aplicaciones móviles para la ciudadanía > Aplicaciones móviles del Punto de Acceso General", "text": "Aplicaciones móviles para la ciudadanía > Aplicaciones móviles del Punto de Acceso General\nEnlaces para su descarga:\nLíneas de ayuda en Play Store (para Android)\nLíneas de ayuda en App Store (para iOs)\nDeclaración de Accesibilidad de la App Líneas de Ayuda\nLa App Mi carpeta Ciudadana facilita a la ciudadanía su relación con las Administraciones Públicas de forma sencilla y ágil desde un único lugar.\nCon Mi carpeta Ciudadana dispondrás, de forma agregada, de tu información personal y de tus gestiones realizadas con diferentes Administraciones Públicas.\nEnlaces para su descarga:\nMi carpeta ciudadana en Play Store (para Android)\nMi carpeta ciudadana en App Store (para iOs)\nMás información y declaración de accesibilidad de la App Mi carpeta ciudadana\nNotifica App (Dirección Electrónica Habilitada única) facilita a la ciudadanía el acceso y comparecencia a las notificaciones y comunicaciones emitidas por las Administraciones Públicas adheridas.\nCon DEHú podrás leer tus comunicaciones y comparecer tus notificaciones o las de tus representados. Para ello, sólo es necesario que dispongas de cualquiera de los sistemas de autenticación admitidos por la plataforma Cl@ve.\nEnlaces para su descarga:\nNotifica App en Play Store (para Android)\nNotifica App en App Store (para iOs)\nDeclaración de accesibilidad de la App móvil DEHú"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p22", "question": "si me notifican en papel y por internet a la vez, cual vale?", "answerable": false, "expected": null, "answer": "La Administración suele enviar también la notificación electrónica, aunque hayas elegido recibirla en papel, si esa opción está disponible [1]. Los fragmentos no indican cuál vale si recibes ambas.", "cited": [{"n": 1, "title": "Notificaciones > Notificaciones electrónicas", "text": "Notificaciones > Notificaciones electrónicas\nAunque elijas recibir las notificaciones en papel, la Administración suele enviarlas de forma electrónica también, siempre que esta opción esté disponible.\nPuedes acceder a tus notificaciones electrónicas en:\nla Dirección Electrónica Habilitada Única Pincha aquí para acceder a la Dirección Electrónica Habilitada Única\nla Carpeta Ciudadana Pincha aquí para acceder a la Carpeta Ciudadana\nalgunas sedes electrónicas de los organismos que envían las notificaciones. Cuando inicies un trámite de forma electrónica, encontrarás información sobre esto.\nPara acceder a la Carpeta Ciudadana y a la Dirección Electrónica Habilitada Única necesitas un certificado digital o estar registrado en Cl@ve.\nUna persona jurídica es una empresa, entidad o grupos de personas que comparten una responsabilidad.\nUna persona física es una persona real.\nOpositar es participar en un proceso selectivo para conseguir un puesto de trabajo en la Administración Pública."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p23", "question": "que es el registro electronico general", "answerable": true, "expected": "El Registro Electrónico General de la AGE (REG-AGE) sirve para enviar documentos, como solicitudes, comunicaciones o escritos, a los servicios públicos por medios electrónicos; también acepta documentos para otras Administraciones Públicas.", "answer": "El Registro Electrónico General de la AGE (REG-AGE) permite enviar documentos a los servicios públicos por medios electrónicos, como solicitudes, comunicaciones y escritos. También puedes presentar trámites dirigidos a la Administración General del Estado, salvo que se indique una forma concreta de hacerlo, y enviar documentos a otras Administraciones Públicas [1].", "cited": [{"n": 1, "title": "Registro Electrónico General de la AGE > ¿Qué es el Registro Electrónico General?", "text": "Registro Electrónico General de la AGE > ¿Qué es el Registro Electrónico General?\nSirve para que la ciudadanía envíe documentos a los servicios públicos por medios electrónicos de forma rápida y eficaz. Por ejemplo, comunicaciones, solicitudes o escritos.\nEn el REG-AGE puedes presentar solicitudes, comunicaciones y hacer trámites en la Administración General del Estado. Excepto si las Administraciones indican una manera concreta de hacer un trámite.\nTambién acepta documentos para otras Administraciones Públicas. Como Comunidades Autónomas o entidades locales.\nTodas las acciones y documentos que se registren en el REG-AGE se anotarán en el libro de registro del REG-AGE."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p24", "question": "cual es el horario del telefono 060", "answerable": false, "expected": null, "answer": "El teléfono 060 ofrece atención automática las 24 horas, todos los días. La atención por agentes generalistas es de lunes a viernes, de 9:00 a 19:00, y los sábados, de 9:00 a 14:00, excepto festivos nacionales. En agosto, de lunes a viernes, el horario se reduce a 9:00-15:00. Los días 24 y 31 de diciembre, la atención es de 9:00 a 14:00. El horario de agentes especializados depende de cada servicio. [3]", "cited": [{"n": 3, "title": "Teléfono 060 > Información sobre el teléfono 060", "text": "Teléfono 060 > Información sobre el teléfono 060\nEl teléfono 060 es un servicio de información que la Administración General del Estado pone a tu disposición. Te ofrece información administrativa general sobre los servicios públicos y trámites de la Administración General del Estado.\nLlamando al 060 puedes informarte sobre empleo público, ayudas, subvenciones y becas, localización de órganos de las Administraciones públicas, asistencia técnica sobre servicios electrónicos de la Administración General del Estado e información de Ministerios y organismos integrados (extranjería, Dirección General de Tráfico, Servicio Público de Empleo Estatal, etc.).\nEl teléfono 060 informa a través de locuciones automatizadas y, en función de la temática y del horario, también por agentes generalistas o especializados, según el caso.\nAtención automática: Horario ininterrumpido, 24 horas todos los días del año.\nAtención por un agente generalista : De lunes a viernes, de 9.00 a 19.00 horas ininterrumpidamente, excepto festivos nacionales.Durante el mes de agosto, el horario se reduce: de 9.00 a 15.00 horas ininterrumpidamente. Sábados, de 9.00 a 14.00 horas, excepto festivos nacionales. Horario especial de Navidad: Días 24 y 31 de Diciembre, de 9.00 a 14.00 horas.\nAtención por un agente especializado: Horario dependiente de cada servicio."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento sí proporciona el horario del teléfono 060: atención automática las 24 horas y horarios específicos para agentes generalistas. Por tanto, la afirmación de que no hay información suficiente no está respaldada."}, "citation_notes": []}, {"id": "p25", "question": "puede otra persona hacer un tramite por mi?", "answerable": false, "expected": null, "answer": "Sí, otra persona puede hacer por ti los trámites que estén inscritos y permitan la representación mediante una persona apoderada [3]. Para ello, debe registrarse el apoderamiento; si lo registra la persona apoderada, se necesita un documento firmado por ambas personas que explique la representación [1].", "cited": [{"n": 1, "title": "Registro Electrónico de Apoderamientos > Preguntas frecuentes", "text": "Registro Electrónico de Apoderamientos > Preguntas frecuentes\nLo puede hacer la persona apoderada o la persona poderdante .\nDe forma electrónica a través del Punto de Acceso General de la Administración General del Estado.\nLa persona apoderada solo podrá hacerlo de forma electrónica con un certificado electrónico de representante.\nCuando lo inscriba la persona apoderada, tendrá que presentar un documento que explique que la persona interesada quiere que la persona apoderada le represente.\nEste documento tiene que estar firmado de forma electrónica por ella y por la persona interesada.\nEste documento puede ser un poder notarial o un documento privado entre la persona interesada y la apoderada.\nSi es un documento privado, solo se puede presentar por comparecencia electrónica .\nPincha aquí para acceder a la aplicación del REA-AGE\nUna persona física es una persona real.\nUna persona jurídica es una empresa, entidad o un grupo de personas que comparten responsabilidad.\n¿Cómo se registra un apoderamiento de persona física?\nSi la persona interesada y la persona apoderada son personas físicas , pueden registrar el apoderamiento de forma presencial o electrónica."}, {"n": 3, "title": "Registro Electrónico de Apoderamientos > Preguntas frecuentes", "text": "Registro Electrónico de Apoderamientos > Preguntas frecuentes\n¿Cómo se registra un apoderamiento de persona jurídica?\nSi la persona interesada o la persona apoderada es una persona jurídica , deben registrar el apoderamiento de forma electrónica.\n¿Qué apoderamientos se pueden registrar en el REA-AGE?\nHay 3 tipos:\nApoderamiento tipo A Sirve para cualquier actuación o trámite en cualquier Administración Pública.\nApoderamiento tipo B Sirve para cualquier actuación o trámite en una sola Administración u órganismo público.\nApoderamiento tipo C Solo sirve para algunas actuaciones o trámites concretos.\n¿Qué puede hacer una persona poderdante por internet?\nRegistrar un apoderamiento para uno o varios trámites.\nConsultar sus apoderamientos.\nAmpliar la validez de sus apoderamientos.\nCancelar apoderamientos.\n¿Qué puede hacer una persona apoderada por internet?\nConsultar sus apoderamientos.\nRenunciar a apoderamientos.\nAceptar apoderamientos.\n¿Para qué trámites puedo apoderar?\nPara los trámites que se hayan inscrito en el Sistema de Información Administrativa y que indique que se pueden hacer por una persona apoderada.\nInfórmate en la página web de cada Administración para saber que trámites son.\nIV es un número romano. Significa 4."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento sí ofrece información para responder: indica que otra persona puede hacer ciertos trámites en representación de quien consulta, siempre que lo permitan y se registre el apoderamiento. Por tanto, la afirmación de que no hay información suficiente no está respaldada."}, "citation_notes": []}, {"id": "p26", "question": "puedo usar mi certificado de persona fisica para los tramites de mi empresa?", "answerable": true, "expected": "Existen otros certificados, como el de empresa; como persona física, el que corresponde es el certificado de ciudadano.", "answer": "El certificado de persona física te identifica como persona, pero los fragmentos no indican si puedes usarlo, en general, para hacer trámites de tu empresa [2]. En el Registro Electrónico de Apoderamientos, si actúas como persona apoderada, solo puedes inscribir el apoderamiento electrónicamente con un certificado de representante [1].", "cited": [{"n": 1, "title": "Registro Electrónico de Apoderamientos > Preguntas frecuentes", "text": "Registro Electrónico de Apoderamientos > Preguntas frecuentes\nLo puede hacer la persona apoderada o la persona poderdante .\nDe forma electrónica a través del Punto de Acceso General de la Administración General del Estado.\nLa persona apoderada solo podrá hacerlo de forma electrónica con un certificado electrónico de representante.\nCuando lo inscriba la persona apoderada, tendrá que presentar un documento que explique que la persona interesada quiere que la persona apoderada le represente.\nEste documento tiene que estar firmado de forma electrónica por ella y por la persona interesada.\nEste documento puede ser un poder notarial o un documento privado entre la persona interesada y la apoderada.\nSi es un documento privado, solo se puede presentar por comparecencia electrónica .\nPincha aquí para acceder a la aplicación del REA-AGE\nUna persona física es una persona real.\nUna persona jurídica es una empresa, entidad o un grupo de personas que comparten responsabilidad.\n¿Cómo se registra un apoderamiento de persona física?\nSi la persona interesada y la persona apoderada son personas físicas , pueden registrar el apoderamiento de forma presencial o electrónica."}, {"n": 2, "title": "Obtención del Certificado Electrónico de la FNMT > ¿Qué es el certificado electrónico de ciudadano?", "text": "Obtención del Certificado Electrónico de la FNMT > ¿Qué es el certificado electrónico de ciudadano?\nEl certificado electrónico de ciudadano se llama también de persona física o de usuario. Hay otros certificados, como el de empresa o el de sector público. Como persona física, el que te interesa solicitar es el certificado de ciudadano. El certificado electrónico de ciudadano es un documento digital que contiene tus datos identificativos. El certificado te permite identificarte en Internet y también intercambiar información con otras personas y organismos, con la garantía de que sólo tú y tu interlocutor podéis acceder a esta información."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento distingue el certificado de persona física de un certificado de representante, y dice que este último se exige para inscribir electrónicamente un apoderamiento en el Registro. Pero no afirma que exista un certificado de empresa distinto del de ciudadano. The response is not correct"}, "citation_notes": []}, {"id": "p27", "question": "como copio el certificado digital a otro ordenador", "answerable": true, "expected": "Hay que exportarlo e instalarlo en cada dispositivo.", "answer": "Si es un certificado software, debes exportarlo e instalarlo en el otro ordenador. [1]", "cited": [{"n": 1, "title": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico", "text": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico\nCertificado software\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas instalarlo en un dispositivo electrónico (como un PC)\nSi quieres utilizarlo en varios dispositivos, tendrás que exportarlo e instalarlo en cada uno de ellos\nDNI electrónico\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nNo necesitas instalarlo en un dispositivo electrónico\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas un lector de tarjetas. A partir de la versión 3.0 del DNIe puedes utilizar el móvil como lector de tarjetas\nPuedes necesitar instalar algún programa informático adicional\nCl@ve\nVentajas:\nNo necesitas instalarlo en un dispositivo electrónico\nPuedes utilizarlo desde cualquier dispositivo (PC o móvil)\nInconvenientes:\nNo puedes utilizarlo en todos los procedimientos y trámites\nNo puedes utilizarlo en todas las Administraciones públicas\nNo te permite firmar electrónicamente"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p28", "question": "cuanto tarda la administracion en contestar a una solicitud", "answerable": false, "expected": null, "answer": "Los fragmentos no indican un plazo general para que la Administración conteste. En el caso concreto de una solicitud de información accesible o queja sobre la App Líneas de Ayuda, puede presentarse una reclamación si pasan 20 días hábiles sin respuesta [2].", "cited": [{"n": 2, "title": "Declaración de Accesibilidad de la App Líneas de Ayuda > Procedimiento de aplicación", "text": "Declaración de Accesibilidad de la App Líneas de Ayuda > Procedimiento de aplicación\nSi una vez realizada una solicitud de información accesible o queja, ésta hubiera sido desestimada, no se estuviera de acuerdo con la decisión adoptada, o la respuesta no cumpliera los requisitos contemplados en el artículo 12.5, la persona interesada podrá iniciar una reclamación. Igualmente se podrá iniciar una reclamación en el caso de que haya trascurrido el plazo de veinte días hábiles sin haber obtenido respuesta.\nLa reclamación puede ser presentada través del siguiente procedimiento de reclamación , así como en el resto de las opciones recogidas en la Ley 39/ 2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas.\nLas comunicaciones serán recibidas y tratadas por la Dirección General de Gobernanza Pública, órgano directivo dependiente de la Secretaría de Estado de Función Pública del Ministerio para la Transformación Digital y de la Función Pública."}], "outcome": "faithful", "correct_votes": [false, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p29", "question": "como pido el paro", "answerable": false, "expected": null, "answer": "Los fragmentos no indican cómo solicitar el paro. Sí incluyen el Servicio Público de Empleo Estatal (SEPE) entre los servicios electrónicos frecuentes [5].", "cited": [{"n": 5, "title": "Servicios electrónicos frecuentes", "text": "Servicios electrónicos frecuentes\nSolicitud de cita previa\nRegistro en Cl@ve\nCertificado electrónico FNMT\nRegistro electrónico: https://reg.redsara.es/\nNotificaciones Dirección Electrónica Habilitada ÚNica (DEHú): https://dehu.redsara.es/\nAgencia Tributaria: https://sede.agenciatributaria.gob.es/\nCertificados seguridad social: https://sede.seg-social.gob.es/wps/portal/sede/sede/Inicio/!ut/p/z1/hVBNb8IwDP0tHHqkdhXSD249IMSAwzRVlFxQQGnJFJIqyejfn0V32waW7KdnP3_IIKAFYeVd9zJqZ6UhfhT5iWX5Iqsw261xs8K62W-bir0zrDI4PAT4j9UI4lW_eC7BH8GTFW8geuPO07m1PbOyB-FVp7zy6Zen9DXGYZlgguM4pkH18-AuWppUBUoNFAbnozREAhFto_JWxQQ3tnP-Ji_0jCZqqnOGNKUoOU-QFQssCTjmExR8YsVfd1xdiND-2g8f5MOtxU9u7ruunn0DcJ8Q0g!!/dz/d5/L2dBISEvZ0FBIS9nQSEh/\nServicio Público de Empleo Estatal: https://sede.sepe.gob.es/portalSede/es/\nDirección General de Tráfico: https://sede.dgt.gob.es/es/"}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p30", "question": "cuanto cobra el ingreso minimo vital", "answerable": false, "expected": null, "answer": "El fragmento indica que puedes informarte sobre el Ingreso Mínimo Vital llamando al 020 [1], pero no especifica cuánto se cobra.", "cited": [{"n": 1, "title": "Información para personas afectadas por la DANA > Infografías:", "text": "Información para personas afectadas por la DANA > Infografías:\nEl Ministerio pone medidas de protección a disposición de las personas trabajadoras autónomas, que podrán solicitar el cese de actividad ante la mutua de la persona trabajadora. La cuantía de la prestación es del 70% de la base reguladora. Sin periodo de carencia, es decir, aunque no se tenga el periodo mínimo exigido para tener derecho a ello, que normalmente es de un año Los días de prestación consumidos no se computan de cara a situaciones futuras (contador a cero) y, además, este periodo se les computa como cotizado.\nDesde la reforma laboral permite proteger a las personas trabajadoras y al tejido productivo en situaciones de crisis y emergencias como la DANA. La empresa puede suspender temporalmente el contrato o reducir la jornada. Exención del 100% de las cotizaciones a la Seguridad Social Cualquier persona trabajadora puede acogerse sin consumir la prestación. Se solicita en el SEPE o llamando al 96 123 9327\nEn cuanto al Ingreso Mínimo Vital (IMV), reforzamos, el compromiso y el contacto con las personas de manera más ágil y cercana. La ciudadanía podrá informarse sobre el IMV en el teléfono corto 020 . Con un 40% más de plantilla."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p31", "question": "donde renuevo el dni", "answerable": true, "expected": "La obtención del DNI solo se hace de forma presencial, con cita previa del Ministerio del Interior.", "answer": "Si perdiste el DNI por la DANA, la Policía Nacional dispone de unidades móviles; puedes consultar su ubicación en el mapa indicado [1]. Los fragmentos no indican dónde renovar el DNI en general.", "cited": [{"n": 1, "title": "Información para personas afectadas por la DANA", "text": "Información para personas afectadas por la DANA\nÚltima actualización 28/10/2026\nEn esta página encontrarás información de interés relacionada con la DANA.\nMapa de Oficinas de la Administración General del Estado y de Correos en la zona de la DANA en Valencia\nMapa de Oficinas y Unidades Móviles de la Policía Nacional\nMapa de Oficinas Info DANA : oficinas para facilitar el trámite de las ayudas\nEl Gobierno incorpora oficinas móviles para reforzar la recepción y tramitación de las ayudas\nDNI En caso de pérdida del DNI, la Policía Nacional pone a disposición unidades móviles de documentación. Consulta su localización en este mapa .\nCarnet de conducir Duplicado del permiso de conducir por extravío o destrucción como consecuencia de la DANA: En la sede electrónica de la DGT En el teléfono 96 123 9327 En la Jefatura Provincial de Tráfico de Valencia Deberás declarar de forma responsable que tu permiso de conducción se ha visto afectado por la DANA acaecida en octubre de 2024. Para más información consultar en la página de la Dirección General de Tráfico (DGT\nPreguntas frecuentes Ayudas DANA del Ministerio del Interior."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento solo menciona unidades móviles de la Policía Nacional para quienes perdieron el DNI por la DANA y señala que los fragmentos no indican dónde renovarlo en general. No respalda que el DNI solo se tramite presencialmente ni que haya que solicitar cita previa del Ministerio del Interior. The response is not correct."}, "citation_notes": []}, {"id": "p32", "question": "puedo hacer tramites desde el extranjero?", "answerable": false, "expected": null, "answer": "Sí, si estás en el extranjero puedes presentar solicitudes en las representaciones diplomáticas y oficinas consulares de España [3]. También puedes iniciar trámites disponibles por vía electrónica en las sedes de los organismos; para ello necesitas un sistema de identificación electrónica [2][10]. Los fragmentos no indican que todos los trámites puedan hacerse desde el extranjero.", "cited": [{"n": 2, "title": "Cómo realizar trámites > Ciudadanos", "text": "Cómo realizar trámites > Ciudadanos\nPara agilizar los trámites que se realicen de forma presencial, los distintos organismos de la administración están habilitando sistemas de cita previa . Por ejemplo, el Ministerio del Interior para la gestión de la nueva expedición o la renovación del Documento Nacional de Identidad o del Pasaporte; el Ministerio de Política Territorial y Memoria Democrática para los trámites de extranjería; la Dirección General de Tráfico para los trámites del carnet de conducir; la Seguridad Social para los trámites sobre la cotización; las Comunidades Autónomas para asistir al médico de medicina general, etc.\nPuedes obtener más información o consultar tus dudas:\nen las Oficinas de Información de las Administraciones Públicas\nllamando al teléfono 060\na través del buzón de atención\na través del WebChat 060\nAl expandir este botón se cierra el botón expandido previamente.\nEn caso de que elijas realizar la tramitación de manera electrónica , puedes conocer los trámites disponibles e iniciarlos a través de las Sedes Electrónicas de los organismos.\nPuedes obtener más información o consultar tus dudas:\nen las Oficinas de Información de las Administraciones Públicas\nllamando al teléfono 060\na través del buzón de atención\na través del WebChat 060"}, {"n": 3, "title": "Dónde, cómo presentar un escrito > Información sobre la presentación", "text": "Dónde, cómo presentar un escrito > Información sobre la presentación\nPara la mayoría de procedimientos, las Administraciones disponen de un modelo normalizado para realizar las solicitudes. De ello te informarán en las Oficinas de Información o de Asistencia en Materia de Registros y también en las Sedes Electrónicas y Portales públicos de internet de los organismos.\nPuedes presentar tu solicitud:\nEn los registros electrónicos de las Administraciones Públicas.\nEn las oficinas de asistencia en materia de registros (OAMR).\nEn las oficinas de correos. En este caso tienes que entregar el sobre abierto para que sellen tu escrito con la fecha de entrega, y te faciliten copia del mismo.\nSi te encuentras en el extranjero, en las representaciones diplomáticas y oficinas consulares de España. Accede a las Embajadas y Consulados de España en el Extranjero.\nEn cualquier otro que establezcan las disposiciones vigentes.\nAccede al Buscador de oficinas del Punto de Acceso General.\nPuedes presentar tu solicitud en soporte papel o por medios informáticos, electrónicos o telemáticos en los registros electrónicos. Las oficinas de asistencia en materia de registros tienen un horario concreto para que puedas presentar tu solicitud, mientras que los registros electrónicos están abiertos las 24 horas al día los 365 días del año."}, {"n": 10, "title": "Relacionarte con la Administración de forma electrónica > Hacer trámites por medios electrónicos", "text": "Relacionarte con la Administración de forma electrónica > Hacer trámites por medios electrónicos\nPara realizar trámites por medios electrónicos debes tener algún sistema de identificación electrónica.\nEstos sistemas permiten que el ordenador reconozca tus datos y te deje hacer gestiones a través de Internet.\nConsulta nuestra página ' Identificación electrónica ' para saber más sobre este tema.\nCuando ya hayas comenzado el trámite, puedes elige la manera en la que quieres que la Administración se comunique contigo.\nUna resolución es la decisión de una Administración Pública.\nUna notificación es información importante sobre novedades en tus procesos y trámites. Por ejemplo, que ya se ha resuelto tu solicitud.\nLa Administración se comunicará contigo para comunicarte la resolución o para pedirte más documentos si hacen falta.\nConsulta nuestra página Notificaciones o nuestra página ' Cómo realizar un trámite ' para saber más sobre este tema."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes":
