 con vídeo identificación .\nPor medios electrónicos con DNI electrónico .\nA través de la App con vídeo identificación .\nA continuación, te indicamos los pasos que debes seguir para conseguir el certificado de forma presencial.\nAntes de pedir el certificado\nTienes que decidir en qué ordenador quieres instalar el certificado, porque tienes que solicitar el certificado desde el mismo ordenador.\nPaso 1. Prepara tu ordenador\nAsegurarte de que tu ordenador tiene los programas que necesitas para pedir el certificado e instalarlo.\nPincha aquí para acceder a información sobre este proceso y evitar posibles errores\nPaso 2. Solicita el certificado\nTienes que rellenar el formulario que está en esta página ."}, {"n": 5, "title": "Obtener el certificado electrónico de la Fábrica Nacional de Moneda y Timbre > ¿Qué pasos debes dar para conseguir el certificado electrónico de ciudadano? > Paso 4. Descargar el certificado", "text": "Obtener el certificado electrónico de la Fábrica Nacional de Moneda y Timbre > ¿Qué pasos debes dar para conseguir el certificado electrónico de ciudadano? > Paso 4. Descargar el certificado\nDebes usar el mismo ordenador con el que solicitaste el certificado.\nSi el ordenador lo usáis varias personas, asegúrate de que lo descargas con la misma sesión y usuario con el que hiciste la solicitud.\nTambién debes usar el mismo navegador.\nPincha aquí para acceder a una lista de navegadores compatibles .\nPara descargar el certificado, entra a esta página web de la Fábrica Nacional de Moneda y Timbre y rellena los datos que te piden.\nDespués, lee y acepta las condiciones de uso del certificado y pulsa el botón “descargar certificado”."}, {"n": 6, "title": "Identificación Electrónica > Sistemas basados en certificados electrónicos", "text": "Identificación Electrónica > Sistemas basados en certificados electrónicos\nCertificado electrónico\nSe trata de un fichero que permite identificar a una persona de forma inequívoca.\nTiene la misma validez que la presentación del DNI en la atención presencial.\nLas Administraciones Públicas solo admiten los certificados que proceden de entidades de certificación acreditadas\n¿Cuáles son estos certificados?\nHay muchos proveedores acreditados, tanto en las Administraciones Públicas como en el sector privado, que pueden proporcionarte este tipo de certificados electrónicos.\nLos certificados electrónicos más comunes son los siguientes:\nCertificado software de ciudadano emitido por la Fábrica Nacional de Moneda y Timbre (FNMT), entidad pública acreditada para expedir certificados electrónicos.\nDNI electrónico (DNIe): En este caso, el certificado está insertado en el chip del DNIe. Es expedido por la Dirección General de la Policía.\n¿Cómo puedo solicitar estos certificados?\nPuedes solicitar estos certificados electrónicos de las siguientes formas:\nCertificado software de la FNMT. Puedes obtenerlo por 2 vías: Presencialmente, en una oficina, en la que acreditarás tu identidad. Previamente, necesitarás un código que obtendrás al iniciar la solicitud. Telemáticamente, utilizando tu DNI electrónico Telemáticamente, mediante vídeo identificación"}, {"n": 8, "title": "Obtener el certificado electrónico de la Fábrica Nacional de Moneda y Timbre > ¿Qué pasos debes dar para conseguir el certificado electrónico de ciudadano?", "text": "Obtener el certificado electrónico de la Fábrica Nacional de Moneda y Timbre > ¿Qué pasos debes dar para conseguir el certificado electrónico de ciudadano?\nPaso 2. Solicita el certificado\nSigue las instrucciones. Después lee y acepta las condiciones que te piden para conseguir el certificado y pulsa el botón “enviar petición”.\nCuando lo hagas, recibirás un código en tu correo electrónico.\nNecesitas este código para el siguiente paso.\nSi ya tienes otro certificado de ciudadano, quedará anulado.\nPaso 3. Acredita tu identidad\nDebes ir a una Oficina de forma presencial.\nDebes llevar el código que te han enviado por correo electrónico y tu DNI.\nSi eres una persona extranjera debes llevar tu pasaporte y tu Tarjeta de Identificación de Extranjero.\nPincha aquí para acceder al mapa de las oficinas a las que puedes ir .\nPara encontrar una oficina en el mapa, elige la opción “Certificado de persona física”.\nCuando acredites tu identidad, podrás descargar tu certificado. Te recomendamos que lo descargues lo antes posible.\nPara más información sobre cómo acreditar tu identidad, consulta la sede de la Fábrica Nacional de Moneda y Timbre"}, {"n": 9, "title": "Obtención del Certificado Electrónico de la FNMT > ¿Qué pasos debo seguir para obtener el certificado de ciudadano?", "text": "Obtención del Certificado Electrónico de la FNMT > ¿Qué pasos debo seguir para obtener el certificado de ciudadano?\nPresencialmente, en una oficina\nElectrónicamente, con vídeo identificación\nElectrónicamente, utilizando tu DNIe\nSegún como vayas a acreditar tu identidad, hay 4 formas de obtener el certificado:\nObtención del certificado con acreditación presencial\nObtención del certificado con vídeo identificación\nObtención del certificado utilizando tu DNIe\nObtención del certificado a través de la App\nA continuación, te indicamos los pasos a seguir para obtener el certificado con acreditación presencial.\nAntes de solicitar el certificado\nAntes de solicitar el certificado, tienes que decidir en qué equipo informático (ordenador) quieres tenerlo instalado, ya que la solicitud debes hacerla desde ese mismo ordenador.\nA continuación, tienes que seguir 4 pasos , que te explicamos seguidamente.\nLa configuración previa consiste en que tienes que asegurarte de que tu ordenador tiene instalados los programas informáticos (software) necesarios para poder solicitar el certificado e instalarlo.\nPaso 1. Configuración previa de tu equipo informático\nConsulta en la sede electrónica de la FNMT los detalles para realizar la configuración, así como instrucciones para evitar posibles errores durante el proceso de obtención del certificado.\nPaso 2. Solicitar el certificado"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p02", "question": "cuanto tiempo tarda en llegar el certificado de la fnmt", "answerable": true, "expected": "Tras acreditar la identidad en una oficina, el certificado se puede descargar inmediatamente; se recomienda hacerlo lo antes posible.", "answer": "Tras acreditar tu identidad presencialmente, podrás descargar el certificado inmediatamente en tu ordenador [1]. Los fragmentos no indican cuánto tarda el proceso completo ni cuánto tarda por otras vías.", "cited": [{"n": 1, "title": "Obtención del Certificado Electrónico de la FNMT > ¿Qué pasos debo seguir para obtener el certificado de ciudadano? > Antes de solicitar el certificado", "text": "Obtención del Certificado Electrónico de la FNMT > ¿Qué pasos debo seguir para obtener el certificado de ciudadano? > Antes de solicitar el certificado\nAccede a esta página de la sede electrónica de la FNMT y rellena el formulario, siguiendo las instrucciones que se indican.\nUna vez cumplimentado el formulario, lee y acepta las condiciones de expedición del certificado y pulsa el botón de “enviar petición”.\nTerminado este proceso, recibirás un código de solicitud en tu correo electrónico, que necesitarás para el siguiente paso.\nSi ya tuvieras un certificado de ciudadano, al solicitar el nuevo, se dejaría sin efecto el que ya tengas.\nPaso 3. Acreditar tu identidad\nPara acreditar tu identidad, debes ir a una oficina presencialmente, llevando\nSi tu nacionalidad es española, tu DNI\nSi tu nacionalidad es extranjera, tu NIE y pasaporte\nEn los 2 casos anteriores, el código de solicitud que recibiste al realizar el paso 2\nPuedes consultar aquí el mapa de oficinas . Debes elegir la opción de certificados de persona física.\nUna vez que hayas acreditado tu identidad en una oficina, podrás descargar tu certificado inmediatamente en tu ordenador; se recomienda descargarlo lo antes posible.\nConsulta la sede electrónica de la FNMT para más información sobre cómo acreditar tu identidad ."}], "outcome": "faithful", "correct_votes": [true, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento indica que se puede descargar inmediatamente después de acreditar la identidad presencialmente. La afirmación no especifica que la acreditación debe ser presencial, así que generaliza más allá de lo que respalda el documento. The response is not correct"}, "citation_notes": []}, {"id": "p03", "question": "puedo sacar el certificado digital desde el movil?", "answerable": true, "expected": "Sí, una de las formas de obtener el certificado de la FNMT es a través de la App.", "answer": "Los fragmentos indican que puedes obtenerlo por medios electrónicos mediante vídeo identificación, también a través de la App [5]. No indican expresamente si todo el proceso puede hacerse desde el móvil.", "cited": [{"n": 5, "title": "Obtener el certificado electrónico de la Fábrica Nacional de Moneda y Timbre > ¿Qué pasos debes dar para conseguir el certificado electrónico de ciudadano?", "text": "Obtener el certificado electrónico de la Fábrica Nacional de Moneda y Timbre > ¿Qué pasos debes dar para conseguir el certificado electrónico de ciudadano?\nHay 3 formas de acreditar tu identidad. Según como acredites tu identidad, hay 4 formas de conseguir el certificado:\nDe forma presencial en una oficina .\nPor medios electrónicos con vídeo identificación .\nPor medios electrónicos con DNI electrónico .\nA través de la App con vídeo identificación .\nA continuación, te indicamos los pasos que debes seguir para conseguir el certificado de forma presencial.\nAntes de pedir el certificado\nTienes que decidir en qué ordenador quieres instalar el certificado, porque tienes que solicitar el certificado desde el mismo ordenador.\nPaso 1. Prepara tu ordenador\nAsegurarte de que tu ordenador tiene los programas que necesitas para pedir el certificado e instalarlo.\nPincha aquí para acceder a información sobre este proceso y evitar posibles errores\nPaso 2. Solicita el certificado\nTienes que rellenar el formulario que está en esta página ."}], "outcome": "correct", "correct_votes": [true, false, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p04", "question": "que diferencia hay entre clave pin y clave permanente", "answerable": true, "expected": "Cl@ve permanente es una contraseña de validez duradera, para usuarios habituales; Cl@ve PIN es una contraseña de validez muy limitada, para quien accede con poca frecuencia.", "answer": "Cl@ve PIN da una contraseña temporal cada vez que necesitas hacer un trámite y está orientada a quienes acceden de vez en cuando. Cl@ve Permanente usa una contraseña de validez más duradera, que hay que renovar, y está orientada a quienes acceden habitualmente. [1]", "cited": [{"n": 1, "title": "Registrarte en Cl@ve > Usos del sistema Cl@ve", "text": "Registrarte en Cl@ve > Usos del sistema Cl@ve\nHay 3 formas de usar el sistema Cl@ve:\nCl@ve PIN Te da una contraseña temporal cada vez que necesitas hacer un trámite. Es más útil para personas que acceden de vez en cuando. Más información sobre Cl@ve PIN\nCl@ve permanente Con este sistema tienes una contraseña que dura mucho más, aunque también tienes que renovarla. Es más útil para personas que acceden de forma habitual. Más información sobre Cl@ve permanente\nCl@ve móvil Con este sistema recibes una notificación en tu móvil, y no necesitas ninguna contraseña. Más información sobre Cl@ve móvil"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p05", "question": "como me registro en cl@ve sin ir a una oficina", "answerable": true, "expected": "Por internet: con vídeoidentificación en la App Cl@ve, sin certificado mediante carta de invitación o videollamada (nivel básico), o con certificado electrónico o DNIe en la sede de la Agencia Tributaria.", "answer": "Puedes registrarte sin acudir a una oficina de estas formas:\n\n- Con la app Cl@ve y vídeoidentificación automática. Temporalmente, esta opción solo está disponible para personas españolas con DNI en vigor. [4]\n- Por internet, sin certificado electrónico, mediante carta de invitación o videollamada. El registro es básico y no permite acceder a todos los servicios. [3][4]\n- Por internet, con certificado electrónico o DNIe, desde la sede electrónica de la Agencia Tributaria. [3][4]", "cited": [{"n": 3, "title": "Registrarte en Cl@ve > ¿Cómo puedes registrarte en Cl@ve?", "text": "Registrarte en Cl@ve > ¿Cómo puedes registrarte en Cl@ve?\nHay 4 formas de registrarte en Cl@ve:\nCon vídeoidentificación automática, con la App móvil Cl@ve. Este es un registro básico, solo sirve para algunos servicios. Más adelante, revisan los archivos y te dan el registro avanzado. Pincha aquí para acceder\nA través de internet, sin certificado electrónico. Este es un registro básico, solo sirve para algunos servicios. Puedes hacerlo por una carta de invitación. Pincha aquí para acceder También puedes hacerlo por videollamada. Pincha aquí para acceder\nA través de internet, con certificado electrónico o DNI electrónico. El registro a través de internet se hace en la sede electrónica de la Agencia Tributaria Pincha aquí para acceder\nDe forma presencial. Para registrarte de forma presencial, tienes que ir a una oficina de registro de Cl@ve. Pincha aquí para acceder a Oficinas de Registro Cl@ve\nTienes más información en la web de Cl@ve.\nPincha aquí para acceder a la web de Cl@ve .\nTambién puedes consultar las preguntas frecuentes sobre el registro en Cl@ve.\nPincha aquí para acceder a las preguntas frecuentes ."}, {"n": 4, "title": "Registrarte en cl@ve", "text": "Registrarte en cl@ve\nCon vídeoidentificación automática con la App Cl@ve. Siguiendo las instrucciones de la aplicación, obtendrás en pocos minutos el nivel de registro básico en Cl@ve. En un proceso posterior, una vez completada satisfactoriamente la revisión de evidencias electrónicas (vídeo, documento de identidad y biometría facial) por parte de un empleado público autorizado, puedes obtener directamente el nivel de registro avanzado . Temporalmente sólo se ofrece este servicio a personas españolas con DNI en vigor.\nA través de internet, sin certificado electrónico . Este tipo de registro es de nivel básico y no permite acceder a todos los servicios. Puede ser mediante carta de invitación o por videollamada\nA través de internet, con certificado electrónico o DNIe (DNI electrónico). El registro en Cl@ve a través de internet se realiza en la sede electrónica de la Agencia Tributaria (AEAT)\nDe forma presencial . El registro de forma presencial se realiza acudiendo a una oficina de registro Cl@ve\nPuedes encontrar más información en la web de Cl@ve y en las preguntas frecuentes sobre el registro en Cl@ve\nUna vez que te hayas registrado en Cl@ve, hay tres posibilidades de uso:"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p06", "question": "se puede firmar con cl@ve?", "answerable": true, "expected": "Sí, con Cl@ve Firma, en determinados trámites; requiere registro de nivel avanzado, Cl@ve Permanente activada y generar el certificado de firma. Una de las guías dice lo contrario, así que una respuesta que señale la contradicción también es correcta.", "answer": "Sí, mediante Cl@ve Firma se puede firmar electrónicamente en determinados trámites [4]. Para usarla, tienes que registrarte en el nivel avanzado, activar Cl@ve Permanente y crear el certificado de firma [2].", "cited": [{"n": 2, "title": "Registrarte en Cl@ve", "text": "Registrarte en Cl@ve\nCl@ve Firma\nPara utilizar la firma centralizada tienes que realizar los siguientes pasos:\nRegistrarte en el Nivel avanzado del sistema Cl@ve,\nactivar la Cl@ve Permanente\ny crear el certificado de firma.\nPuedes encontrar más información en el apartado Cl@ve Firma de la web de Cl@ve.\nPincha aquí para acceder .\nNormas y leyes\nOrden PRE/1838/2014, de 8 de octubre , por la que se publica el Acuerdo de Consejo de Ministros, de 19 de septiembre de 2014, por el que se aprueba Cl@ve, la plataforma común del Sector Público Administrativo Estatal para la identificación, autenticación y firma electrónica mediante el uso de claves concertadas."}, {"n": 4, "title": "Identificación Electrónica > Identificación y firma electrónica", "text": "Identificación Electrónica > Identificación y firma electrónica\nCertificado electrónico\nCon el certificado electrónico puedes tanto identificarte como firmar electrónicamente.\nLa firma electrónica basada en certificados tiene la misma validez que la firma manuscrita.\nPuedes utilizar la firma electrónica en los siguientes casos, entre otros:\nFirmar documentos. Por ejemplo, un PDF.\nRealizar trámites que requieran firma. Por ejemplo, formular una solicitud.\nAdemás del certificado electrónico, necesitas una aplicación de firma\nPara trámites que requieran firma, necesitarás tener instalada la aplicación de firma AutoFirma. La puedes descargar aquí.\nCl@ve\nCl@ve es un sistema que simplifica el acceso electrónico a los servicios públicos mediante claves concertadas, complementando el DNI electrónico y los certificados digitales. Permite identificarse y autenticarse de forma sencilla y segura, así como firmar electrónicamente en determinados trámites mediante certificados personales en la nube Cl@ve Firma . Además, facilita la realización de gestiones desde dispositivos móviles."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p07", "question": "he perdido el dni, puedo registrarme en clave igualmente?", "answerable": true, "expected": "Sí: además del DNI, la identidad se puede acreditar con el NIE, un certificado electrónico u otro documento que la acredite, y con certificado electrónico el registro se hace por internet en la sede electrónica de la Agencia Tributaria.", "answer": "Una guía indica que para registrarte necesitas DNI, NIE, certificado electrónico u otro documento que acredite tu identidad [1]; otra señala que, si eres español, necesitas el DNI [3]. También existe el registro por internet sin certificado, de nivel básico [4]. Los fragmentos no indican si puedes registrarte tras perder el DNI ni si un documento alternativo sirve en ese caso.", "cited": [{"n": 1, "title": "Registrarte en Cl@ve > ¿Qué necesitas para utilizar Cl@ve?", "text": "Registrarte en Cl@ve > ¿Qué necesitas para utilizar Cl@ve?\nDNI, NIE , certificado electrónico u otro documento que acredite tu identidad .\nNúmero de teléfono móvil.\nSolo se puede asociar un DNI o un NIE a un número de teléfono móvil.\nAsí garantizamos que solo la persona registrada puede acceder a los códigos que se envían a ese teléfono.\nAviso > Ahora hay una nueva forma de registrarse en Cl@ve.\nEs con videoidentificación. Por eso, hemos actualizado la sección \"Cómo registrarte en Cl@ve\". Falta que la revise una persona con dificultades de comprensión. Cuando la revise, sabremos si se entiende bien."}, {"n": 3, "title": "Registrarte en cl@ve", "text": "Registrarte en cl@ve\nCl@ve es un sistema para identificarte electrónicamente ante las Administraciones Públicas con garantías de seguridad, sin tener que recordar claves diferentes para acceder a los distintos servicios.\nTienes más información en la página web de Cl@ve , que también incluye preguntas frecuentes.\nAntes de usar Cl@ve, tienes que registrarte en el sistema, aportando los datos necesarios:\nNúmero de teléfono móvil nacional o extranjero\nCorreo electrónico\nSi eres español, DNI\nSi eres extranjero y tienes NIE : Certificado de registro de ciudadano de la UE, tarjeta de identidad de extranjero o permiso de residencia, y además Pasaporte (si eres ciudadano de la UE, también puedes identificarte con el documento de identidad del país de origen, en lugar del pasaporte)\n​Para garantizar que sólo la persona registrada tiene acceso a los códigos PIN enviados al teléfono móvil, sólo se puede asociar un DNI/NIE a un mismo número de móvil.\nHay 4 formas:"}, {"n": 4, "title": "Registrarte en cl@ve", "text": "Registrarte en cl@ve\nCon vídeoidentificación automática con la App Cl@ve. Siguiendo las instrucciones de la aplicación, obtendrás en pocos minutos el nivel de registro básico en Cl@ve. En un proceso posterior, una vez completada satisfactoriamente la revisión de evidencias electrónicas (vídeo, documento de identidad y biometría facial) por parte de un empleado público autorizado, puedes obtener directamente el nivel de registro avanzado . Temporalmente sólo se ofrece este servicio a personas españolas con DNI en vigor.\nA través de internet, sin certificado electrónico . Este tipo de registro es de nivel básico y no permite acceder a todos los servicios. Puede ser mediante carta de invitación o por videollamada\nA través de internet, con certificado electrónico o DNIe (DNI electrónico). El registro en Cl@ve a través de internet se realiza en la sede electrónica de la Agencia Tributaria (AEAT)\nDe forma presencial . El registro de forma presencial se realiza acudiendo a una oficina de registro Cl@ve\nPuedes encontrar más información en la web de Cl@ve y en las preguntas frecuentes sobre el registro en Cl@ve\nUna vez que te hayas registrado en Cl@ve, hay tres posibilidades de uso:"}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "The document mentions that a certificate or another identity document may be used to register, but it does not establish whether these alternatives work for someone who has lost their DNI; it also says another source requires a DNI for Spanish citizens. It does not say that registration with a certificate can be completed online through the Tax Agency’s electronic headquarters. The response is not correct"}, "citation_notes": []}, {"id": "p08", "question": "me ha llegado un aviso de notificacion electronica, donde la veo?", "answerable": true, "expected": "En la Dirección Electrónica Habilitada única (DEHú) o en la Carpeta Ciudadana, con certificado digital o Cl@ve; a veces también en la sede electrónica del organismo que la emite.", "answer": "Puedes consultar la notificación en la Dirección Electrónica Habilitada única (DEHú) o en tu Carpeta Ciudadana. Para acceder necesitas un certificado digital o Cl@ve. En algunos casos también está disponible en la sede electrónica del organismo que la envió; la información aparece al realizar el trámite electrónico. [2]", "cited": [{"n": 2, "title": "Notificaciones > Notificaciones electrónicas", "text": "Notificaciones > Notificaciones electrónicas\nEn general, y siempre que esté disponible, la Administración te enviará tus notificaciones de manera electrónica, independientemente de que también elijas recibirlas en formato papel.\nPodrás acceder a tus notificaciones directamente a través de la Dirección Electrónica Habilitada única (DEHú) , o bien a través de tu Carpeta Ciudadana . Para poder acceder a la DEHú o a la Carpeta Ciudadana necesitarás un medio de identificación electrónico (certificado digital o Cl@ve).\nAsimismo, en algunos casos también se puede acceder a las notificaciones electrónicas en las sedes electrónicas de los organismos públicos que las emiten. Dicha información la encontrarás a la hora de realizar el trámite vía electrónica."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p09", "question": "cuantos dias tengo para abrir una notificacion electronica antes de que cuente como rechazada", "answerable": false, "expected": null, "answer": "No tengo información suficiente para responder.", "cited": [], "outcome": "declined", "correct_votes": [true, true, true], "grounded_votes": null, "reason": null, "citation_notes": []}, {"id": "p10", "question": "soy autonomo, estoy obligado a hacer los tramites por internet?", "answerable": false, "expected": null, "answer": "Sí, para relacionarte con la Seguridad Social española, las personas autónomas están obligadas a hacer los trámites por medios electrónicos [10]. Para trámites con otras administraciones, los fragmentos no lo indican.", "cited": [{"n": 10, "title": "Alta de empleados > Quiero darme de alta como trabajador por cuenta propia, ¿Qué tengo que hacer?", "text": "Alta de empleados > Quiero darme de alta como trabajador por cuenta propia, ¿Qué tengo que hacer?\nSi no dispones de él debes solicitarlo con tu identificación electrónica a través del a través del Portal de la Tesorería General de la Seguridad Social o de la App IMPORTASS Seguridad Social , en el servicio Solicitar el Número de la Seguridad Social . Si careces de identificación electrónica también puedes pedir tu NUSS presentando una solicitud de atención personalizada. Necesitarás un documento de identidad, un correo electrónico y un dispositivo electrónico con cámara. A continuación debes tramitar tu alta como trabajador por cuenta propia en el Régimen Especial de Trabajadores Autónomos o en el Régimen Especial de Trabajadores del Mar. Debes tener en cuenta que los trabajadores autónomos están obligados a relacionarse electrónicamente con la Seguridad Social española. Para ello dispones de dos vías, utilizar los servicios electrónicos de la SEDESS o realizar tus trámites a través de un autorizado RED. Por tanto, una vez que tengas asignado un número de Seguridad Social, puedes tramitar tu alta como trabajador por cuenta propia a través del Portal de la Tesorería General de la Seguridad Social o de la App IMPORTASS Seguridad Social en el servicio Alta en trabajo autónomo o utilizando los servicios de un autorizado RED."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento sí ofrece información para responder en parte: indica que las personas autónomas deben realizar electrónicamente los trámites con la Seguridad Social española. Aunque no especifica los trámites con otras administraciones, por eso la afirmación de que no hay información suficiente para responder no está plenamente respaldada."}, "citation_notes": []}, {"id": "p11", "question": "puedo entregar un papel en cualquier oficina de registro aunque sea para otro ministerio?", "answerable": false, "expected": null, "answer": "Puedes presentar solicitudes presencialmente en las Oficinas de asistencia en materia de registros [1][3]. Sin embargo, los fragmentos no indican si cualquier oficina acepta un escrito dirigido a otro ministerio. Si el escrito tiene un formulario concreto, se presenta en la sede electrónica del ministerio correspondiente [3].", "cited": [{"n": 1, "title": "Dónde, cómo presentar un escrito > Información sobre la presentación", "text": "Dónde, cómo presentar un escrito > Información sobre la presentación\nPara la mayoría de procedimientos, las Administraciones disponen de un modelo normalizado para realizar las solicitudes. De ello te informarán en las Oficinas de Información o de Asistencia en Materia de Registros y también en las Sedes Electrónicas y Portales públicos de internet de los organismos.\nPuedes presentar tu solicitud:\nEn los registros electrónicos de las Administraciones Públicas.\nEn las oficinas de asistencia en materia de registros (OAMR).\nEn las oficinas de correos. En este caso tienes que entregar el sobre abierto para que sellen tu escrito con la fecha de entrega, y te faciliten copia del mismo.\nSi te encuentras en el extranjero, en las representaciones diplomáticas y oficinas consulares de España. Accede a las Embajadas y Consulados de España en el Extranjero.\nEn cualquier otro que establezcan las disposiciones vigentes.\nAccede al Buscador de oficinas del Punto de Acceso General.\nPuedes presentar tu solicitud en soporte papel o por medios informáticos, electrónicos o telemáticos en los registros electrónicos. Las oficinas de asistencia en materia de registros tienen un horario concreto para que puedas presentar tu solicitud, mientras que los registros electrónicos están abiertos las 24 horas al día los 365 días del año."}, {"n": 3, "title": "Presentar un escrito > Cómo presentar", "text": "Presentar un escrito > Cómo presentar\nPuedes presentar tu solicitud de forma presencial o por vía electrónica.\nPara hacerlo de forma electrónica, puedes utilizar a los registros electrónicos, donde puedes presentar tu solicitud a cualquier hora en cualquier día del año.\nPara hacerlo de forma presencial, puedes ir a las Oficinas de asistencia en materia de registros.\nEstas oficinas tienen un horario.\nLas solicitudes y escritos que tienen un formulario concreto se presentan en la sede electrónica del ministerio que corresponda.\nAccede a las Sedes Electrónicas de la Administración General del Estado y los Departamentos Ministeriales\nHay solicitudes y escritos que no tienen un formulario concreto.\nEstas solicitudes se pueden presentar en el Registro Electrónico de la Administración General del Estado.\nAccede al Registro Electrónico de la Administración General del Estado\nTambién puedes acudir a las Oficinas de asistencia en materia de registro y te ayudarán a presentar tu solicitud en el Registro Electrónico de la Administración General del Estado o en las sedes electrónicas de los Ministerios.\nEn vigor significa que está activo y no ha caducado."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p12", "question": "que es la sede electronica", "answerable": true, "expected": "Es la dirección de internet a través de la cual se realizan los trámites de una administración u organismo público; equivale a la sede física.", "answer": "Una sede electrónica es el sitio web de una Administración pública donde puedes realizar trámites y gestiones por Internet, como presentar una solicitud [1][6].", "cited": [{"n": 1, "title": "Relacionarte electrónicamente con la Administración > Portales de Internet y Sedes Electrónicas", "text": "Relacionarte electrónicamente con la Administración > Portales de Internet y Sedes Electrónicas\nPor lo general, podemos distinguir entre dos tipos de sitios web a través de los cuáles te puedes relacionar electrónicamente con la Administraciones Públicas. ¿Cuáles son las diferencias?:\nPortal de internet. Es el punto de acceso electrónico a través del cual puedes acceder, a través de internet, a la información que publica una Administración Pública u organismo público. También te permite el acceso a la sede electrónica correspondiente.\nSede electrónica. Es la dirección de internet a través de la cual puedes realizar los trámites correspondientes a una administración u organismo público. Las sedes electrónicas son el equivalente a las sedes físicas donde la ciudadanía se dirige para hacer un trámite."}, {"n": 6, "title": "Relacionarte con la Administración de forma electrónica > Portales de internet y sedes electrónicas", "text": "Relacionarte con la Administración de forma electrónica > Portales de internet y sedes electrónicas\nPortal de Internet\nEs el sitio web de una Administración. Tiene información sobre esa Administración Pública.\nEs el lugar al que puedes entrar sin clave ni contraseña para consultar información de interés.\nSede electrónica\nEs el sitio web en el que puedes hacer trámites y gestiones a través de Internet.\nPor ejemplo, presentar una solicitud para pedir una subvención.\nLa mayoría de las veces, puedes acceder a la sede electrónica de una Administración Pública a través de su portal de internet.\nUna persona jurídica es una empresa, entidad o un grupo de personas que comparten responsabilidad.\nUn proceso selectivo es un conjunto de pruebas que se deben pasar para conseguir una plaza de empleo público."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p13", "question": "que diferencia hay entre el portal y la sede electronica", "answerable": true, "expected": "El portal da acceso a la información que publica la Administración; la sede electrónica es donde se realizan los trámites.", "answer": "El **portal de internet** ofrece información sobre una Administración y permite acceder a la sede electrónica [1][2]. La **sede electrónica** es el sitio web donde puedes realizar trámites y gestiones por internet [1][2].", "cited": [{"n": 1, "title": "Relacionarte electrónicamente con la Administración > Portales de Internet y Sedes Electrónicas", "text": "Relacionarte electrónicamente con la Administración > Portales de Internet y Sedes Electrónicas\nPor lo general, podemos distinguir entre dos tipos de sitios web a través de los cuáles te puedes relacionar electrónicamente con la Administraciones Públicas. ¿Cuáles son las diferencias?:\nPortal de internet. Es el punto de acceso electrónico a través del cual puedes acceder, a través de internet, a la información que publica una Administración Pública u organismo público. También te permite el acceso a la sede electrónica correspondiente.\nSede electrónica. Es la dirección de internet a través de la cual puedes realizar los trámites correspondientes a una administración u organismo público. Las sedes electrónicas son el equivalente a las sedes físicas donde la ciudadanía se dirige para hacer un trámite."}, {"n": 2, "title": "Relacionarte con la Administración de forma electrónica > Portales de internet y sedes electrónicas", "text": "Relacionarte con la Administración de forma electrónica > Portales de internet y sedes electrónicas\nPortal de Internet\nEs el sitio web de una Administración. Tiene información sobre esa Administración Pública.\nEs el lugar al que puedes entrar sin clave ni contraseña para consultar información de interés.\nSede electrónica\nEs el sitio web en el que puedes hacer trámites y gestiones a través de Internet.\nPor ejemplo, presentar una solicitud para pedir una subvención.\nLa mayoría de las veces, puedes acceder a la sede electrónica de una Administración Pública a través de su portal de internet.\nUna persona jurídica es una empresa, entidad o un grupo de personas que comparten responsabilidad.\nUn proceso selectivo es un conjunto de pruebas que se deben pasar para conseguir una plaza de empleo público."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p14", "question": "no tengo certificado ni clave, como presento una solicitud?", "answerable": true, "expected": "Si no tienes obligación de relacionarte electrónicamente, puedes presentarla de forma presencial en una oficina de registro; también tienes derecho a asistencia, incluida la de un funcionario habilitado que actúa en tu nombre.", "answer": "Puedes presentarla presencialmente en una Oficina de asistencia en materia de registros; estas oficinas tienen horario y pueden ayudarte con la presentación [2].\n\nSi la solicitud tiene un formulario concreto, el fragmento indica que se presenta en la sede electrónica del ministerio correspondiente; si no tiene formulario, puede presentarse en el Registro Electrónico de la Administración General del Estado [2]. Los fragmentos no indican si puedes usar esas vías electrónicas sin certificado ni Cl@ve.", "cited": [{"n": 2, "title": "Presentar un escrito > Cómo presentar", "text": "Presentar un escrito > Cómo presentar\nPuedes presentar tu solicitud de forma presencial o por vía electrónica.\nPara hacerlo de forma electrónica, puedes utilizar a los registros electrónicos, donde puedes presentar tu solicitud a cualquier hora en cualquier día del año.\nPara hacerlo de forma presencial, puedes ir a las Oficinas de asistencia en materia de registros.\nEstas oficinas tienen un horario.\nLas solicitudes y escritos que tienen un formulario concreto se presentan en la sede electrónica del ministerio que corresponda.\nAccede a las Sedes Electrónicas de la Administración General del Estado y los Departamentos Ministeriales\nHay solicitudes y escritos que no tienen un formulario concreto.\nEstas solicitudes se pueden presentar en el Registro Electrónico de la Administración General del Estado.\nAccede al Registro Electrónico de la Administración General del Estado\nTambién puedes acudir a las Oficinas de asistencia en materia de registro y te ayudarán a presentar tu solicitud en el Registro Electrónico de la Administración General del Estado o en las sedes electrónicas de los Ministerios.\nEn vigor significa que está activo y no ha caducado."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento indica que se puede presentar presencialmente en una Oficina de asistencia en materia de registros, pero no dice que esta opción dependa de no tener obligación de usar la vía electrónica. The response is not correct"}, "citation_notes": []}, {"id": "p15", "question": "el dni electronico sirve para firmar?", "answerable": true, "expected": "Sí, el DNI electrónico permite firmar electrónicamente.", "answer": "Sí, el DNI electrónico permite firmar electrónicamente [2].", "cited": [{"n": 2, "title": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico", "text": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico\nCertificado software\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas instalarlo en un dispositivo electrónico (como un PC)\nSi quieres utilizarlo en varios dispositivos, tendrás que exportarlo e instalarlo en cada uno de ellos\nDNI electrónico\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nNo necesitas instalarlo en un dispositivo electrónico\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas un lector de tarjetas. A partir de la versión 3.0 del DNIe puedes utilizar el móvil como lector de tarjetas\nPuedes necesitar instalar algún programa informático adicional\nCl@ve\nVentajas:\nNo necesitas instalarlo en un dispositivo electrónico\nPuedes utilizarlo desde cualquier dispositivo (PC o móvil)\nInconvenientes:\nNo puedes utilizarlo en todos los procedimientos y trámites\nNo puedes utilizarlo en todas las Administraciones públicas\nNo te permite firmar electrónicamente"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p16", "question": "que necesito para usar el dnie en el ordenador", "answerable": true, "expected": "Un lector de tarjetas (desde la versión 3.0 del DNIe sirve el móvil) y puede que algún programa adicional.", "answer": "Necesitas el DNI electrónico y un lector de tarjetas; también es posible que tengas que instalar algún programa en el ordenador. Si tienes un DNIe versión 3.0 o superior, puedes usar el móvil como lector. [3]", "cited": [{"n": 3, "title": "Identificación electrónica > Características de los sistemas de identificación", "text": "Identificación electrónica > Características de los sistemas de identificación\nCertificado software\nVentajas\nTe puedes identificar con él para hacer cualquier trámite de la Administración.\nPuedes firmar documentos.\nDesventajas\nTienes que instalarlo en un dispositivo, como un ordenador, una tablet o un móvil.\nSi lo quieres utilizar en varios dispositivos tienes que instalarlo en cada uno de ellos.\nDNI electrónico\nVentajas\nTe puedes identificar con él para hacer cualquier trámite de la Administración.\nNo tienes que instalarlo en ningún dispositivo.\nPuedes firmar documentos.\nDesventajas\nNecesitas un lector de tarjetas. Es un aparato que permite al dispositivo que usas leer el DNI electrónico. Si tienes la versión 3.0 o una superior del DNI electrónico puedes usar tu móvil como lector de tarjetas. Pincha aquí para más información .\nEs posible que tengas que instalar algún programa para usarlo.\nCl@ve\nVentajas\nNo necesitas instalarla en tu dispositivo.\nPuedes usarla desde cualquier dispositivo, ordenador, móvil o tablet.\nDesventajas\nSolo puedes hacer algunos trámites, no sirve para todos.\nRegular es definir cómo debe hacerse una tarea o función y con qué normas."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p17", "question": "cuanto cuesta el certificado digital de la fnmt", "answerable": true, "expected": "Es gratuito; solo la obtención con vídeo identificación cuesta 2,99 € más impuestos.", "answer": "El certificado de ciudadano de la FNMT es gratuito. Si lo obtienes mediante vídeo identificación, el servicio cuesta 2,99 € más impuestos. [1]", "cited": [{"n": 1, "title": "Obtención del Certificado Electrónico de la FNMT", "text": "Obtención del Certificado Electrónico de la FNMT\n¿Tiene coste la obtención de un certificado de ciudadano?\nNo. El certificado de ciudadano de la FNMT es gratuito .\nÚnicamente, en el caso de que obtengas el certificado con vídeo identificación, tendrás que abonar un coste de 2,99€ más impuestos por este servicio.\n¿Qué pasos debo seguir para obtener el certificado de ciudadano?\nA lo largo del proceso de obtención del certificado, será necesario que acredites tu identidad. Hay 3 formas de acreditar tu identidad:"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p18", "question": "se me ha caducado el certificado digital, como lo renuevo?", "answerable": true, "expected": "La renovación se puede hacer durante los 60 días previos a la caducidad, si no ha sido revocado.", "answer": "Los fragmentos indican que puedes renovar el certificado durante los 60 días previos a su caducidad, si sigue activo y no ha sido revocado [1][2]. Como ya ha caducado, no indican cómo renovarlo después de esa fecha.", "cited": [{"n": 1, "title": "Obtención del Certificado Electrónico de la FNMT > ¿Cómo renovar mi certificado de ciudadano?", "text": "Obtención del Certificado Electrónico de la FNMT > ¿Cómo renovar mi certificado de ciudadano?\nPuedes llevar a cabo la renovación de tu certificado durante los 60 días previos a la fecha de caducidad del certificado, siempre y cuando no haya sido previamente revocado.\nPara más información, consulta la sede electrónica de la FNMT:\nPasos a seguir sobre la renovación de tu certificado\nDudas frecuentes (cómo saber cuándo caduca tu certificado, etc.)"}, {"n": 2, "title": "Obtener el certificado electrónico de la Fábrica Nacional de Moneda y Timbre", "text": "Obtener el certificado electrónico de la Fábrica Nacional de Moneda y Timbre\n¿Cómo puedes renovar tu certificado?\nSi tu certificado está activo, puedes renovarlo durante 60 días antes de que caduque.\nPuedes encontrar más información en las páginas de la Fábrica Nacional de Moneda y Timbre:\nRenovar tu certificado\nDudas frecuentes\nPreguntas frecuentes sobre el certificado de ciudadano\nPara conseguir más información o consultar dudas sobre el certificado de ciudadano, puedes consultar la página de preguntas frecuentes de la Fábrica Nacional de Moneda y Timbre."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p19", "question": "tengo que pedir cita para acreditar mi identidad para el certificado?", "answerable": false, "expected": null, "answer": "Para acreditar tu identidad de forma presencial, debes acudir a una oficina con el código de solicitud y la documentación correspondiente [4]. Los fragmentos no indican si hace falta pedir cita previa.", "cited": [{"n": 4, "title": "Obtener el certificado electrónico de la Fábrica Nacional de Moneda y Timbre > ¿Qué pasos debes dar para conseguir el certificado electrónico de ciudadano?", "text": "Obtener el certificado electrónico de la Fábrica Nacional de Moneda y Timbre > ¿Qué pasos debes dar para conseguir el certificado electrónico de ciudadano?\nPaso 2. Solicita el certificado\nSigue las instrucciones. Después lee y acepta las condiciones que te piden para conseguir el certificado y pulsa el botón “enviar petición”.\nCuando lo hagas, recibirás un código en tu correo electrónico.\nNecesitas este código para el siguiente paso.\nSi ya tienes otro certificado de ciudadano, quedará anulado.\nPaso 3. Acredita tu identidad\nDebes ir a una Oficina de forma presencial.\nDebes llevar el código que te han enviado por correo electrónico y tu DNI.\nSi eres una persona extranjera debes llevar tu pasaporte y tu Tarjeta de Identificación de Extranjero.\nPincha aquí para acceder al mapa de las oficinas a las que puedes ir .\nPara encontrar una oficina en el mapa, elige la opción “Certificado de persona física”.\nCuando acredites tu identidad, podrás descargar tu certificado. Te recomendamos que lo descargues lo antes posible.\nPara más información sobre cómo acreditar tu identidad, consulta la sede de la Fábrica Nacional de Moneda y Timbre"}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p20", "question": "no me llega el sms de clave pin, que hago", "answerable": true, "expected": "Puedes comunicarlo a través del formulario de soporte para dudas o problemas con Cl@ve.", "answer": "Si no te llega el SMS de Cl@ve PIN, puedes comunicar el problema mediante el formulario de dudas o problemas con Cl@ve [5]. Los fragmentos no indican pasos específicos para solucionar el retraso del SMS.", "cited": [{"n": 5, "title": "Registrarte en Cl@ve", "text": "Registrarte en Cl@ve\nNormas y leyes\nResolución de 14 de diciembre de 2015 , de la Dirección de Tecnologías de la Información y las Comunicaciones, por la que se establecen las prescripciones técnicas necesarias para el desarrollo y aplicación del sistema Cl@ve.\nMás información\nPuedes ver los vídeos sobre Cl@ve PIN en la sección de vídeos de la Agencia Tributaria\nSi tienes algún problema o duda, puedes comunicarlo a través del formulario para dudas o problemas con Cl@ve."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p21", "question": "que es la dehu", "answerable": true, "expected": "Es la Dirección Electrónica Habilitada única, donde puedes acceder a tus notificaciones electrónicas con certificado digital o Cl@ve.", "answer": "DEHú significa Dirección Electrónica Habilitada única. Facilita el acceso a las notificaciones y comunicaciones de las Administraciones Públicas adheridas; permite leer comunicaciones y comparecer notificaciones propias o de personas representadas mediante un sistema de autenticación admitido por Cl@ve. [1]", "cited": [{"n": 1, "title": "Aplicaciones móviles para la ciudadanía > Aplicaciones móviles del Punto de Acceso General", "text": "Aplicaciones móviles para la ciudadanía > Aplicaciones móviles del Punto de Acceso General\nEnlaces para su descarga:\nLíneas de ayuda en Play Store (para Android)\nLíneas de ayuda en App Store (para iOs)\nDeclaración de Accesibilidad de la App Líneas de Ayuda\nLa App Mi carpeta Ciudadana facilita a la ciudadanía su relación con las Administraciones Públicas de forma sencilla y ágil desde un único lugar.\nCon Mi carpeta Ciudadana dispondrás, de forma agregada, de tu información personal y de tus gestiones realizadas con diferentes Administraciones Públicas.\nEnlaces para su descarga:\nMi carpeta ciudadana en Play Store (para Android)\nMi carpeta ciudadana en App Store (para iOs)\nMás información y declaración de accesibilidad de la App Mi carpeta ciudadana\nNotifica App (Dirección Electrónica Habilitada única) facilita a la ciudadanía el acceso y comparecencia a las notificaciones y comunicaciones emitidas por las Administraciones Públicas adheridas.\nCon DEHú podrás leer tus comunicaciones y comparecer tus notificaciones o las de tus representados. Para ello, sólo es necesario que dispongas de cualquiera de los sistemas de autenticación admitidos por la plataforma Cl@ve.\nEnlaces para su descarga:\nNotifica App en Play Store (para Android)\nNotifica App en App Store (para iOs)\nDeclaración de accesibilidad de la App móvil DEHú"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p22", "question": "si me notifican en papel y por internet a la vez, cual vale?", "answerable": false, "expected": null, "answer": "Los fragmentos indican que la Administración puede enviar la notificación también por vía electrónica aunque hayas elegido el papel, si esa opción está disponible. [1][3] No indican cuál de las dos comunicaciones prevalece si recibes ambas.", "cited": [{"n": 1, "title": "Notificaciones > Notificaciones electrónicas", "text": "Notificaciones > Notificaciones electrónicas\nAunque elijas recibir las notificaciones en papel, la Administración suele enviarlas de forma electrónica también, siempre que esta opción esté disponible.\nPuedes acceder a tus notificaciones electrónicas en:\nla Dirección Electrónica Habilitada Única Pincha aquí para acceder a la Dirección Electrónica Habilitada Única\nla Carpeta Ciudadana Pincha aquí para acceder a la Carpeta Ciudadana\nalgunas sedes electrónicas de los organismos que envían las notificaciones. Cuando inicies un trámite de forma electrónica, encontrarás información sobre esto.\nPara acceder a la Carpeta Ciudadana y a la Dirección Electrónica Habilitada Única necesitas un certificado digital o estar registrado en Cl@ve.\nUna persona jurídica es una empresa, entidad o grupos de personas que comparten una responsabilidad.\nUna persona física es una persona real.\nOpositar es participar en un proceso selectivo para conseguir un puesto de trabajo en la Administración Pública."}, {"n": 3, "title": "Notificaciones > Notificaciones electrónicas", "text": "Notificaciones > Notificaciones electrónicas\nEn general, y siempre que esté disponible, la Administración te enviará tus notificaciones de manera electrónica, independientemente de que también elijas recibirlas en formato papel.\nPodrás acceder a tus notificaciones directamente a través de la Dirección Electrónica Habilitada única (DEHú) , o bien a través de tu Carpeta Ciudadana . Para poder acceder a la DEHú o a la Carpeta Ciudadana necesitarás un medio de identificación electrónico (certificado digital o Cl@ve).\nAsimismo, en algunos casos también se puede acceder a las notificaciones electrónicas en las sedes electrónicas de los organismos públicos que las emiten. Dicha información la encontrarás a la hora de realizar el trámite vía electrónica."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p23", "question": "que es el registro electronico general", "answerable": true, "expected": "El Registro Electrónico General de la AGE (REG-AGE) sirve para enviar documentos, como solicitudes, comunicaciones o escritos, a los servicios públicos por medios electrónicos; también acepta documentos para otras Administraciones Públicas.", "answer": "El Registro Electrónico General de la AGE (REG-AGE) permite enviar documentos a los servicios públicos por medios electrónicos, como solicitudes, comunicaciones y escritos. También admite documentos dirigidos a otras Administraciones Públicas, salvo que indiquen una forma concreta de realizar el trámite. [1]", "cited": [{"n": 1, "title": "Registro Electrónico General de la AGE > ¿Qué es el Registro Electrónico General?", "text": "Registro Electrónico General de la AGE > ¿Qué es el Registro Electrónico General?\nSirve para que la ciudadanía envíe documentos a los servicios públicos por medios electrónicos de forma rápida y eficaz. Por ejemplo, comunicaciones, solicitudes o escritos.\nEn el REG-AGE puedes presentar solicitudes, comunicaciones y hacer trámites en la Administración General del Estado. Excepto si las Administraciones indican una manera concreta de hacer un trámite.\nTambién acepta documentos para otras Administraciones Públicas. Como Comunidades Autónomas o entidades locales.\nTodas las acciones y documentos que se registren en el REG-AGE se anotarán en el libro de registro del REG-AGE."}], "outcome": "correct", "correct_votes": [true, true, false], "grounded_votes": [false, true, true], "reason": null, "citation_notes": []}, {"id": "p24", "question": "cual es el horario del telefono 060", "answerable": false, "expected": null, "answer": "La atención automática está disponible las 24 horas, todos los días del año. La atención por agentes generalistas es de lunes a viernes, de 9:00 a 19:00, y los sábados, de 9:00 a 14:00, excepto festivos nacionales. En agosto, de lunes a viernes, el horario se reduce a 9:00–15:00. Los días 24 y 31 de diciembre, la atención es de 9:00 a 14:00. El horario de los agentes especializados depende de cada servicio. [3]", "cited": [{"n": 3, "title": "Teléfono 060 > Información sobre el teléfono 060", "text": "Teléfono 060 > Información sobre el teléfono 060\nEl teléfono 060 es un servicio de información que la Administración General del Estado pone a tu disposición. Te ofrece información administrativa general sobre los servicios públicos y trámites de la Administración General del Estado.\nLlamando al 060 puedes informarte sobre empleo público, ayudas, subvenciones y becas, localización de órganos de las Administraciones públicas, asistencia técnica sobre servicios electrónicos de la Administración General del Estado e información de Ministerios y organismos integrados (extranjería, Dirección General de Tráfico, Servicio Público de Empleo Estatal, etc.).\nEl teléfono 060 informa a través de locuciones automatizadas y, en función de la temática y del horario, también por agentes generalistas o especializados, según el caso.\nAtención automática: Horario ininterrumpido, 24 horas todos los días del año.\nAtención por un agente generalista : De lunes a viernes, de 9.00 a 19.00 horas ininterrumpidamente, excepto festivos nacionales.Durante el mes de agosto, el horario se reduce: de 9.00 a 15.00 horas ininterrumpidamente. Sábados, de 9.00 a 14.00 horas, excepto festivos nacionales. Horario especial de Navidad: Días 24 y 31 de Diciembre, de 9.00 a 14.00 horas.\nAtención por un agente especializado: Horario dependiente de cada servicio."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento sí proporciona información sobre el horario del teléfono 060: indica los horarios de atención automática, de agentes generalistas y las excepciones. Por tanto, la afirmación de que no hay información suficiente no está respaldada."}, "citation_notes": []}, {"id": "p25", "question": "puede otra persona hacer un tramite por mi?", "answerable": false, "expected": null, "answer": "Depende del trámite. Otra persona puede actuar por ti cuando el trámite admita representación; en el REA-AGE solo se pueden apoderar trámites que indiquen que puede realizarlos una persona apoderada [7]. Por ejemplo, para el canje de un permiso de conducir de la UE puede solicitarlo una persona autorizada [6]. En cambio, para registrarte en Cl@ve debes acudir personalmente [10].", "cited": [{"n": 6, "title": "Validez y canje de un permiso de conducir de la UE > Canje de permisos de conducir", "text": "Validez y canje de un permiso de conducir de la UE > Canje de permisos de conducir\nFotografía original actual de 32x26 mm. en color y con fondo liso, tomada de frente con la cabeza descubierta y sin gafas de cristales oscuros o cualquier otra prenda que pueda impedir o dificultar tu identificación. Si por tu religión llevas el cabello cubierto, se admitirán las fotografías con velo, pero el óvalo del rostro debe aparecer totalmente descubierto desde el nacimiento del pelo hasta el mentón, de forma que no impida o dificulte tu identificación.\nCualquier persona con residencia normal en España y un permiso de conducir proveniente de:\nUn estado miembro de la UE, o\nEEE (Islandia, Liechtenstein y Noruega) .\nLa solicitud de canje debe hacerla el titular del permiso o cualquier persona autorizada en su nombre.\nPara realizar la autorización a otra persona que actúe en tu representación, puedes designar un representante a través de nuestro Registro de apoderamientos\nSi el trámite lo va a realizar otra persona en su nombre, en el momento de solicitar la cita previa en el 060 , se debe indicar el DNI del interesado y también el de la persona autorizada."}, {"n": 7, "title": "Registro Electrónico de Apoderamientos > Preguntas frecuentes", "text": "Registro Electrónico de Apoderamientos > Preguntas frecuentes\n¿Cómo se registra un apoderamiento de persona jurídica?\nSi la persona interesada o la persona apoderada es una persona jurídica , deben registrar el apoderamiento de forma electrónica.\n¿Qué apoderamientos se pueden registrar en el REA-AGE?\nHay 3 tipos:\nApoderamiento tipo A Sirve para cualquier actuación o trámite en cualquier Administración Pública.\nApoderamiento tipo B Sirve para cualquier actuación o trámite en una sola Administración u órganismo público.\nApoderamiento tipo C Solo sirve para algunas actuaciones o trámites concretos.\n¿Qué puede hacer una persona poderdante por internet?\nRegistrar un apoderamiento para uno o varios trámites.\nConsultar sus apoderamientos.\nAmpliar la validez de sus apoderamientos.\nCancelar apoderamientos.\n¿Qué puede hacer una persona apoderada por internet?\nConsultar sus apoderamientos.\nRenunciar a apoderamientos.\nAceptar apoderamientos.\n¿Para qué trámites puedo apoderar?\nPara los trámites que se hayan inscrito en el Sistema de Información Administrativa y que indique que se pueden hacer por una persona apoderada.\nInfórmate en la página web de cada Administración para saber que trámites son.\nIV es un número romano. Significa 4."}, {"n": 10, "title": "Nuestra Oficina de Información y Atención a la Ciudadanía > ¿Qué te ofrecemos? > Cita previa opcional para registro en Cl@ve", "text": "Nuestra Oficina de Información y Atención a la Ciudadanía > ¿Qué te ofrecemos? > Cita previa opcional para registro en Cl@ve\nEn caso de acudir para registro en Cl@ve, para evitar desplazamientos innecesarios, asegúrate de llevar toda la documentación original necesaria:\nSi eres una persona española: DNI\nSi eres una persona extranjera de la Unión Europea: Certificado de registro de ciudadano de la UE Pasaporte o documento de identidad expedido por tu país de origen\nSi eres una persona extranjera de fuera de la Unión Europea: Tarjeta de identidad de extranjero (TIE) o Permiso de residencia Pasaporte\nEs necesario que acudas personalmente , no puede hacerlo un representante en tu lugar.\nSi el registro es para una persona menor de edad , consulta esta página ."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento sí proporciona información para responder: depende del trámite y de si admite representación, con ejemplos de trámites que puede hacer una persona autorizada y otro que requiere acudir personalmente. Por eso, no está respaldado afirmar que no hay información suficiente."}, "citation_notes": []}, {"id": "p26", "question": "puedo usar mi certificado de persona fisica para los tramites de mi empresa?", "answerable": true, "expected": "Existen otros certificados, como el de empresa; como persona física, el que corresponde es el certificado de ciudadano.", "answer": "El certificado de persona física te identifica a ti y el certificado software se admite para identificarte en trámites de la Administración [3][10]. Para el alta de una empresa colectiva se exige identificación electrónica, pero los fragmentos no indican si sirve tu certificado personal para actuar en nombre de la empresa [1].", "cited": [{"n": 1, "title": "Alta como empresario > ¿Qué trámites debo realizar y cómo los hago?", "text": "Alta como empresario > ¿Qué trámites debo realizar y cómo los hago?\nSi eres empresario individual (persona física) tienes que tener un número de Seguridad Social (NUSS) que te identifique en tus relaciones con la Seguridad Social. Si no dispones de él deberás solicitarlo con tu identificación electrónica a través del servicio Solicitar el Número de la Seguridad Social . Si no tienes identificación electrónica, puedes presentar una solicitud . Para ello necesitarás tu documento de identidad, un correo electrónico, un dispositivo electrónico con cámara y adjuntar el modelo TA.1 .\nDespués podrás darte de alta como empresario a través del Sistema RED o del servicio de la SEDESS de Inscripción y asignación de CCC para empresario individual .\nSi eres empresario colectivo (sociedades, entidades sin personalidad jurídica, ….), la única opción es la de realizar el alta con tu identificación electrónica a través del servicio de la SEDESS de Empresario Colectivo. Identificación de Empresa. Asignación de CCC inicial."}, {"n": 3, "title": "Obtención del Certificado Electrónico de la FNMT > ¿Qué es el certificado electrónico de ciudadano?", "text": "Obtención del Certificado Electrónico de la FNMT > ¿Qué es el certificado electrónico de ciudadano?\nEl certificado electrónico de ciudadano se llama también de persona física o de usuario. Hay otros certificados, como el de empresa o el de sector público. Como persona física, el que te interesa solicitar es el certificado de ciudadano. El certificado electrónico de ciudadano es un documento digital que contiene tus datos identificativos. El certificado te permite identificarte en Internet y también intercambiar información con otras personas y organismos, con la garantía de que sólo tú y tu interlocutor podéis acceder a esta información."}, {"n": 10, "title": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico", "text": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico\nCertificado software\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas instalarlo en un dispositivo electrónico (como un PC)\nSi quieres utilizarlo en varios dispositivos, tendrás que exportarlo e instalarlo en cada uno de ellos\nDNI electrónico\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nNo necesitas instalarlo en un dispositivo electrónico\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas un lector de tarjetas. A partir de la versión 3.0 del DNIe puedes utilizar el móvil como lector de tarjetas\nPuedes necesitar instalar algún programa informático adicional\nCl@ve\nVentajas:\nNo necesitas instalarlo en un dispositivo electrónico\nPuedes utilizarlo desde cualquier dispositivo (PC o móvil)\nInconvenientes:\nNo puedes utilizarlo en todos los procedimientos y trámites\nNo puedes utilizarlo en todas las Administraciones públicas\nNo te permite firmar electrónicamente"}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento no afirma que exista un certificado de empresa distinto del certificado de ciudadano; solo describe el certificado de persona física y señala que no especifica si sirve para actuar en nombre de la empresa. The response is not correct"}, "citation_notes": []}, {"id": "p27", "question": "como copio el certificado digital a otro ordenador", "answerable": true, "expected": "Hay que exportarlo e instalarlo en cada dispositivo.", "answer": "Si es un certificado software, debes exportarlo e instalarlo en el otro ordenador [1]. Los fragmentos no indican los pasos concretos para hacerlo.", "cited": [{"n": 1, "title": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico", "text": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico\nCertificado software\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas instalarlo en un dispositivo electrónico (como un PC)\nSi quieres utilizarlo en varios dispositivos, tendrás que exportarlo e instalarlo en cada uno de ellos\nDNI electrónico\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nNo necesitas instalarlo en un dispositivo electrónico\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas un lector de tarjetas. A partir de la versión 3.0 del DNIe puedes utilizar el móvil como lector de tarjetas\nPuedes necesitar instalar algún programa informático adicional\nCl@ve\nVentajas:\nNo necesitas instalarlo en un dispositivo electrónico\nPuedes utilizarlo desde cualquier dispositivo (PC o móvil)\nInconvenientes:\nNo puedes utilizarlo en todos los procedimientos y trámites\nNo puedes utilizarlo en todas las Administraciones públicas\nNo te permite firmar electrónicamente"}], "outcome": "correct", "correct_votes": [true, true, false], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p28", "question": "cuanto tarda la administracion en contestar a una solicitud", "answerable": false, "expected": null, "answer": "Los fragmentos no indican un plazo general para que la Administración conteste una solicitud. Sí señalan que la Administración resolverá la petición mediante un acto que puede concederla o denegarla, pero no dicen cuánto tarda [5].\n\nComo caso específico, para una solicitud de información accesible o una queja, se puede reclamar si pasan 20 días hábiles sin respuesta [2].", "cited": [{"n": 2, "title": "Declaración de Accesibilidad de la App Líneas de Ayuda > Procedimiento de aplicación", "text": "Declaración de Accesibilidad de la App Líneas de Ayuda > Procedimiento de aplicación\nSi una vez realizada una solicitud de información accesible o queja, ésta hubiera sido desestimada, no se estuviera de acuerdo con la decisión adoptada, o la respuesta no cumpliera los requisitos contemplados en el artículo 12.5, la persona interesada podrá iniciar una reclamación. Igualmente se podrá iniciar una reclamación en el caso de que haya trascurrido el plazo de veinte días hábiles sin haber obtenido respuesta.\nLa reclamación puede ser presentada través del siguiente procedimiento de reclamación , así como en el resto de las opciones recogidas en la Ley 39/ 2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas.\nLas comunicaciones serán recibidas y tratadas por la Dirección General de Gobernanza Pública, órgano directivo dependiente de la Secretaría de Estado de Función Pública del Ministerio para la Transformación Digital y de la Función Pública."}, {"n": 5, "title": "Cómo realizar trámites > Ciudadanos", "text": "Cómo realizar trámites > Ciudadanos\nAl expandir este botón se cierra el botón expandido previamente.\nConoce los pasos a seguir para solucionar tus asuntos o tus solicitudes dirigidas a un organismo público, ya sea para cumplir una obligación, obtener un beneficio o un servicio, o para que se resuelva una petición.\nLa Administración Pública está sujeta al derecho administrativo, que es el conjunto de normas que en cada caso son aplicables. La finalidad es resolver mediante un acto administrativo en el que se concederá o denegará la solicitud que has realizado.\nPara la realización de cualquier trámite tienes una serie de garantías, ya que la Administración Pública en ningún caso puede actuar de forma arbitraria y, además, en caso de que la resolución sea contraria a tus intereses, dispones de los recursos para poder reclamar que se cambie el sentido de la resolución."}], "outcome": "faithful", "correct_votes": [false, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p29", "question": "como pido el paro", "answerable": false, "expected": null, "answer": "Puedes presentar la solicitud en la Sede Electrónica del SEPE o en una oficina de prestaciones; para acudir a una oficina, pide cita previa por la Sede Electrónica del SEPE o por teléfono. En Ceuta y Melilla, son oficinas de empleo. [9]\n\nPara acceder a la prestación contributiva, entre otros requisitos, debes estar inscrito como demandante de empleo y haber cotizado al menos 360 días por desempleo durante los 6 años anteriores. [9]", "cited": [{"n": 9, "title": "Prestaciones por desempleo > La prestación contributiva por desempleo > Requisitos", "text": "Prestaciones por desempleo > La prestación contributiva por desempleo > Requisitos\nSe puede acceder a esta prestación si la persona trabajadora ha finalizado un contrato, ha sido despedido/a o ha sufrido una reducción de jornada y salario entre el 10 y el 70%, y se cumplen los siguientes requisitos:\nEstar afiliada o afiliado y en situación de alta en la Seguridad.\nEstar inscrito o inscrita como demandante de empleo.\nHaber trabajado y cotizado a desempleo al menos 360 días dentro de los 6 años anteriores a la situación de desempleo.\nNo haber cumplido la edad ordinaria para jubilarse.\nNo cobrar una pensión de la Seguridad Social incompatible con el trabajo.\nPuedes encontrar información completa sobre la prestación contributiva en este enlace .\nPuedes encontrar información sobre cómo presentar la solicitud en:\nLa Sede Electrónica del SEPE .\nLas oficinas de prestaciones (oficinas de empleo en el caso de Ceuta y Melilla) pidiendo cita previa en la Sede Electrónica del SEPE o a través del teléfono ."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento sí ofrece información para responder cómo pedir el paro: indica que se puede presentar la solicitud en la Sede Electrónica del SEPE o en una oficina de prestaciones, y que para acudir a una oficina hay que pedir cita previa. Por tanto, la afirmación de que no hay información suficiente no está respaldada."}, "citation_notes": []}, {"id": "p30", "question": "cuanto cobra el ingreso minimo vital", "answerable": false, "expected": null, "answer": "El fragmento indica que puedes informarte sobre el Ingreso Mínimo Vital llamando al 020, pero no indica cuánto se cobra [1].", "cited": [{"n": 1, "title": "Información para personas afectadas por la DANA > Infografías:", "text": "Información para personas afectadas por la DANA > Infografías:\nEl Ministerio pone medidas de protección a disposición de las personas trabajadoras autónomas, que podrán solicitar el cese de actividad ante la mutua de la persona trabajadora. La cuantía de la prestación es del 70% de la base reguladora. Sin periodo de carencia, es decir, aunque no se tenga el periodo mínimo exigido para tener derecho a ello, que normalmente es de un año Los días de prestación consumidos no se computan de cara a situaciones futuras (contador a cero) y, además, este periodo se les computa como cotizado.\nDesde la reforma laboral permite proteger a las personas trabajadoras y al tejido productivo en situaciones de crisis y emergencias como la DANA. La empresa puede suspender temporalmente el contrato o reducir la jornada. Exención del 1           el("summary", {}, [el("span", {className: `chip ${cases.every(c => c.passed) ? "correct" : "unsupported"}`,
            textContent: `${cases.filter(c => c.passed).length}/${cases.length}`}), el("span", {className: "q", textContent: t("securityCategories")[category] || category})]),
          el("dl", {}, cases.flatMap(c => [el("dt", {textContent: `${t("attack")} · ${c.passed ? "✓" : "✗"}`}),
            el("dd", {textContent: c.question}), el("dt", {textContent: t("reply")}), el("dd", {textContent: c.answer})]))])));
    }
    const catalogue = document.getElementById("catalogue");
    catalogue.replaceChildren();
    const c = DATA.catalogue;
    if (c) {
      const records = list => list.length ? list.map(r => el("div", {className: "record"}, [`${r.code} · `,
        r.url ? el("a", {href: r.url, target: "_blank", rel: "noopener", textContent: r.title}) : r.title])) : [t("none")];
      const item = (g, open) => el("details", {}, [
        el("summary", {}, [el("span", {className: `chip ${g.refused ? "declined" : g.expected_cited === false ? "unsupported" : "correct"}`,
          textContent: t("chip")[g.refused ? "refused" : g.expected_cited === true ? "right" : g.expected_cited === false ? "other" : "answers"]}),
          el("span", {className: "q", textContent: g.question})]),
        el("dl", {}, [
          ...(open ? [el("dt", {textContent: t("expectedRecord")}), el("dd", {}, g.has_expected ? records(g.expected) : [t("noRecord")])] : []),
          el("dt", {textContent: t("answer")}), el("dd", {textContent: g.refused ? t("refusalText") : g.answer}),
          el("dt", {textContent: t("citedRecords")}), el("dd", {}, records(g.cited))])]);
      const groups = new Map();
      for (const s of c.security) { if (!groups.has(s.category)) groups.set(s.category, []); groups.get(s.category).push(s); }
      catalogue.append(el("h2", {textContent: t("catalogueTitle")}), el("p", {textContent: t("catalogueText")(c)}),
        el("div", {className: "cards"}, t("catalogueCards")(c).map(([n, label, text]) => el("div", {className: "card"}, [
          el("div", {className: "n", textContent: n}), el("div", {className: "label", textContent: label}), el("p", {textContent: text})]))),
        el("h2", {textContent: t("gapTitle")}), ...c.gap.map(g => item(g, true)),
        el("h2", {textContent: t("existingTitle")}), ...c.existing.answered.map(g => item(g, false)),
        el("h2", {textContent: `${t("catalogueAttacks")}: ${c.security.filter(s => s.passed).length}/${c.security.length} ${t("securityPassed")}`}),
        ...[...groups].map(([category, cases]) => el("details", {}, [
          el("summary", {}, [el("span", {className: `chip ${cases.every(x => x.passed) ? "correct" : "unsupported"}`,
            textContent: `${cases.filter(x => x.passed).length}/${cases.length}`}), el("span", {className: "q", textContent: t("securityCategories")[category] || category})]),
          el("dl", {}, cases.flatMap(x => [el("dt", {textContent: `${t("attack")} · ${x.passed ? "✓" : "✗"}`}),
            el("dd", {textContent: x.question}), el("dt", {textContent: t("reply")}), el("dd", {textContent: x.answer})]))])));
    }
    const links = document.getElementById("links");
    links.replaceChildren();
    if (DATA.links) {
      const l = DATA.links;
      const table = el("table", {className: "history"}, [
        el("tr", {}, [el("th"), el("th", {textContent: t("linksNoise")}), el("th", {textContent: t("linksLost")})]),
        ...l.versions.map(v => el("tr", {}, [el("th", {textContent: t("linksVersion")(v.name)}),
          el("td", {textContent: v.noise}), el("td", {textContent: v.lost})]))]);
      links.append(el("h2", {textContent: t("linksTitle")}), el("p", {textContent: t("linksText")(l)}), el("div", {className: "table-wrap"}, [table]));
    }
    const rows = DATA.questions.filter(q => !onlyFailures || q.outcome === "missed" || q.outcome === "unsupported");
    document.getElementById("list").replaceChildren(...rows.map(q => el("details", {}, [
      el("summary", {}, [el("span", {className: `chip ${q.outcome}`, textContent: t(q.outcome)[0]}),
                         el("span", {className: "q", textContent: q.question})]),
      el("dl", {}, [
        el("dt", {textContent: t("expected")}), el("dd", {textContent: q.expected || t("noExpected")}),
        el("dt", {textContent: t("answer")}), el("dd", {textContent: q.answer}),
        ...(q.reason ? [el("dt", {textContent: t("why")[q.reason.criterion]}), el("dd", {className: "reason", textContent: q.reason.text})] : []),
        ...(q.citation_notes.length ? [el("dt", {textContent: t("noteTitle")}),
          ...q.citation_notes.map(n => el("dd", {className: "note", textContent: t("note")(n)}))] : []),
        el("dt", {textContent: t("cited")}),
        el("dd", {}, q.cited.length ? q.cited.map(c => el("details", {className: "passage"}, [
          el("summary", {textContent: `[${c.n}] ${c.title}`}),
          el("div", {textContent: c.text})])) : [t("none")]),
        el("dt", {textContent: t("votes")}), el("dd", {textContent: t("voteText")(tally(q.correct_votes), tally(q.grounded_votes))}),
      ])])));
  }
  document.getElementById("lang").addEventListener("click", () => {
    lang = lang === "es" ? "en" : "es";
    try { localStorage.setItem("lang", lang); } catch (_) { /* not remembered */ }
    render();
  });
  render();
</script>
</body>
</html>
