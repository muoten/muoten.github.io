 de solicitud en tu correo electrónico, que necesitarás para el siguiente paso.\nSi ya tuvieras un certificado de ciudadano, al solicitar el nuevo, se dejaría sin efecto el que ya tengas.\nPaso 3. Acreditar tu identidad\nPara acreditar tu identidad, debes ir a una oficina presencialmente, llevando\nSi tu nacionalidad es española, tu DNI\nSi tu nacionalidad es extranjera, tu NIE y pasaporte\nEn los 2 casos anteriores, el código de solicitud que recibiste al realizar el paso 2\nPuedes consultar aquí el mapa de oficinas. Debes elegir la opción de certificados de persona física.\nUna vez que hayas acreditado tu identidad en una oficina, podrás descargar tu certificado inmediatamente en tu ordenador; se recomienda descargarlo lo antes posible."}, {"n": 28, "title": "Obtención del Certificado Electrónico de la FNMT", "part": 6, "text": "Consulta la sede electrónica de la FNMT para más información sobre cómo acreditar tu identidad.\nPaso 4. Descargar el certificado\nDebes usar el mismo ordenador y el mismo usuario con el que iniciaste la sesión en el ordenador, en el caso de que haya más de uno. También debes utilizar el mismo navegador con el que realizaste la solicitud (ver navegadores compatibles).\nPara descargar el certificado, accede a esta página de la sede electrónica de la FNMT y cumplimenta los datos que se indican.\nUna vez cumplimentados los datos, lee y acepta las condiciones de uso del certificado y pulsa el botón de “descargar certificado”.\n¿Cómo renovar mi certificado de ciudadano?\nPuedes llevar a cabo la renovación de tu certificado durante los 60 días previos a la fecha de caducidad del certificado, siempre y cuando no haya sido previamente revocado.\nPara más información, consulta la sede electrónica de la FNMT:\nPasos a seguir sobre la renovación de tu certificado"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p02", "question": "cuanto tiempo tarda en llegar el certificado ": 25, "title": "Obtención del Certificado Electrónico de la FNMT", "part": 3, "text": "Cualquier persona, de nacionalidad española o extranjera, mayor de edad o menor emancipado, que esté en posesión de su documento de identidad (DNI si es nacionalidad española; o NIE y pasaporte, si es nacionalidad extranjera).\n¿Tiene coste la obtención de un certificado de ciudadano?\nNo. El certificado de ciudadano de la FNMT es gratuito.\nÚnicamente, en el caso de que obtengas el certificado con vídeo identificación, tendrás que abonar un coste de 2,99€ más impuestos por este servicio.\n¿Qué pasos debo seguir para obtener el certificado de ciudadano?\nA lo largo del proceso de obtención del certificado, será necesario que acredites tu identidad. Hay 3 formas de acreditar tu identidad:\nPresencialmente, en una oficina\nElectrónicamente, con vídeo identificación\nElectrónicamente, utilizando tu DNIe\nSegún como vayas a acreditar tu identidad, hay\n4 formas de obtener el certificado:\nObtención del certificado con acreditación presencial\nObtención del certificado con vídeo identificación\nObtención del certificado utilizando tu DNIe"}, {"n": 26, "title": "Obtención del Certificado Electrónico de la FNMT", "part": 4, "text": "Obtención del certificado a través de la App\nA continuación, te indicamos los pasos a seguir para obtener el certificado con acreditación presencial.\nAntes de solicitar el certificado\nAntes de solicitar el certificado, tienes que decidir en qué equipo informático (ordenador) quieres tenerlo instalado, ya que la solicitud debes hacerla desde ese mismo ordenador.\nA continuación, tienes que seguir\n4 pasos, que te explicamos seguidamente.\nLa configuración previa consiste en que tienes que asegurarte de que tu ordenador tiene instalados los programas informáticos (software) necesarios para poder solicitar el certificado e instalarlo.\nPaso 1. Configuración previa de tu equipo informático\nConsulta en la sede electrónica de la FNMT los detalles para realizar la configuración, así como instrucciones para evitar posibles errores durante el proceso de obtención del certificado.\nPaso 2. Solicitar el certificado\nAccede a esta página de la sede electrónica de la FNMT y rellena el formulario, siguiendo las instrucciones que se indican."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p04", "question": "que diferencia hay entre clave pin y clave permanente", "answerable": true, "expected": "Cl@ve permanente es una contraseña de validez duradera, para usuarios habituales; Cl@ve PIN es una contraseña de validez muy limitada, para quien accede con poca frecuencia.", "answer": "Cl@ve PIN tiene una validez muy limitada y está pensada para quienes acceden con poca frecuencia. Cl@ve Permanente dura más tiempo (aunque no indefinidamente) y está orientada a quienes usan los servicios habitualmente. [20]", "cited": [{"n": 20, "title": "Registrarte en cl@ve", "part": 3, "text": "Puedes encontrar más información en la web de Cl@ve y en las preguntas frecuentes sobre el registro en Cl@ve\nTres usos posibles: Cl@ve Móvil, Cl@ve Permanente y Cl@ve PIN\nUna vez que te hayas registrado en Cl@ve, hay tres posibilidades de uso:\nCl@ve Móvil: sistema de autenticación a través de notificación recibida en el móvil, sin necesidad de recordar ninguna contraseña.\nCl@ve permanente: sistema de contraseña de validez duradera en el tiempo (aunque no ilimitada), orientado a usuarios habituales.\nCl@ve PIN: sistema de contraseña de validez muy limitada en el tiempo, orientado a usuarios que acceden con poca frecuencia a los servicios.\nOficinas de registro en Cl@ve\nPara registrarte en Cl@ve de forma presencial, tienes que acudir a una Oficina de Registro Cl@ve.\nAlgunas requieren cita previa.\nConsulta aquí cómo buscar Oficinas de Registro Cl@ve.\nCl@ve Firma: firma sin certificado electrónico"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p05", "question": "como me registro en cl@ve sin ir a una oficina", "answerable": true, "expected": "Por internet: con vídeoidentificación en la App Cl@ve, sin certificado mediante carta de invitación o videollamada (nivel básico), o con certificado electrónico o DNIe en la sede de la Agencia Tributaria.", "answer": "Puedes registrarte en Cl@ve sin ir a una oficina de estas formas:\n\n- Con la app Cl@ve y vídeoidentificación automática: obtendrás el nivel básico. Temporalmente, esta opción solo está disponible para personas españolas con DNI en vigor. [19]\n- Por internet, sin certificado electrónico, mediante carta de invitación o videollamada. El registro básico no permite acceder a todos los servicios. [19]\n- Por internet, con certificado electrónico o DNIe, desde la sede electrónica de la Agencia Tributaria. [19]", "cited": [{"n": 19, "title": "Registrarte en cl@ve", "part": 2, "text": "Hay 4 formas:\nCon vídeoidentificación automática con la App Cl@ve. Siguiendo las instrucciones de la aplicación, obtendrás en pocos minutos el nivel de registro básico en Cl@ve. En un proceso posterior, una vez completada satisfactoriamente la revisión de evidencias electrónicas (vídeo, documento de identidad y biometría facial) por parte de un empleado público autorizado, puedes obtener directamente el nivel de registro avanzado. Temporalmente sólo se ofrece este servicio a personas españolas con DNI en vigor.\nA través de internet, sin certificado electrónico. Este tipo de registro es de nivel básico y no permite acceder a todos los servicios. Puede ser mediante carta de invitación o por videollamada\nA través de internet, con certificado electrónico o DNIe (DNI electrónico).\nEl registro en Cl@ve a través de internet se realiza en la sede electrónica de la Agencia Tributaria\n(AEAT)\nDe forma presencial. El registro de forma presencial se realiza acudiendo a una oficina de registro Cl@ve"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p06", "question": "se puede firmar con cl@ve?", "answerable": true, "expected": "Sí, con Cl@ve Firma, en determinados trámites; requiere registro de nivel avanzado, Cl@ve Permanente activada y generar el certificado de firma. Una de las guías dice lo contrario, así que una respuesta que señale la contradicción también es correcta.", "answer": "Sí, Cl@ve permite firmar electrónicamente en determinados trámites mediante Cl@ve Firma [12]. Para usar esta firma se requiere registro avanzado, activar Cl@ve Permanente y generar el certificado de firma [21]. Sin embargo, otro fragmento afirma que Cl@ve no permite firmar electrónicamente [13]; la información es contradictoria.", "cited": [{"n": 12, "title": "Identificación Electrónica", "part": 4, "text": "Realizar trámites que requieran firma. Por ejemplo, formular una solicitud.\nAdemás del certificado electrónico, necesitas una aplicación de firma\nPara trámites que requieran firma, necesitarás tener instalada la aplicación de firma AutoFirma. La puedes descargar aquí.\nCl@ve\nCl@ve es un sistema que simplifica el acceso electrónico a los servicios públicos mediante claves concertadas, complementando el DNI electrónico y los certificados digitales.\nPermite identificarse y autenticarse de forma sencilla y segura, así como firmar electrónicamente en determinados trámites mediante certificados personales en la nube\nCl@ve Firma.\nAdemás, facilita la realización de gestiones desde dispositivos móviles.\nCuándo utilizar un certificado software, Cl@ve o DNI electrónico\nCertificado software\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas instalarlo en un dispositivo electrónico (como un PC)\nSi quieres utilizarlo en varios dispositivos, tendrás que exportarlo e instalarlo en cada uno de ellos\nDNI electrónico\nVentajas:"}, {"n": 13, "title": "Identificación Electrónica", "part": 5, "text": "Se admite para identificarte en cualquier procedimiento o trámite de la Administración\nNo necesitas instalarlo en un dispositivo electrónico\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas un lector de tarjetas. A partir de la versión 3.0 del DNIe puedes utilizar el móvil como lector de tarjetas\nPuedes necesitar instalar algún programa informático adicional\nCl@ve\nVentajas:\nNo necesitas instalarlo en un dispositivo electrónico\nPuedes utilizarlo desde cualquier dispositivo (PC o móvil)\nInconvenientes:\nNo puedes utilizarlo en todos los procedimientos y trámites\nNo puedes utilizarlo en todas las Administraciones públicas\nNo te permite firmar electrónicamente\nRegulación normativa\nLa identificación electrónica está regulada en las siguientes disposiciones normativas:\nReal Decreto 1553/2005, de 23 de diciembre, por el que se regula la expedición del documento nacional de identidad y sus certificados de firma electrónica\nLey 39/2015, artículos 9 y 10, y disposición adicional 8ª"}, {"n": 21, "title": "Registrarte en cl@ve", "part": 4, "text": "Una de las principales novedades que incorpora el sistema Cl@ve es la posibilidad de realizar firma electrónica mediante certificados electrónicos centralizados, es decir, certificados electrónicos almacenados y custodiados por la Administración Pública.\nEstos certificados centralizados, o \"certificados en la nube\", permiten al ciudadano firmar documentos electrónicos desde cualquier dispositivo que tenga conexión a Internet y sin necesidad de disponer de certificado electrónico.\nPara utilizar la firma centralizada es necesario  haber realizado previamente los siguientes pasos:\nRegistro de Nivel Avanzado en el sistema Cl@ve\nActivación de la Cl@ve Permanente\nGeneración del certificado de firma\nPuedes encontrar más información en el apartado de Cl@ve Firma de la web de Cl@ve\nRegulación\nOrden PRE/1838/2014, de 8 de octubre, por la que se publica el Acuerdo de Consejo de Ministros, de 19 de septiembre de 2014, por el que se aprueba\nCl@ve, la plataforma común del Sector Público Administrativo Estatal para la identificación, autenticación y firma electrónica mediante el uso de claves concertadas"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p07", "question": "he perdido el dni, puedo usar clave igualmente?", "answerable": false, "expected": null, "answer": "Una vez que te hayas registrado, Cl@ve ofrece opciones de uso como Cl@ve Móvil, Cl@ve Permanente y Cl@ve PIN [20]. Para registrarte, si eres español, se solicita el DNI [18]. Los fragmentos no indican si perderlo afecta al uso de una cuenta ya registrada ni cómo proceder en ese caso.", "cited": [{"n": 18, "title": "Registrarte en cl@ve", "part": 1, "text": "¿Qué es Cl@ve?\nCl@ve es un sistema para identificarte electrónicamente ante las Administraciones Públicas con garantías de seguridad, sin tener que recordar claves diferentes para acceder a los distintos servicios.\nTienes más información en la página web de Cl@ve, que también incluye preguntas frecuentes.\n¿Qué necesito para poder utilizar Cl@ve?\nAntes de usar Cl@ve, tienes que registrarte en el sistema, aportando los datos necesarios:\nNúmero de teléfono móvil nacional o extranjero\nCorreo electrónico\nSi eres español,\nDNI\nSi eres extranjero y tienes\nNIE:\nCertificado de registro de ciudadano de la UE, tarjeta de identidad de extranjero o permiso de residencia, y además\nPasaporte (si eres ciudadano de la UE, también puedes identificarte con el documento de identidad del país de origen, en lugar del pasaporte)\n​Para garantizar que sólo la persona registrada tiene acceso a los códigos PIN enviados al teléfono móvil, sólo se puede asociar un DNI/NIE a un mismo número de móvil.\n¿Cómo puedo registrarme en Cl@ve?"}, {"n": 20, "title": "Registrarte en cl@ve", "part": 3, "text": "Puedes encontrar más información en la web de Cl@ve y en las preguntas frecuentes sobre el registro en Cl@ve\nTres usos posibles: Cl@ve Móvil, Cl@ve Permanente y Cl@ve PIN\nUna vez que te hayas registrado en Cl@ve, hay tres posibilidades de uso:\nCl@ve Móvil: sistema de autenticación a través de notificación recibida en el móvil, sin necesidad de recordar ninguna contraseña.\nCl@ve permanente: sistema de contraseña de validez duradera en el tiempo (aunque no ilimitada), orientado a usuarios habituales.\nCl@ve PIN: sistema de contraseña de validez muy limitada en el tiempo, orientado a usuarios que acceden con poca frecuencia a los servicios.\nOficinas de registro en Cl@ve\nPara registrarte en Cl@ve de forma presencial, tienes que acudir a una Oficina de Registro Cl@ve.\nAlgunas requieren cita previa.\nConsulta aquí cómo buscar Oficinas de Registro Cl@ve.\nCl@ve Firma: firma sin certificado electrónico"}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p08", "question": "me ha llegado un aviso de notificacion electronica, donde la veo?", "answerable": true, "expected": "En la Dirección Electrónica Habilitada única (DEHú) o en la Carpeta Ciudadana, con certificado digital o Cl@ve; a veces también en la sede electrónica del organismo que la emite.", "answer": "Puedes ver la notificación en la Dirección Electrónica Habilitada única (DEHú) o en tu Carpeta Ciudadana; en algunos casos, también en la sede electrónica del organismo que la envió. Necesitarás identificarte con certificado digital o Cl@ve para acceder a la DEHú o a Carpeta Ciudadana. [16]", "cited": [{"n": 16, "title": "Notificaciones", "part": 2, "text": "Podrás acceder a tus notificaciones directamente a través de la Dirección Electrónica Habilitada única (DEHú), o bien a través de tu Carpeta Ciudadana. Para poder acceder a la DEHú o a la Carpeta Ciudadana necesitarás un medio de identificación electrónico (certificado digital o Cl@ve).\nAsimismo, en algunos casos también se puede acceder a las notificaciones electrónicas en las sedes electrónicas de los organismos públicos que las emiten. Dicha información la encontrarás a la hora de realizar el trámite vía electrónica.\nObligación de tramitación electrónica\nComo hemos comentado antes, existen casos en los que tienes la obligación de realizar los trámites con la Administración de manera electrónica, así como recibir las notificaciones administrativas de esta manera. Dichos supuestos quedan establecidos en el artículo 14 de la Ley 39/2015\n(por ejemplo, las personas jurídicas)."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p09", "question": "cuantos dias tengo para abrir una notificacion electronica antes de que cuente como rechazada", "answerable": false, "expected": null, "answer": "No tengo información suficiente para responder.", "cited": [], "outcome": "declined", "correct_votes": [true, true, true], "grounded_votes": null, "reason": null}, {"id": "p10", "question": "soy autonomo, estoy obligado a hacer los tramites por internet?", "answerable": false, "expected": null, "answer": "Los fragmentos no indican que ser autónomo, por sí solo, te obligue a hacer los trámites por internet. En general, puedes tramitar presencialmente si no tienes obligación de relacionarte electrónicamente; esta obligación depende de ciertos casos o procedimientos [2][6]. No consta si tu situación concreta está incluida.", "cited": [{"n": 2, "title": "Cómo realizar trámites", "part": 2, "text": "En el caso de los ciudadanos, siempre que no estén obligados a relacionarse electrónicamente con la Administración, toda tramitación con la Administración pública se puede llevar a cabo de forma presencial y, en la mayoría de casos, también de forma electrónica. También puedes elegir recibir las notificaciones de la Administración pública tanto en formato papel como de forma electrónica.\nEn el caso de que, debido al trámite particular que estés realizando, estés obligado a relacionarte por medios electrónicos con la Administración, únicamente podrás comunicarte mediante este medio, sin posibilidad de hacerlo presencialmente en formato papel. Consulta más información al respecto en los apartados siguientes de esta página.\nPara obtener más información sobre los trámites existentes, puedes acceder a las distintas secciones del menú\nMás sobre \"Trámites\", situado a la derecha de esta página.\nTramitación presencial"}, {"n": 6, "title": "Relacionarte electrónicamente con la Administración", "part": 2, "text": "Tienes derecho a relacionarte electrónicamente con las Administraciones Públicas, y a poder elegir en todo momento si te comunicas con las Administraciones Públicas para el ejercicio de tus derechos y obligaciones a través de medios electrónicos o no.\nPero hay determinadas personas o ciertos casos en los que tienes la obligación de relacionarte electrónicamente.\nDichos supuestos quedan establecidos en el artículo 14 de la Ley 39/2015\n(por ejemplo, las personas jurídicas).\nAdemás, la Administración pública puede establecer reglamentariamente la obligación para ciertas personas físicas en determinados procedimientos. Por ejemplo, las personas que opositen a Cuerpos de la Administración General del Estado son personas obligadas, según la disposición adicional primera del Real Decreto 203/2021.\n¿Tengo derecho a la asistencia en el uso de los medios electrónicos?\nHay personas que no están habituadas al uso de las tecnologías y que pueden tener dificultades a la hora de realizar algún trámite por vía electrónica con la Administración pública."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p11", "question": "puedo entregar un papel en cualquier oficina de registro aunque sea para otro ministerio?", "answerable": false, "expected": null, "answer": "Puedes presentar solicitudes en oficinas de registro [3], pero los fragmentos no especifican si puede ser cualquier oficina ni si sirve para trámites dirigidos a otro ministerio.", "cited": [{"n": 3, "title": "Cómo realizar trámites", "part": 3, "text": "En caso de que elijas llevar a cabo la tramitación de manera presencial, puedes presentar tus solicitudes en las oficinas de registro. Hay casos, como la obtención del DNI, que únicamente están disponibles de manera presencial.\nPara agilizar los trámites que se realicen de forma presencial, los distintos organismos de la administración están habilitando sistemas de cita previa. Por ejemplo, el Ministerio del Interior para la gestión de la nueva expedición o la renovación del Documento Nacional de Identidad o del Pasaporte; el Ministerio de Política Territorial y Memoria Democrática para los trámites de extranjería; la Dirección General de Tráfico para los trámites del carnet de conducir; la Seguridad Social para los trámites sobre la cotización; las Comunidades Autónomas para asistir al médico de medicina general, etc.\nPuedes obtener más información o consultar tus dudas: en las Oficinas de Información de las Administraciones Públicas llamando al teléfono 060 a través del buzón de atención a través del WebChat 060"}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p12", "question": "que es la sede electronica", "answerable": true, "expected": "Es la dirección de internet a través de la cual se realizan los trámites de una administración u organismo público; equivale a la sede física.", "answer": "La sede electrónica es la dirección de internet de una Administración u organismo público donde puedes realizar trámites. [5]", "cited": [{"n": 5, "title": "Relacionarte electrónicamente con la Administración", "part": 1, "text": "Portales de Internet y Sedes Electrónicas\nPor lo general, podemos distinguir entre dos tipos de sitios web a través de los cuáles te puedes relacionar electrónicamente con la Administraciones Públicas. ¿Cuáles son las diferencias?:\nPortal de internet.\nEs el punto de acceso electrónico a través del cual puedes acceder, a través de internet, a la información que publica una Administración Pública u organismo público.\nTambién te permite el acceso a la sede electrónica correspondiente.\nSede electrónica.\nEs la dirección de internet a través de la cual puedes realizar los trámites correspondientes a una administración u organismo público. Las sedes electrónicas son el equivalente a las sedes físicas donde la ciudadanía se dirige para hacer un trámite.\n¿Tengo obligación de relacionarme electrónicamente con la Administración?"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p13", "question": "que diferencia hay entre el portal y la sede electronica", "answerable": true, "expected": "El portal da acceso a la información que publica la Administración; la sede electrónica es donde se realizan los trámites.", "answer": "El **portal de internet** permite consultar información publicada por una Administración y acceder a la sede electrónica. La **sede electrónica** es el sitio donde puedes realizar trámites con esa Administración. [5]", "cited": [{"n": 5, "title": "Relacionarte electrónicamente con la Administración", "part": 1, "text": "Portales de Internet y Sedes Electrónicas\nPor lo general, podemos distinguir entre dos tipos de sitios web a través de los cuáles te puedes relacionar electrónicamente con la Administraciones Públicas. ¿Cuáles son las diferencias?:\nPortal de internet.\nEs el punto de acceso electrónico a través del cual puedes acceder, a través de internet, a la información que publica una Administración Pública u organismo público.\nTambién te permite el acceso a la sede electrónica correspondiente.\nSede electrónica.\nEs la dirección de internet a través de la cual puedes realizar los trámites correspondientes a una administración u organismo público. Las sedes electrónicas son el equivalente a las sedes físicas donde la ciudadanía se dirige para hacer un trámite.\n¿Tengo obligación de relacionarme electrónicamente con la Administración?"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p14", "question": "no tengo certificado ni clave, como presento una solicitud?", "answerable": true, "expected": "Si no estás obligado a relacionarte electrónicamente, puedes presentarla de forma presencial en una oficina de registro; también tienes derecho a asistencia, incluida la de un funcionario habilitado que actúa en tu nombre.", "answer": "Si no tienes obligación de relacionarte electrónicamente con la Administración, puedes presentar la solicitud presencialmente en una oficina de registro [2][3].\n\nSi tienes esa obligación, solo puedes presentarla por medios electrónicos [2]. Para iniciar el trámite electrónicamente necesitas identificación electrónica [8]. Puedes registrarte en Cl@ve presencialmente en una oficina de registro Cl@ve; algunas requieren cita previa [19]. No consta si tu trámite admite Cl@ve ni si exige un nivel de registro concreto.", "cited": [{"n": 2, "title": "Cómo realizar trámites", "part": 2, "text": "En el caso de los ciudadanos, siempre que no estén obligados a relacionarse electrónicamente con la Administración, toda tramitación con la Administración pública se puede llevar a cabo de forma presencial y, en la mayoría de casos, también de forma electrónica. También puedes elegir recibir las notificaciones de la Administración pública tanto en formato papel como de forma electrónica.\nEn el caso de que, debido al trámite particular que estés realizando, estés obligado a relacionarte por medios electrónicos con la Administración, únicamente podrás comunicarte mediante este medio, sin posibilidad de hacerlo presencialmente en formato papel. Consulta más información al respecto en los apartados siguientes de esta página.\nPara obtener más información sobre los trámites existentes, puedes acceder a las distintas secciones del menú\nMás sobre \"Trámites\", situado a la derecha de esta página.\nTramitación presencial"}, {"n": 3, "title": "Cómo realizar trámites", "part": 3, "text": "En caso de que elijas llevar a cabo la tramitación de manera presencial, puedes presentar tus solicitudes en las oficinas de registro. Hay casos, como la obtención del DNI, que únicamente están disponibles de manera presencial.\nPara agilizar los trámites que se realicen de forma presencial, los distintos organismos de la administración están habilitando sistemas de cita previa. Por ejemplo, el Ministerio del Interior para la gestión de la nueva expedición o la renovación del Documento Nacional de Identidad o del Pasaporte; el Ministerio de Política Territorial y Memoria Democrática para los trámites de extranjería; la Dirección General de Tráfico para los trámites del carnet de conducir; la Seguridad Social para los trámites sobre la cotización; las Comunidades Autónomas para asistir al médico de medicina general, etc.\nPuedes obtener más información o consultar tus dudas: en las Oficinas de Información de las Administraciones Públicas llamando al teléfono 060 a través del buzón de atención a través del WebChat 060"}, {"n": 8, "title": "Relacionarte electrónicamente con la Administración", "part": 4, "text": "Si no sabes por dónde empezar para realizar un trámite con la Administración pública, ya sea de forma presencial o vía electrónica, consulta nuestra sección sobre cómo realizar un trámite.\nPara poder iniciar un procedimiento o realizar un trámite electrónicamente, como interesado o representante, tienes que disponer de una identificación electrónica. Consulta nuestra página sobre identificación electrónica para saber más sobre esta cuestión.\nUna vez iniciado un procedimiento, puedes escoger el modo en que la Administración se comunique contigo, para solicitarte más información, o para notificarte la resolución del procedimiento administrativo. Consulta nuestra página sobre notificaciones para conocer más sobre esta cuestión, incluidas las notificaciones electrónicas.\nRegistrarte en cl@ve\nObtención del Certificado Electrónico de la FNMT\nRegulación normativa\nLa actuación y funcionamiento del sector público por medios electrónicos están regulados en el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, en desarrollo de las leyes\n39/2015 y 40/2015."}, {"n": 19, "title": "Registrarte en cl@ve", "part": 2, "text": "Hay 4 formas:\nCon vídeoidentificación automática con la App Cl@ve. Siguiendo las instrucciones de la aplicación, obtendrás en pocos minutos el nivel de registro básico en Cl@ve. En un proceso posterior, una vez completada satisfactoriamente la revisión de evidencias electrónicas (vídeo, documento de identidad y biometría facial) por parte de un empleado público autorizado, puedes obtener directamente el nivel de registro avanzado. Temporalmente sólo se ofrece este servicio a personas españolas con DNI en vigor.\nA través de internet, sin certificado electrónico. Este tipo de registro es de nivel básico y no permite acceder a todos los servicios. Puede ser mediante carta de invitación o por videollamada\nA través de internet, con certificado electrónico o DNIe (DNI electrónico).\nEl registro en Cl@ve a través de internet se realiza en la sede electrónica de la Agencia Tributaria\n(AEAT)\nDe forma presencial. El registro de forma presencial se realiza acudiendo a una oficina de registro Cl@ve"}], "outcome": "unsupported", "correct_votes": [true, true, true], "grounded_votes": [false, false, false], "reason": "El documento respalda que, si no existe obligación de relacionarse electrónicamente, se pueden presentar solicitudes presencialmente en oficinas de registro; si existe esa obligación, la comunicación debe ser electrónica; y para iniciar un trámite electrónicamente se necesita identificación electrónica. También indica que el registro en Cl@ve puede hacerse presencialmente en una oficina de registro Cl@ve. Sin embargo, no afirma que algunas oficinas de registro Cl@ve requieran cita previa: la mención a citas previas se refiere a otros trámites y organismos. La observación de que no se especifica si el trámite admite Cl@ve o exige un nivel concreto no contradice el documento."}, {"id": "p15", "question": "el dni electronico sirve para firmar?", "answerable": true, "expected": "Sí, el DNI electrónico permite firmar electrónicamente.", "answer": "Sí, el DNI electrónico permite firmar electrónicamente [13].", "cited": [{"n": 13, "title": "Identificación Electrónica", "part": 5, "text": "Se admite para identificarte en cualquier procedimiento o trámite de la Administración\nNo necesitas instalarlo en un dispositivo electrónico\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas un lector de tarjetas. A partir de la versión 3.0 del DNIe puedes utilizar el móvil como lector de tarjetas\nPuedes necesitar instalar algún programa informático adicional\nCl@ve\nVentajas:\nNo necesitas instalarlo en un dispositivo electrónico\nPuedes utilizarlo desde cualquier dispositivo (PC o móvil)\nInconvenientes:\nNo puedes utilizarlo en todos los procedimientos y trámites\nNo puedes utilizarlo en todas las Administraciones públicas\nNo te permite firmar electrónicamente\nRegulación normativa\nLa identificación electrónica está regulada en las siguientes disposiciones normativas:\nReal Decreto 1553/2005, de 23 de diciembre, por el que se regula la expedición del documento nacional de identidad y sus certificados de firma electrónica\nLey 39/2015, artículos 9 y 10, y disposición adicional 8ª"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p16", "question": "que necesito para usar el dnie en el ordenador", "answerable": true, "expected": "Un lector de tarjetas (desde la versión 3.0 del DNIe sirve el móvil) y puede que algún programa adicional.", "answer": "Para usar el DNIe en el ordenador necesitas un lector de tarjetas; también podrías necesitar instalar algún programa adicional. [13]", "cited": [{"n": 13, "title": "Identificación Electrónica", "part": 5, "text": "Se admite para identificarte en cualquier procedimiento o trámite de la Administración\nNo necesitas instalarlo en un dispositivo electrónico\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas un lector de tarjetas. A partir de la versión 3.0 del DNIe puedes utilizar el móvil como lector de tarjetas\nPuedes necesitar instalar algún programa informático adicional\nCl@ve\nVentajas:\nNo necesitas instalarlo en un dispositivo electrónico\nPuedes utilizarlo desde cualquier dispositivo (PC o móvil)\nInconvenientes:\nNo puedes utilizarlo en todos los procedimientos y trámites\nNo puedes utilizarlo en todas las Administraciones públicas\nNo te permite firmar electrónicamente\nRegulación normativa\nLa identificación electrónica está regulada en las siguientes disposiciones normativas:\nReal Decreto 1553/2005, de 23 de diciembre, por el que se regula la expedición del documento nacional de identidad y sus certificados de firma electrónica\nLey 39/2015, artículos 9 y 10, y disposición adicional 8ª"}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": "El documento indica que se necesita un lector de tarjetas para usar el DNIe en el ordenador, así que la primera afirmación está respaldada. No menciona que desde el DNIe 3.0 se pueda usar el móvil como lector, por lo que esa afirmación no está respaldada. The response is not correct"}, {"id": "p17", "question": "cuanto cuesta el certificado digital de la fnmt", "answerable": true, "expected": "Es gratuito; solo la obtención con vídeo identificación cuesta 2,99 € más impuestos.", "answer": "El certificado de ciudadano de la FNMT es gratuito. Si lo obtienes mediante vídeo identificación, el servicio cuesta 2,99 € más impuestos. [25]", "cited": [{"n": 25, "title": "Obtención del Certificado Electrónico de la FNMT", "part": 3, "text": "Cualquier persona, de nacionalidad española o extranjera, mayor de edad o menor emancipado, que esté en posesión de su documento de identidad (DNI si es nacionalidad española; o NIE y pasaporte, si es nacionalidad extranjera).\n¿Tiene coste la obtención de un certificado de ciudadano?\nNo. El certificado de ciudadano de la FNMT es gratuito.\nÚnicamente, en el caso de que obtengas el certificado con vídeo identificación, tendrás que abonar un coste de 2,99€ más impuestos por este servicio.\n¿Qué pasos debo seguir para obtener el certificado de ciudadano?\nA lo largo del proceso de obtención del certificado, será necesario que acredites tu identidad. Hay 3 formas de acreditar tu identidad:\nPresencialmente, en una oficina\nElectrónicamente, con vídeo identificación\nElectrónicamente, utilizando tu DNIe\nSegún como vayas a acreditar tu identidad, hay\n4 formas de obtener el certificado:\nObtención del certificado con acreditación presencial\nObtención del certificado con vídeo identificación\nObtención del certificado utilizando tu DNIe"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p18", "question": "se me ha caducado el certificado digital, como lo renuevo?", "answerable": true, "expected": "La renovación se puede hacer durante los 60 días previos a la caducidad, si no ha sido revocado.", "answer": "La guía indica que puedes renovar el certificado durante los 60 días previos a su caducidad, siempre que no haya sido revocado. No especifica cómo renovarlo una vez caducado; para más información, puedes consultar las preguntas frecuentes de la FNMT. [28][29]", "cited": [{"n": 28, "title": "Obtención del Certificado Electrónico de la FNMT", "part": 6, "text": "Consulta la sede electrónica de la FNMT para más información sobre cómo acreditar tu identidad.\nPaso 4. Descargar el certificado\nDebes usar el mismo ordenador y el mismo usuario con el que iniciaste la sesión en el ordenador, en el caso de que haya más de uno. También debes utilizar el mismo navegador con el que realizaste la solicitud (ver navegadores compatibles).\nPara descargar el certificado, accede a esta página de la sede electrónica de la FNMT y cumplimenta los datos que se indican.\nUna vez cumplimentados los datos, lee y acepta las condiciones de uso del certificado y pulsa el botón de “descargar certificado”.\n¿Cómo renovar mi certificado de ciudadano?\nPuedes llevar a cabo la renovación de tu certificado durante los 60 días previos a la fecha de caducidad del certificado, siempre y cuando no haya sido previamente revocado.\nPara más información, consulta la sede electrónica de la FNMT:\nPasos a seguir sobre la renovación de tu certificado"}, {"n": 29, "title": "Obtención del Certificado Electrónico de la FNMT", "part": 7, "text": "Dudas frecuentes\n(cómo saber cuándo caduca tu certificado, etc.)\nPreguntas frecuentes sobre mi certificado de ciudadano\nPara más información o dudas, puedes consultar las preguntas frecuentes de la FNMT."}], "outcome": "correct", "correct_votes": [true, false, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p19", "question": "tengo que pedir cita para acreditar mi identidad para el certificado?", "answerable": false, "expected": null, "answer": "Para acreditar tu identidad presencialmente, debes acudir a una oficina con tu documento de identidad y el código de solicitud [27]. Los fragmentos no indican si necesitas cita previa; puedes consultar el mapa de oficinas para localizar dónde hacerlo [27].", "cited": [{"n": 27, "title": "Obtención del Certificado Electrónico de la FNMT", "part": 5, "text": "Una vez cumplimentado el formulario, lee y acepta las condiciones de expedición del certificado y pulsa el botón de “enviar petición”.\nTerminado este proceso, recibirás un código de solicitud en tu correo electrónico, que necesitarás para el siguiente paso.\nSi ya tuvieras un certificado de ciudadano, al solicitar el nuevo, se dejaría sin efecto el que ya tengas.\nPaso 3. Acreditar tu identidad\nPara acreditar tu identidad, debes ir a una oficina presencialmente, llevando\nSi tu nacionalidad es española, tu DNI\nSi tu nacionalidad es extranjera, tu NIE y pasaporte\nEn los 2 casos anteriores, el código de solicitud que recibiste al realizar el paso 2\nPuedes consultar aquí el mapa de oficinas. Debes elegir la opción de certificados de persona física.\nUna vez que hayas acreditado tu identidad en una oficina, podrás descargar tu certificado inmediatamente en tu ordenador; se recomienda descargarlo lo antes posible."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p20", "question": "no me llega el sms de clave pin, que hago", "answerable": true, "expected": "Puedes comunicarlo a través del formulario de soporte para dudas o problemas con Cl@ve.", "answer": "Cl@ve PIN es una contraseña de duración muy limitada que se envía al móvil [20]. Comprueba que el número móvil esté asociado a tu registro de Cl@ve; solo se puede asociar un DNI/NIE a cada número [18]. Si sigue sin llegarte, puedes comunicar el problema mediante el formulario de soporte de Cl@ve [22].", "cited": [{"n": 18, "title": "Registrarte en cl@ve", "part": 1, "text": "¿Qué es Cl@ve?\nCl@ve es un sistema para identificarte electrónicamente ante las Administraciones Públicas con garantías de seguridad, sin tener que recordar claves diferentes para acceder a los distintos servicios.\nTienes más información en la página web de Cl@ve, que también incluye preguntas frecuentes.\n¿Qué necesito para poder utilizar Cl@ve?\nAntes de usar Cl@ve, tienes que registrarte en el sistema, aportando los datos necesarios:\nNúmero de teléfono móvil nacional o extranjero\nCorreo electrónico\nSi eres español,\nDNI\nSi eres extranjero y tienes\nNIE:\nCertificado de registro de ciudadano de la UE, tarjeta de identidad de extranjero o permiso de residencia, y además\nPasaporte (si eres ciudadano de la UE, también puedes identificarte con el documento de identidad del país de origen, en lugar del pasaporte)\n​Para garantizar que sólo la persona registrada tiene acceso a los códigos PIN enviados al teléfono móvil, sólo se puede asociar un DNI/NIE a un mismo número de móvil.\n¿Cómo puedo registrarme en Cl@ve?"}, {"n": 20, "title": "Registrarte en cl@ve", "part": 3, "text": "Puedes encontrar más información en la web de Cl@ve y en las preguntas frecuentes sobre el registro en Cl@ve\nTres usos posibles: Cl@ve Móvil, Cl@ve Permanente y Cl@ve PIN\nUna vez que te hayas registrado en Cl@ve, hay tres posibilidades de uso:\nCl@ve Móvil: sistema de autenticación a través de notificación recibida en el móvil, sin necesidad de recordar ninguna contraseña.\nCl@ve permanente: sistema de contraseña de validez duradera en el tiempo (aunque no ilimitada), orientado a usuarios habituales.\nCl@ve PIN: sistema de contraseña de validez muy limitada en el tiempo, orientado a usuarios que acceden con poca frecuencia a los servicios.\nOficinas de registro en Cl@ve\nPara registrarte en Cl@ve de forma presencial, tienes que acudir a una Oficina de Registro Cl@ve.\nAlgunas requieren cita previa.\nConsulta aquí cómo buscar Oficinas de Registro Cl@ve.\nCl@ve Firma: firma sin certificado electrónico"}, {"n": 22, "title": "Registrarte en cl@ve", "part": 5, "text": "Resolución de 14 de diciembre de 2015, de la Dirección de Tecnologías de la Información y las Comunicaciones, por la que se establecen las prescripciones técnicas necesarias para el desarrollo y aplicación del sistema Cl@ve\nMás información\nEn caso de que quieras conocer más detalles, puedes encontrar más información en los siguientes enlaces:\nVídeos explicativos sobre Cl@ve en la sección de vídeos de la Agencia Tributaria\nEn caso de que tengas algún problema o alguna duda, puedes comunicarlo a través del formulario de soporte para dudas o problemas con Cl@ve"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p21", "question": "que es la dehu", "answerable": true, "expected": "Es la Dirección Electrónica Habilitada única, donde puedes acceder a tus notificaciones electrónicas con certificado digital o Cl@ve.", "answer": "La DEHú es la Dirección Electrónica Habilitada única, donde puedes consultar tus notificaciones electrónicas. Para acceder necesitas un medio de identificación electrónica, como un certificado digital o Cl@ve. [16]", "cited": [{"n": 16, "title": "Notificaciones", "part": 2, "text": "Podrás acceder a tus notificaciones directamente a través de la Dirección Electrónica Habilitada única (DEHú), o bien a través de tu Carpeta Ciudadana. Para poder acceder a la DEHú o a la Carpeta Ciudadana necesitarás un medio de identificación electrónico (certificado digital o Cl@ve).\nAsimismo, en algunos casos también se puede acceder a las notificaciones electrónicas en las sedes electrónicas de los organismos públicos que las emiten. Dicha información la encontrarás a la hora de realizar el trámite vía electrónica.\nObligación de tramitación electrónica\nComo hemos comentado antes, existen casos en los que tienes la obligación de realizar los trámites con la Administración de manera electrónica, así como recibir las notificaciones administrativas de esta manera. Dichos supuestos quedan establecidos en el artículo 14 de la Ley 39/2015\n(por ejemplo, las personas jurídicas)."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p22", "question": "si me notifican en papel y por internet a la vez, cual vale?", "answerable": false, "expected": null, "answer": "En general, si está disponible, la Administración enviará la notificación electrónicamente aunque también hayas elegido recibirla en papel [15]. Los fragmentos no indican cuál prevalece si ambas llegan a la vez.", "cited": [{"n": 15, "title": "Notificaciones", "part": 1, "text": "Tipos de notificaciones\nTal y como explicamos en nuestra página sobre cómo realizar trámites, una vez que has presentado tu solicitud, puedes escoger el modo en que la Administración se comunique contigo, bien para solicitarte más información, bien para notificarte la resolución del procedimiento administrativo que has iniciado.\nExisten 2 formas de recibir notificaciones:\nEn formato papel\nVía electrónica\nEn general, y siempre que no tengas la obligación de relacionarte electrónicamente con la Administración, puedes elegir el medio que prefieras, independientemente de la manera en que hayas iniciado el trámite. Además, puedes decidir cambiar el medio de notificación en cualquier momento, siempre que existan ambas posibilidades.\nEn caso de que tengas la obligación de relacionarte electrónicamente con la Administración, únicamente podrás recibir las notificaciones de esta manera.\nNotificaciones electrónicas\nEn general, y siempre que esté disponible, la Administración te enviará tus notificaciones de manera electrónica, independientemente de que también elijas recibirlas en formato papel."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p23", "question": "que es el registro electronico general", "answerable": false, "expected": null, "answer": "Los fragmentos mencionan que puedes presentar solicitudes mediante el registro electrónico [7] y que los trámites electrónicos se inician en las sedes electrónicas de los organismos [4], pero no explican qué es específicamente el Registro Electrónico General.", "cited": [{"n": 4, "title": "Cómo realizar trámites", "part": 4, "text": "Tramitación electrónica\nEn caso de que elijas realizar la tramitación de manera electrónica, puedes conocer los trámites disponibles e iniciarlos a través de las Sedes Electrónicas de los organismos.\nPuedes obtener más información o consultar tus dudas: en las Oficinas de Información de las Administraciones Públicas llamando al teléfono 060 a través del buzón de atención a través del WebChat 060\nNotificaciones\nConsulta nuestra página sobre las notificaciones.\nEmpresas\nPara obtener información sobre los trámites de empresas, puedes acceder a la sección\nEmpresas del Menú Trámites."}, {"n": 7, "title": "Relacionarte electrónicamente con la Administración", "part": 3, "text": "Por ejemplo, las personas mayores, las que no disponen de los recursos tecnológicos adecuados, o las personas con alguna discapacidad.\nSe te prestará asistencia especialmente en lo referente a la identificación y firma electrónica, la presentación de solicitudes a través del registro electrónico y la obtención de copias auténticas.\nExisten dos tipos de asistencia en el uso de medios electrónicos:\nGeneral.\nConsiste en orientar y ayudar a las personas en el uso de los medios electrónicos. Se realiza a través de los diferentes canales de asistencia, según se establece en el artículo 4 del RD 203/2021.\nTodas las personas tienen derecho a este tipo de asistencia general.\nEspecífica.\nEn este caso, un funcionario realiza la actuación administrativa en tu nombre. Esto es la “asistencia a través de funcionario habilitado”. Solamente tienes derecho si no eres una persona obligada a relacionarte electrónicamente con la Administración.\nRealizar trámites electrónicamente"}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p24", "question": "cual es el horario del telefono 060", "answerable": false, "expected": null, "answer": "No tengo información suficiente para responder.", "cited": [], "outcome": "declined", "correct_votes": [true, true, true], "grounded_votes": null, "reason": null}, {"id": "p25", "question": "puede otra persona hacer un tramite por mi?", "answerable": false, "expected": null, "answer": "Sí, puedes realizar un trámite como representante de otra persona [8]. El fragmento no detalla qué autorización o documentación se necesita. También puede actuar en tu nombre un funcionario habilitado, si no tienes obligación de relacionarte electrónicamente con la Administración [7].", "cited": [{"n": 7, "title": "Relacionarte electrónicamente con la Administración", "part": 3, "text": "Por ejemplo, las personas mayores, las que no disponen de los recursos tecnológicos adecuados, o las personas con alguna discapacidad.\nSe te prestará asistencia especialmente en lo referente a la identificación y firma electrónica, la presentación de solicitudes a través del registro electrónico y la obtención de copias auténticas.\nExisten dos tipos de asistencia en el uso de medios electrónicos:\nGeneral.\nConsiste en orientar y ayudar a las personas en el uso de los medios electrónicos. Se realiza a través de los diferentes canales de asistencia, según se establece en el artículo 4 del RD 203/2021.\nTodas las personas tienen derecho a este tipo de asistencia general.\nEspecífica.\nEn este caso, un funcionario realiza la actuación administrativa en tu nombre. Esto es la “asistencia a través de funcionario habilitado”. Solamente tienes derecho si no eres una persona obligada a relacionarte electrónicamente con la Administración.\nRealizar trámites electrónicamente"}, {"n": 8, "title": "Relacionarte electrónicamente con la Administración", "part": 4, "text": "Si no sabes por dónde empezar para realizar un trámite con la Administración pública, ya sea de forma presencial o vía electrónica, consulta nuestra sección sobre cómo realizar un trámite.\nPara poder iniciar un procedimiento o realizar un trámite electrónicamente, como interesado o representante, tienes que disponer de una identificación electrónica. Consulta nuestra página sobre identificación electrónica para saber más sobre esta cuestión.\nUna vez iniciado un procedimiento, puedes escoger el modo en que la Administración se comunique contigo, para solicitarte más información, o para notificarte la resolución del procedimiento administrativo. Consulta nuestra página sobre notificaciones para conocer más sobre esta cuestión, incluidas las notificaciones electrónicas.\nRegistrarte en cl@ve\nObtención del Certificado Electrónico de la FNMT\nRegulación normativa\nLa actuación y funcionamiento del sector público por medios electrónicos están regulados en el Reglamento de actuación y funcionamiento del sector público por medios electrónicos, en desarrollo de las leyes\n39/2015 y 40/2015."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, false], "reason": "El documento sí permite responder a la pregunta: indica que otra persona puede realizar un trámite como representante. Aunque no especifica qué autorización o documentación se necesita, eso no impide responder a la pregunta general. Por tanto, la afirmación de que no hay información suficiente para responder no está respaldada."}, {"id": "p26", "question": "puedo usar mi certificado de persona fisica para los tramites de mi empresa?", "answerable": true, "expected": "Existen otros certificados, como el de empresa; como persona física, el que corresponde es el certificado de ciudadano.", "answer": "El certificado de ciudadano es para personas físicas; el fragmento también menciona que existen certificados de empresa [23]. No consta si puedes usar tu certificado de persona física para realizar trámites de tu empresa.", "cited": [{"n": 23, "title": "Obtención del Certificado Electrónico de la FNMT", "part": 1, "text": "¿Cómo obtengo un certificado electrónico?\nEl certificado electrónico también puede llamarse certificado digital.\nComo mencionamos en nuestra página sobre la identificación electrónica, el certificado electrónico más utilizado es el de la Fábrica Nacional de Moneda y Timbre (FNMT).\nEn esta sección nos vamos a centrar en este certificado electrónico. En concreto, vamos a ofrecerte una explicación en lenguaje claro y sencillo sobre cómo obtenerlo. Para ello, iremos enlazando con las secciones que tratan cada punto en la sede electrónica de la FNMT.\n¿Qué es el certificado electrónico de ciudadano?\nEl certificado electrónico de ciudadano se llama también de persona física o de usuario.\nHay otros certificados, como el de empresa o el de sector público. Como persona física, el que te interesa solicitar es el certificado de ciudadano.\nEl certificado electrónico de ciudadano es un documento digital que contiene tus datos identificativos."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p27", "question": "como copio el certificado digital a otro ordenador", "answerable": true, "expected": "Hay que exportarlo e instalarlo en cada dispositivo.", "answer": "Para usar el certificado software en otro ordenador, debes exportarlo e instalarlo en ese dispositivo [12]. Los pasos concretos para exportarlo no constan en los fragmentos.", "cited": [{"n": 12, "title": "Identificación Electrónica", "part": 4, "text": "Realizar trámites que requieran firma. Por ejemplo, formular una solicitud.\nAdemás del certificado electrónico, necesitas una aplicación de firma\nPara trámites que requieran firma, necesitarás tener instalada la aplicación de firma AutoFirma. La puedes descargar aquí.\nCl@ve\nCl@ve es un sistema que simplifica el acceso electrónico a los servicios públicos mediante claves concertadas, complementando el DNI electrónico y los certificados digitales.\nPermite identificarse y autenticarse de forma sencilla y segura, así como firmar electrónicamente en determinados trámites mediante certificados personales en la nube\nCl@ve Firma.\nAdemás, facilita la realización de gestiones desde dispositivos móviles.\nCuándo utilizar un certificado software, Cl@ve o DNI electrónico\nCertificado software\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas instalarlo en un dispositivo electrónico (como un PC)\nSi quieres utilizarlo en varios dispositivos, tendrás que exportarlo e instalarlo en cada uno de ellos\nDNI electrónico\nVentajas:"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null}, {"id": "p28", "question": "cuanto tarda la administracion en contestar a una solicitud", "answerable": false, "expected": null, "answer": "No tengo información suficiente para responder.", "cited": [], "outcome": "declined", "correct_votes": [true, true, true], "grounded_votes": null, "reason": null}, {"id": "p29", "question": "como pido el paro", "answerable": false, "expected": null, "answer": "Para solicitar el paro, estos fragmentos no indican los pasos específicos ni dónde presentar la solicitud. En general, los trámites pueden hacerse presencialmente o, si está disponible, en la sede electrónica del organismo correspondiente; si lo haces por vía electrónica, necesitas identificación electrónica [2][4][8].", "cited": [{"n": 2, "title": "Cómo realizar trámites", "part": 2, "text": "En el caso de los ciudadanos, siempre que no estén obligados a relacionarse electrónicamente con la Administración, toda tramitación con la Administración pública se puede llevar a cabo de forma presencial y, en la mayoría de casos, también de forma electrónica. También puedes elegir recibir las notificaciones de la Administración pública tanto en formato papel como de forma electrónica.\nEn el caso de que, debido al trámite particular que estés realizando, estés obligado a relacionarte por medios electrónicos con la Administración, únicamente podrás comunicarte mediante este medio, sin posibilidad de hacerlo presencialmente en formato papel. Consulta más información al respecto en los apartados siguientes de esta página.\nPara obtener más información sobre los trámites existentes, puedes acceder a las distintas seccion
