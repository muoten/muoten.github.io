la web de Cl@ve.\nPincha aquí para acceder a la web de Cl@ve .\nTambién puedes consultar las preguntas frecuentes sobre el registro en Cl@ve.\nPincha aquí para acceder a las preguntas frecuentes ."}, {"n": 4, "title": "Registrarte en cl@ve", "text": "Registrarte en cl@ve\nCon vídeoidentificación automática con la App Cl@ve. Siguiendo las instrucciones de la aplicación, obtendrás en pocos minutos el nivel de registro básico en Cl@ve. En un proceso posterior, una vez completada satisfactoriamente la revisión de evidencias electrónicas (vídeo, documento de identidad y biometría facial) por parte de un empleado público autorizado, puedes obtener directamente el nivel de registro avanzado . Temporalmente sólo se ofrece este servicio a personas españolas con DNI en vigor.\nA través de internet, sin certificado electrónico . Este tipo de registro es de nivel básico y no permite acceder a todos los servicios. Puede ser mediante carta de invitación o por videollamada\nA través de internet, con certificado electrónico o DNIe (DNI electrónico). El registro en Cl@ve a través de internet se realiza en la sede electrónica de la Agencia Tributaria (AEAT)\nDe forma presencial . El registro de forma presencial se realiza acudiendo a una oficina de registro Cl@ve\nPuedes encontrar más información en la web de Cl@ve y en las preguntas frecuentes sobre el registro en Cl@ve\nUna vez que te hayas registrado en Cl@ve, hay tres posibilidades de uso:"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p06", "question": "se puede firmar con cl@ve?", "answerable": true, "expected": "Sí, con Cl@ve Firma, en determinados trámites; requiere registro de nivel avanzado, Cl@ve Permanente activada y generar el certificado de firma. Una de las guías dice lo contrario, así que una respuesta que señale la contradicción también es correcta.", "answer": "Sí, con Cl@ve Firma se puede firmar electrónicamente en determinados trámites. Para utilizarla, necesitas registrarte en el nivel avanzado de Cl@ve, activar Cl@ve Permanente y crear el certificado de firma. [2][4]", "cited": [{"n": 2, "title": "Registrarte en Cl@ve", "text": "Registrarte en Cl@ve\nCl@ve Firma\nPara utilizar la firma centralizada tienes que realizar los siguientes pasos:\nRegistrarte en el Nivel avanzado del sistema Cl@ve,\nactivar la Cl@ve Permanente\ny crear el certificado de firma.\nPuedes encontrar más información en el apartado Cl@ve Firma de la web de Cl@ve.\nPincha aquí para acceder .\nNormas y leyes\nOrden PRE/1838/2014, de 8 de octubre , por la que se publica el Acuerdo de Consejo de Ministros, de 19 de septiembre de 2014, por el que se aprueba Cl@ve, la plataforma común del Sector Público Administrativo Estatal para la identificación, autenticación y firma electrónica mediante el uso de claves concertadas."}, {"n": 4, "title": "Identificación Electrónica > Identificación y firma electrónica", "text": "Identificación Electrónica > Identificación y firma electrónica\nCertificado electrónico\nCon el certificado electrónico puedes tanto identificarte como firmar electrónicamente.\nLa firma electrónica basada en certificados tiene la misma validez que la firma manuscrita.\nPuedes utilizar la firma electrónica en los siguientes casos, entre otros:\nFirmar documentos. Por ejemplo, un PDF.\nRealizar trámites que requieran firma. Por ejemplo, formular una solicitud.\nAdemás del certificado electrónico, necesitas una aplicación de firma\nPara trámites que requieran firma, necesitarás tener instalada la aplicación de firma AutoFirma. La puedes descargar aquí.\nCl@ve\nCl@ve es un sistema que simplifica el acceso electrónico a los servicios públicos mediante claves concertadas, complementando el DNI electrónico y los certificados digitales. Permite identificarse y autenticarse de forma sencilla y segura, así como firmar electrónicamente en determinados trámites mediante certificados personales en la nube Cl@ve Firma . Además, facilita la realización de gestiones desde dispositivos móviles."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p07", "question": "he perdido el dni, puedo registrarme en clave igualmente?", "answerable": true, "expected": "Sí: además del DNI, la identidad se puede acreditar con el NIE, un certificado electrónico u otro documento que la acredite, y con certificado electrónico el registro se hace por internet en la sede electrónica de la Agencia Tributaria.", "answer": "Para usar Cl@ve se pide un documento que acredite tu identidad, como DNI, NIE o certificado electrónico [1]. Si eres español, la información también menciona el DNI entre los datos necesarios [3]. La videoidentificación automática está disponible temporalmente solo para personas españolas con el DNI en vigor [4].\n\nLos fragmentos no indican si puedes registrarte tras perder el DNI ni qué documento alternativo admitirían en ese caso.", "cited": [{"n": 1, "title": "Registrarte en Cl@ve > ¿Qué necesitas para utilizar Cl@ve?", "text": "Registrarte en Cl@ve > ¿Qué necesitas para utilizar Cl@ve?\nDNI, NIE , certificado electrónico u otro documento que acredite tu identidad .\nNúmero de teléfono móvil.\nSolo se puede asociar un DNI o un NIE a un número de teléfono móvil.\nAsí garantizamos que solo la persona registrada puede acceder a los códigos que se envían a ese teléfono.\nAviso > Ahora hay una nueva forma de registrarse en Cl@ve.\nEs con videoidentificación. Por eso, hemos actualizado la sección \"Cómo registrarte en Cl@ve\". Falta que la revise una persona con dificultades de comprensión. Cuando la revise, sabremos si se entiende bien."}, {"n": 3, "title": "Registrarte en cl@ve", "text": "Registrarte en cl@ve\nCl@ve es un sistema para identificarte electrónicamente ante las Administraciones Públicas con garantías de seguridad, sin tener que recordar claves diferentes para acceder a los distintos servicios.\nTienes más información en la página web de Cl@ve , que también incluye preguntas frecuentes.\nAntes de usar Cl@ve, tienes que registrarte en el sistema, aportando los datos necesarios:\nNúmero de teléfono móvil nacional o extranjero\nCorreo electrónico\nSi eres español, DNI\nSi eres extranjero y tienes NIE : Certificado de registro de ciudadano de la UE, tarjeta de identidad de extranjero o permiso de residencia, y además Pasaporte (si eres ciudadano de la UE, también puedes identificarte con el documento de identidad del país de origen, en lugar del pasaporte)\n​Para garantizar que sólo la persona registrada tiene acceso a los códigos PIN enviados al teléfono móvil, sólo se puede asociar un DNI/NIE a un mismo número de móvil.\nHay 4 formas:"}, {"n": 4, "title": "Registrarte en cl@ve", "text": "Registrarte en cl@ve\nCon vídeoidentificación automática con la App Cl@ve. Siguiendo las instrucciones de la aplicación, obtendrás en pocos minutos el nivel de registro básico en Cl@ve. En un proceso posterior, una vez completada satisfactoriamente la revisión de evidencias electrónicas (vídeo, documento de identidad y biometría facial) por parte de un empleado público autorizado, puedes obtener directamente el nivel de registro avanzado . Temporalmente sólo se ofrece este servicio a personas españolas con DNI en vigor.\nA través de internet, sin certificado electrónico . Este tipo de registro es de nivel básico y no permite acceder a todos los servicios. Puede ser mediante carta de invitación o por videollamada\nA través de internet, con certificado electrónico o DNIe (DNI electrónico). El registro en Cl@ve a través de internet se realiza en la sede electrónica de la Agencia Tributaria (AEAT)\nDe forma presencial . El registro de forma presencial se realiza acudiendo a una oficina de registro Cl@ve\nPuedes encontrar más información en la web de Cl@ve y en las preguntas frecuentes sobre el registro en Cl@ve\nUna vez que te hayas registrado en Cl@ve, hay tres posibilidades de uso:"}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "The document mentions DNI, NIE, or an electronic certificate as identity documents, but says it does not establish whether someone can register after losing their DNI or which alternative document would be accepted in that situation. It also does not state that registration with an electronic certificate can be completed online through the Tax Agency’s electronic office. The response is not correct."}, "citation_notes": []}, {"id": "p08", "question": "me ha llegado un aviso de notificacion electronica, donde la veo?", "answerable": true, "expected": "En la Dirección Electrónica Habilitada única (DEHú) o en la Carpeta Ciudadana, con certificado digital o Cl@ve; a veces también en la sede electrónica del organismo que la emite.", "answer": "Puedes consultar la notificación en la Dirección Electrónica Habilitada única (DEHú) o en la Carpeta Ciudadana. Para acceder necesitas un certificado digital o estar registrado en Cl@ve. [2][4] Algunas notificaciones también pueden consultarse en la sede electrónica del organismo que la envía; la información aparece al iniciar el trámite electrónico. [4]", "cited": [{"n": 2, "title": "Notificaciones > Notificaciones electrónicas", "text": "Notificaciones > Notificaciones electrónicas\nEn general, y siempre que esté disponible, la Administración te enviará tus notificaciones de manera electrónica, independientemente de que también elijas recibirlas en formato papel.\nPodrás acceder a tus notificaciones directamente a través de la Dirección Electrónica Habilitada única (DEHú) , o bien a través de tu Carpeta Ciudadana . Para poder acceder a la DEHú o a la Carpeta Ciudadana necesitarás un medio de identificación electrónico (certificado digital o Cl@ve).\nAsimismo, en algunos casos también se puede acceder a las notificaciones electrónicas en las sedes electrónicas de los organismos públicos que las emiten. Dicha información la encontrarás a la hora de realizar el trámite vía electrónica."}, {"n": 4, "title": "Notificaciones > Notificaciones electrónicas", "text": "Notificaciones > Notificaciones electrónicas\nAunque elijas recibir las notificaciones en papel, la Administración suele enviarlas de forma electrónica también, siempre que esta opción esté disponible.\nPuedes acceder a tus notificaciones electrónicas en:\nla Dirección Electrónica Habilitada Única Pincha aquí para acceder a la Dirección Electrónica Habilitada Única\nla Carpeta Ciudadana Pincha aquí para acceder a la Carpeta Ciudadana\nalgunas sedes electrónicas de los organismos que envían las notificaciones. Cuando inicies un trámite de forma electrónica, encontrarás información sobre esto.\nPara acceder a la Carpeta Ciudadana y a la Dirección Electrónica Habilitada Única necesitas un certificado digital o estar registrado en Cl@ve.\nUna persona jurídica es una empresa, entidad o grupos de personas que comparten una responsabilidad.\nUna persona física es una persona real.\nOpositar es participar en un proceso selectivo para conseguir un puesto de trabajo en la Administración Pública."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p09", "question": "cuantos dias tengo para abrir una notificacion electronica antes de que cuente como rechazada", "answerable": false, "expected": null, "answer": "No tengo información suficiente para responder.", "cited": [], "outcome": "declined", "correct_votes": [true, true, true], "grounded_votes": null, "reason": null, "citation_notes": []}, {"id": "p10", "question": "soy autonomo, estoy obligado a hacer los tramites por internet?", "answerable": false, "expected": null, "answer": "Sí, para relacionarte con la Seguridad Social española como persona autónoma tienes que hacer los trámites por medios electrónicos. Puedes usar los servicios electrónicos de la SEDESS o hacerlos mediante una persona autorizada RED [10]. Los fragmentos no indican si esa obligación se aplica a tus trámites con otras administraciones.", "cited": [{"n": 10, "title": "Alta de empleados > Quiero darme de alta como trabajador por cuenta propia, ¿Qué tengo que hacer?", "text": "Alta de empleados > Quiero darme de alta como trabajador por cuenta propia, ¿Qué tengo que hacer?\nSi no dispones de él debes solicitarlo con tu identificación electrónica a través del a través del Portal de la Tesorería General de la Seguridad Social o de la App IMPORTASS Seguridad Social , en el servicio Solicitar el Número de la Seguridad Social . Si careces de identificación electrónica también puedes pedir tu NUSS presentando una solicitud de atención personalizada. Necesitarás un documento de identidad, un correo electrónico y un dispositivo electrónico con cámara. A continuación debes tramitar tu alta como trabajador por cuenta propia en el Régimen Especial de Trabajadores Autónomos o en el Régimen Especial de Trabajadores del Mar. Debes tener en cuenta que los trabajadores autónomos están obligados a relacionarse electrónicamente con la Seguridad Social española. Para ello dispones de dos vías, utilizar los servicios electrónicos de la SEDESS o realizar tus trámites a través de un autorizado RED. Por tanto, una vez que tengas asignado un número de Seguridad Social, puedes tramitar tu alta como trabajador por cuenta propia a través del Portal de la Tesorería General de la Seguridad Social o de la App IMPORTASS Seguridad Social en el servicio Alta en trabajo autónomo o utilizando los servicios de un autorizado RED."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento sí aporta información para responder que, en los trámites con la Seguridad Social española como autónomo, se deben usar medios electrónicos. Aunque no aclara si esto se aplica a trámites con otras administraciones, la afirmación de que no hay información suficiente para responder en absoluto no está respaldada."}, "citation_notes": []}, {"id": "p11", "question": "puedo entregar un papel en cualquier oficina de registro aunque sea para otro ministerio?", "answerable": false, "expected": null, "answer": "Puedes presentar una solicitud en una oficina de asistencia en materia de registros; los fragmentos no precisan expresamente si tiene que ser una oficina concreta o si vale cualquiera [1][10]. Si el escrito tiene un formulario específico, se indica que se presenta en la sede electrónica del ministerio correspondiente [3].", "cited": [{"n": 1, "title": "Dónde, cómo presentar un escrito > Información sobre la presentación", "text": "Dónde, cómo presentar un escrito > Información sobre la presentación\nPara la mayoría de procedimientos, las Administraciones disponen de un modelo normalizado para realizar las solicitudes. De ello te informarán en las Oficinas de Información o de Asistencia en Materia de Registros y también en las Sedes Electrónicas y Portales públicos de internet de los organismos.\nPuedes presentar tu solicitud:\nEn los registros electrónicos de las Administraciones Públicas.\nEn las oficinas de asistencia en materia de registros (OAMR).\nEn las oficinas de correos. En este caso tienes que entregar el sobre abierto para que sellen tu escrito con la fecha de entrega, y te faciliten copia del mismo.\nSi te encuentras en el extranjero, en las representaciones diplomáticas y oficinas consulares de España. Accede a las Embajadas y Consulados de España en el Extranjero.\nEn cualquier otro que establezcan las disposiciones vigentes.\nAccede al Buscador de oficinas del Punto de Acceso General.\nPuedes presentar tu solicitud en soporte papel o por medios informáticos, electrónicos o telemáticos en los registros electrónicos. Las oficinas de asistencia en materia de registros tienen un horario concreto para que puedas presentar tu solicitud, mientras que los registros electrónicos están abiertos las 24 horas al día los 365 días del año."}, {"n": 3, "title": "Presentar un escrito > Cómo presentar", "text": "Presentar un escrito > Cómo presentar\nPuedes presentar tu solicitud de forma presencial o por vía electrónica.\nPara hacerlo de forma electrónica, puedes utilizar a los registros electrónicos, donde puedes presentar tu solicitud a cualquier hora en cualquier día del año.\nPara hacerlo de forma presencial, puedes ir a las Oficinas de asistencia en materia de registros.\nEstas oficinas tienen un horario.\nLas solicitudes y escritos que tienen un formulario concreto se presentan en la sede electrónica del ministerio que corresponda.\nAccede a las Sedes Electrónicas de la Administración General del Estado y los Departamentos Ministeriales\nHay solicitudes y escritos que no tienen un formulario concreto.\nEstas solicitudes se pueden presentar en el Registro Electrónico de la Administración General del Estado.\nAccede al Registro Electrónico de la Administración General del Estado\nTambién puedes acudir a las Oficinas de asistencia en materia de registro y te ayudarán a presentar tu solicitud en el Registro Electrónico de la Administración General del Estado o en las sedes electrónicas de los Ministerios.\nEn vigor significa que está activo y no ha caducado."}, {"n": 10, "title": "Presentar un escrito > Dónde presentar", "text": "Presentar un escrito > Dónde presentar\nPuedes presentar tu solicitud en:\nLos registros electrónicos de las Administraciones Públicas.\nLas Oficinas de asistencia en materia de registros. También se llaman OAMR.\nBusca la oficina que necesitas .\nLas Oficinas de correos. Debes llevar el sobre abierto para que sellen tu escrito, pongan la fecha y te den una copia\nLas Representaciones diplomáticas y oficinas consulares de España en el extranjero.\nOtro lugar que indique la Administración\nAccede al buscador de oficinas del Punto de Acceso General"}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p12", "question": "que es la sede electronica", "answerable": true, "expected": "Es la dirección de internet a través de la cual se realizan los trámites de una administración u organismo público; equivale a la sede física.", "answer": "Una sede electrónica es el sitio web de una Administración donde puedes realizar trámites y gestiones por Internet. [6]", "cited": [{"n": 6, "title": "Relacionarte con la Administración de forma electrónica > Portales de internet y sedes electrónicas", "text": "Relacionarte con la Administración de forma electrónica > Portales de internet y sedes electrónicas\nPortal de Internet\nEs el sitio web de una Administración. Tiene información sobre esa Administración Pública.\nEs el lugar al que puedes entrar sin clave ni contraseña para consultar información de interés.\nSede electrónica\nEs el sitio web en el que puedes hacer trámites y gestiones a través de Internet.\nPor ejemplo, presentar una solicitud para pedir una subvención.\nLa mayoría de las veces, puedes acceder a la sede electrónica de una Administración Pública a través de su portal de internet.\nUna persona jurídica es una empresa, entidad o un grupo de personas que comparten responsabilidad.\nUn proceso selectivo es un conjunto de pruebas que se deben pasar para conseguir una plaza de empleo público."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p13", "question": "que diferencia hay entre el portal y la sede electronica", "answerable": true, "expected": "El portal da acceso a la información que publica la Administración; la sede electrónica es donde se realizan los trámites.", "answer": "El **portal de internet** ofrece información de una Administración y permite acceder a su sede electrónica [1][2]. La **sede electrónica** es el sitio donde puedes realizar trámites y gestiones por internet [1][2].", "cited": [{"n": 1, "title": "Relacionarte electrónicamente con la Administración > Portales de Internet y Sedes Electrónicas", "text": "Relacionarte electrónicamente con la Administración > Portales de Internet y Sedes Electrónicas\nPor lo general, podemos distinguir entre dos tipos de sitios web a través de los cuáles te puedes relacionar electrónicamente con la Administraciones Públicas. ¿Cuáles son las diferencias?:\nPortal de internet. Es el punto de acceso electrónico a través del cual puedes acceder, a través de internet, a la información que publica una Administración Pública u organismo público. También te permite el acceso a la sede electrónica correspondiente.\nSede electrónica. Es la dirección de internet a través de la cual puedes realizar los trámites correspondientes a una administración u organismo público. Las sedes electrónicas son el equivalente a las sedes físicas donde la ciudadanía se dirige para hacer un trámite."}, {"n": 2, "title": "Relacionarte con la Administración de forma electrónica > Portales de internet y sedes electrónicas", "text": "Relacionarte con la Administración de forma electrónica > Portales de internet y sedes electrónicas\nPortal de Internet\nEs el sitio web de una Administración. Tiene información sobre esa Administración Pública.\nEs el lugar al que puedes entrar sin clave ni contraseña para consultar información de interés.\nSede electrónica\nEs el sitio web en el que puedes hacer trámites y gestiones a través de Internet.\nPor ejemplo, presentar una solicitud para pedir una subvención.\nLa mayoría de las veces, puedes acceder a la sede electrónica de una Administración Pública a través de su portal de internet.\nUna persona jurídica es una empresa, entidad o un grupo de personas que comparten responsabilidad.\nUn proceso selectivo es un conjunto de pruebas que se deben pasar para conseguir una plaza de empleo público."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p14", "question": "no tengo certificado ni clave, como presento una solicitud?", "answerable": true, "expected": "Si no tienes obligación de relacionarte electrónicamente, puedes presentarla de forma presencial en una oficina de registro; también tienes derecho a asistencia, incluida la de un funcionario habilitado que actúa en tu nombre.", "answer": "Puedes presentarla en persona en una Oficina de asistencia en materia de registros; estas oficinas tienen horario y pueden ayudarte a presentar la solicitud en el registro electrónico o en la sede electrónica que corresponda. [2]", "cited": [{"n": 2, "title": "Presentar un escrito > Cómo presentar", "text": "Presentar un escrito > Cómo presentar\nPuedes presentar tu solicitud de forma presencial o por vía electrónica.\nPara hacerlo de forma electrónica, puedes utilizar a los registros electrónicos, donde puedes presentar tu solicitud a cualquier hora en cualquier día del año.\nPara hacerlo de forma presencial, puedes ir a las Oficinas de asistencia en materia de registros.\nEstas oficinas tienen un horario.\nLas solicitudes y escritos que tienen un formulario concreto se presentan en la sede electrónica del ministerio que corresponda.\nAccede a las Sedes Electrónicas de la Administración General del Estado y los Departamentos Ministeriales\nHay solicitudes y escritos que no tienen un formulario concreto.\nEstas solicitudes se pueden presentar en el Registro Electrónico de la Administración General del Estado.\nAccede al Registro Electrónico de la Administración General del Estado\nTambién puedes acudir a las Oficinas de asistencia en materia de registro y te ayudarán a presentar tu solicitud en el Registro Electrónico de la Administración General del Estado o en las sedes electrónicas de los Ministerios.\nEn vigor significa que está activo y no ha caducado."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "The document supports that the application can be presented in person at an Office of assistance in matters of registration. However, it does not state the condition that this option applies only if the person is not required to use the electronic route. The response is not correct."}, "citation_notes": []}, {"id": "p15", "question": "el dni electronico sirve para firmar?", "answerable": true, "expected": "Sí, el DNI electrónico permite firmar electrónicamente.", "answer": "Sí, el DNI electrónico permite firmar electrónicamente [2].", "cited": [{"n": 2, "title": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico", "text": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico\nCertificado software\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas instalarlo en un dispositivo electrónico (como un PC)\nSi quieres utilizarlo en varios dispositivos, tendrás que exportarlo e instalarlo en cada uno de ellos\nDNI electrónico\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nNo necesitas instalarlo en un dispositivo electrónico\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas un lector de tarjetas. A partir de la versión 3.0 del DNIe puedes utilizar el móvil como lector de tarjetas\nPuedes necesitar instalar algún programa informático adicional\nCl@ve\nVentajas:\nNo necesitas instalarlo en un dispositivo electrónico\nPuedes utilizarlo desde cualquier dispositivo (PC o móvil)\nInconvenientes:\nNo puedes utilizarlo en todos los procedimientos y trámites\nNo puedes utilizarlo en todas las Administraciones públicas\nNo te permite firmar electrónicamente"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p16", "question": "que necesito para usar el dnie en el ordenador", "answerable": true, "expected": "Un lector de tarjetas (desde la versión 3.0 del DNIe sirve el móvil) y puede que algún programa adicional.", "answer": "Necesitas un lector de tarjetas para que el ordenador pueda leer el DNIe y puede que tengas que instalar algún programa. Si tienes un DNIe versión 3.0 o superior, puedes usar el móvil como lector. [3]", "cited": [{"n": 3, "title": "Identificación electrónica > Características de los sistemas de identificación", "text": "Identificación electrónica > Características de los sistemas de identificación\nCertificado software\nVentajas\nTe puedes identificar con él para hacer cualquier trámite de la Administración.\nPuedes firmar documentos.\nDesventajas\nTienes que instalarlo en un dispositivo, como un ordenador, una tablet o un móvil.\nSi lo quieres utilizar en varios dispositivos tienes que instalarlo en cada uno de ellos.\nDNI electrónico\nVentajas\nTe puedes identificar con él para hacer cualquier trámite de la Administración.\nNo tienes que instalarlo en ningún dispositivo.\nPuedes firmar documentos.\nDesventajas\nNecesitas un lector de tarjetas. Es un aparato que permite al dispositivo que usas leer el DNI electrónico. Si tienes la versión 3.0 o una superior del DNI electrónico puedes usar tu móvil como lector de tarjetas. Pincha aquí para más información .\nEs posible que tengas que instalar algún programa para usarlo.\nCl@ve\nVentajas\nNo necesitas instalarla en tu dispositivo.\nPuedes usarla desde cualquier dispositivo, ordenador, móvil o tablet.\nDesventajas\nSolo puedes hacer algunos trámites, no sirve para todos.\nRegular es definir cómo debe hacerse una tarea o función y con qué normas."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p17", "question": "cuanto cuesta el certificado digital de la fnmt", "answerable": true, "expected": "Es gratuito; solo la obtención con vídeo identificación cuesta 2,99 € más impuestos.", "answer": "El certificado de ciudadano de la FNMT es gratuito. Si lo obtienes mediante vídeo identificación, el servicio cuesta 2,99 € más impuestos. [1]", "cited": [{"n": 1, "title": "Obtención del Certificado Electrónico de la FNMT", "text": "Obtención del Certificado Electrónico de la FNMT\n¿Tiene coste la obtención de un certificado de ciudadano?\nNo. El certificado de ciudadano de la FNMT es gratuito .\nÚnicamente, en el caso de que obtengas el certificado con vídeo identificación, tendrás que abonar un coste de 2,99€ más impuestos por este servicio.\n¿Qué pasos debo seguir para obtener el certificado de ciudadano?\nA lo largo del proceso de obtención del certificado, será necesario que acredites tu identidad. Hay 3 formas de acreditar tu identidad:"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p18", "question": "se me ha caducado el certificado digital, como lo renuevo?", "answerable": true, "expected": "La renovación se puede hacer durante los 60 días previos a la caducidad, si no ha sido revocado.", "answer": "La renovación se puede hacer durante los 60 días anteriores a la fecha de caducidad, siempre que el certificado no haya sido revocado [1]. Los fragmentos no indican cómo renovarlo una vez caducado.", "cited": [{"n": 1, "title": "Obtención del Certificado Electrónico de la FNMT > ¿Cómo renovar mi certificado de ciudadano?", "text": "Obtención del Certificado Electrónico de la FNMT > ¿Cómo renovar mi certificado de ciudadano?\nPuedes llevar a cabo la renovación de tu certificado durante los 60 días previos a la fecha de caducidad del certificado, siempre y cuando no haya sido previamente revocado.\nPara más información, consulta la sede electrónica de la FNMT:\nPasos a seguir sobre la renovación de tu certificado\nDudas frecuentes (cómo saber cuándo caduca tu certificado, etc.)"}], "outcome": "correct", "correct_votes": [false, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p19", "question": "tengo que pedir cita para acreditar mi identidad para el certificado?", "answerable": false, "expected": null, "answer": "Para la acreditación presencial, debes acudir a una oficina [1]. Los fragmentos no indican si necesitas pedir cita.", "cited": [{"n": 1, "title": "Obtención del Certificado Electrónico de la FNMT > ¿Qué pasos debo seguir para obtener el certificado de ciudadano? > Antes de solicitar el certificado", "text": "Obtención del Certificado Electrónico de la FNMT > ¿Qué pasos debo seguir para obtener el certificado de ciudadano? > Antes de solicitar el certificado\nAccede a esta página de la sede electrónica de la FNMT y rellena el formulario, siguiendo las instrucciones que se indican.\nUna vez cumplimentado el formulario, lee y acepta las condiciones de expedición del certificado y pulsa el botón de “enviar petición”.\nTerminado este proceso, recibirás un código de solicitud en tu correo electrónico, que necesitarás para el siguiente paso.\nSi ya tuvieras un certificado de ciudadano, al solicitar el nuevo, se dejaría sin efecto el que ya tengas.\nPaso 3. Acreditar tu identidad\nPara acreditar tu identidad, debes ir a una oficina presencialmente, llevando\nSi tu nacionalidad es española, tu DNI\nSi tu nacionalidad es extranjera, tu NIE y pasaporte\nEn los 2 casos anteriores, el código de solicitud que recibiste al realizar el paso 2\nPuedes consultar aquí el mapa de oficinas . Debes elegir la opción de certificados de persona física.\nUna vez que hayas acreditado tu identidad en una oficina, podrás descargar tu certificado inmediatamente en tu ordenador; se recomienda descargarlo lo antes posible.\nConsulta la sede electrónica de la FNMT para más información sobre cómo acreditar tu identidad ."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p20", "question": "no me llega el sms de clave pin, que hago", "answerable": true, "expected": "Puedes comunicarlo a través del formulario de soporte para dudas o problemas con Cl@ve.", "answer": "Si no te llega el SMS de Cl@ve PIN, puedes comunicar el problema mediante el formulario para dudas o problemas con Cl@ve [5]. Los fragmentos no indican cómo resolver específicamente los retrasos o la falta de recepción del SMS.", "cited": [{"n": 5, "title": "Registrarte en Cl@ve", "text": "Registrarte en Cl@ve\nNormas y leyes\nResolución de 14 de diciembre de 2015 , de la Dirección de Tecnologías de la Información y las Comunicaciones, por la que se establecen las prescripciones técnicas necesarias para el desarrollo y aplicación del sistema Cl@ve.\nMás información\nPuedes ver los vídeos sobre Cl@ve PIN en la sección de vídeos de la Agencia Tributaria\nSi tienes algún problema o duda, puedes comunicarlo a través del formulario para dudas o problemas con Cl@ve."}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p21", "question": "que es la dehu", "answerable": true, "expected": "Es la Dirección Electrónica Habilitada única, donde puedes acceder a tus notificaciones electrónicas con certificado digital o Cl@ve.", "answer": "La DEHú (Dirección Electrónica Habilitada única) facilita el acceso y la comparecencia a notificaciones y comunicaciones de Administraciones Públicas adheridas. Permite leer comunicaciones y comparecer notificaciones propias o de personas representadas usando cualquiera de los sistemas de autenticación admitidos por Cl@ve. [1]", "cited": [{"n": 1, "title": "Aplicaciones móviles para la ciudadanía > Aplicaciones móviles del Punto de Acceso General", "text": "Aplicaciones móviles para la ciudadanía > Aplicaciones móviles del Punto de Acceso General\nEnlaces para su descarga:\nLíneas de ayuda en Play Store (para Android)\nLíneas de ayuda en App Store (para iOs)\nDeclaración de Accesibilidad de la App Líneas de Ayuda\nLa App Mi carpeta Ciudadana facilita a la ciudadanía su relación con las Administraciones Públicas de forma sencilla y ágil desde un único lugar.\nCon Mi carpeta Ciudadana dispondrás, de forma agregada, de tu información personal y de tus gestiones realizadas con diferentes Administraciones Públicas.\nEnlaces para su descarga:\nMi carpeta ciudadana en Play Store (para Android)\nMi carpeta ciudadana en App Store (para iOs)\nMás información y declaración de accesibilidad de la App Mi carpeta ciudadana\nNotifica App (Dirección Electrónica Habilitada única) facilita a la ciudadanía el acceso y comparecencia a las notificaciones y comunicaciones emitidas por las Administraciones Públicas adheridas.\nCon DEHú podrás leer tus comunicaciones y comparecer tus notificaciones o las de tus representados. Para ello, sólo es necesario que dispongas de cualquiera de los sistemas de autenticación admitidos por la plataforma Cl@ve.\nEnlaces para su descarga:\nNotifica App en Play Store (para Android)\nNotifica App en App Store (para iOs)\nDeclaración de accesibilidad de la App móvil DEHú"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p22", "question": "si me notifican en papel y por internet a la vez, cual vale?", "answerable": false, "expected": null, "answer": "Los fragmentos indican que, si está disponible, la Administración puede enviarte también las notificaciones por vía electrónica aunque hayas elegido recibirlas en papel [1][3]. No indican cuál de las dos notificaciones prevalece.", "cited": [{"n": 1, "title": "Notificaciones > Notificaciones electrónicas", "text": "Notificaciones > Notificaciones electrónicas\nAunque elijas recibir las notificaciones en papel, la Administración suele enviarlas de forma electrónica también, siempre que esta opción esté disponible.\nPuedes acceder a tus notificaciones electrónicas en:\nla Dirección Electrónica Habilitada Única Pincha aquí para acceder a la Dirección Electrónica Habilitada Única\nla Carpeta Ciudadana Pincha aquí para acceder a la Carpeta Ciudadana\nalgunas sedes electrónicas de los organismos que envían las notificaciones. Cuando inicies un trámite de forma electrónica, encontrarás información sobre esto.\nPara acceder a la Carpeta Ciudadana y a la Dirección Electrónica Habilitada Única necesitas un certificado digital o estar registrado en Cl@ve.\nUna persona jurídica es una empresa, entidad o grupos de personas que comparten una responsabilidad.\nUna persona física es una persona real.\nOpositar es participar en un proceso selectivo para conseguir un puesto de trabajo en la Administración Pública."}, {"n": 3, "title": "Notificaciones > Notificaciones electrónicas", "text": "Notificaciones > Notificaciones electrónicas\nEn general, y siempre que esté disponible, la Administración te enviará tus notificaciones de manera electrónica, independientemente de que también elijas recibirlas en formato papel.\nPodrás acceder a tus notificaciones directamente a través de la Dirección Electrónica Habilitada única (DEHú) , o bien a través de tu Carpeta Ciudadana . Para poder acceder a la DEHú o a la Carpeta Ciudadana necesitarás un medio de identificación electrónico (certificado digital o Cl@ve).\nAsimismo, en algunos casos también se puede acceder a las notificaciones electrónicas en las sedes electrónicas de los organismos públicos que las emiten. Dicha información la encontrarás a la hora de realizar el trámite vía electrónica."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p23", "question": "que es el registro electronico general", "answerable": true, "expected": "El Registro Electrónico General de la AGE (REG-AGE) sirve para enviar documentos, como solicitudes, comunicaciones o escritos, a los servicios públicos por medios electrónicos; también acepta documentos para otras Administraciones Públicas.", "answer": "El Registro Electrónico General de la AGE (REG-AGE) permite enviar electrónicamente documentos, como solicitudes, comunicaciones y escritos, a la Administración General del Estado y también a otras administraciones públicas. Si una administración establece una forma concreta de hacer un trámite, debes usar esa forma. [1]", "cited": [{"n": 1, "title": "Registro Electrónico General de la AGE > ¿Qué es el Registro Electrónico General?", "text": "Registro Electrónico General de la AGE > ¿Qué es el Registro Electrónico General?\nSirve para que la ciudadanía envíe documentos a los servicios públicos por medios electrónicos de forma rápida y eficaz. Por ejemplo, comunicaciones, solicitudes o escritos.\nEn el REG-AGE puedes presentar solicitudes, comunicaciones y hacer trámites en la Administración General del Estado. Excepto si las Administraciones indican una manera concreta de hacer un trámite.\nTambién acepta documentos para otras Administraciones Públicas. Como Comunidades Autónomas o entidades locales.\nTodas las acciones y documentos que se registren en el REG-AGE se anotarán en el libro de registro del REG-AGE."}], "outcome": "correct", "correct_votes": [true, true, false], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p24", "question": "cual es el horario del telefono 060", "answerable": false, "expected": null, "answer": "La atención automática está disponible las 24 horas, todos los días del año. La atención por agentes generalistas es de lunes a viernes, de 9:00 a 19:00; en agosto, de 9:00 a 15:00; y los sábados, de 9:00 a 14:00, excepto festivos nacionales. Los días 24 y 31 de diciembre, el horario es de 9:00 a 14:00. El horario de agentes especializados depende de cada servicio. [3]", "cited": [{"n": 3, "title": "Teléfono 060 > Información sobre el teléfono 060", "text": "Teléfono 060 > Información sobre el teléfono 060\nEl teléfono 060 es un servicio de información que la Administración General del Estado pone a tu disposición. Te ofrece información administrativa general sobre los servicios públicos y trámites de la Administración General del Estado.\nLlamando al 060 puedes informarte sobre empleo público, ayudas, subvenciones y becas, localización de órganos de las Administraciones públicas, asistencia técnica sobre servicios electrónicos de la Administración General del Estado e información de Ministerios y organismos integrados (extranjería, Dirección General de Tráfico, Servicio Público de Empleo Estatal, etc.).\nEl teléfono 060 informa a través de locuciones automatizadas y, en función de la temática y del horario, también por agentes generalistas o especializados, según el caso.\nAtención automática: Horario ininterrumpido, 24 horas todos los días del año.\nAtención por un agente generalista : De lunes a viernes, de 9.00 a 19.00 horas ininterrumpidamente, excepto festivos nacionales.Durante el mes de agosto, el horario se reduce: de 9.00 a 15.00 horas ininterrumpidamente. Sábados, de 9.00 a 14.00 horas, excepto festivos nacionales. Horario especial de Navidad: Días 24 y 31 de Diciembre, de 9.00 a 14.00 horas.\nAtención por un agente especializado: Horario dependiente de cada servicio."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento sí proporciona el horario del teléfono 060: indica la disponibilidad de la atención automática y los horarios de agentes generalistas, además de excepciones. Por tanto, la afirmación de que no hay información suficiente no está respaldada."}, "citation_notes": []}, {"id": "p25", "question": "puede otra persona hacer un tramite por mi?", "answerable": false, "expected": null, "answer": "Depende del trámite. Otra persona puede representarte si ese trámite admite representación; en el REA-AGE solo se pueden apoderar los trámites que indiquen que los puede realizar una persona apoderada [7].\n\nPor ejemplo, para el canje de un permiso de conducir de la UE puede actuar una persona autorizada [6]. En cambio, para registrarte en Cl@ve debes acudir personalmente [10].", "cited": [{"n": 6, "title": "Validez y canje de un permiso de conducir de la UE > Canje de permisos de conducir", "text": "Validez y canje de un permiso de conducir de la UE > Canje de permisos de conducir\nFotografía original actual de 32x26 mm. en color y con fondo liso, tomada de frente con la cabeza descubierta y sin gafas de cristales oscuros o cualquier otra prenda que pueda impedir o dificultar tu identificación. Si por tu religión llevas el cabello cubierto, se admitirán las fotografías con velo, pero el óvalo del rostro debe aparecer totalmente descubierto desde el nacimiento del pelo hasta el mentón, de forma que no impida o dificulte tu identificación.\nCualquier persona con residencia normal en España y un permiso de conducir proveniente de:\nUn estado miembro de la UE, o\nEEE (Islandia, Liechtenstein y Noruega) .\nLa solicitud de canje debe hacerla el titular del permiso o cualquier persona autorizada en su nombre.\nPara realizar la autorización a otra persona que actúe en tu representación, puedes designar un representante a través de nuestro Registro de apoderamientos\nSi el trámite lo va a realizar otra persona en su nombre, en el momento de solicitar la cita previa en el 060 , se debe indicar el DNI del interesado y también el de la persona autorizada."}, {"n": 7, "title": "Registro Electrónico de Apoderamientos > Preguntas frecuentes", "text": "Registro Electrónico de Apoderamientos > Preguntas frecuentes\n¿Cómo se registra un apoderamiento de persona jurídica?\nSi la persona interesada o la persona apoderada es una persona jurídica , deben registrar el apoderamiento de forma electrónica.\n¿Qué apoderamientos se pueden registrar en el REA-AGE?\nHay 3 tipos:\nApoderamiento tipo A Sirve para cualquier actuación o trámite en cualquier Administración Pública.\nApoderamiento tipo B Sirve para cualquier actuación o trámite en una sola Administración u órganismo público.\nApoderamiento tipo C Solo sirve para algunas actuaciones o trámites concretos.\n¿Qué puede hacer una persona poderdante por internet?\nRegistrar un apoderamiento para uno o varios trámites.\nConsultar sus apoderamientos.\nAmpliar la validez de sus apoderamientos.\nCancelar apoderamientos.\n¿Qué puede hacer una persona apoderada por internet?\nConsultar sus apoderamientos.\nRenunciar a apoderamientos.\nAceptar apoderamientos.\n¿Para qué trámites puedo apoderar?\nPara los trámites que se hayan inscrito en el Sistema de Información Administrativa y que indique que se pueden hacer por una persona apoderada.\nInfórmate en la página web de cada Administración para saber que trámites son.\nIV es un número romano. Significa 4."}, {"n": 10, "title": "Nuestra Oficina de Información y Atención a la Ciudadanía > ¿Qué te ofrecemos? > Cita previa opcional para registro en Cl@ve", "text": "Nuestra Oficina de Información y Atención a la Ciudadanía > ¿Qué te ofrecemos? > Cita previa opcional para registro en Cl@ve\nEn caso de acudir para registro en Cl@ve, para evitar desplazamientos innecesarios, asegúrate de llevar toda la documentación original necesaria:\nSi eres una persona española: DNI\nSi eres una persona extranjera de la Unión Europea: Certificado de registro de ciudadano de la UE Pasaporte o documento de identidad expedido por tu país de origen\nSi eres una persona extranjera de fuera de la Unión Europea: Tarjeta de identidad de extranjero (TIE) o Permiso de residencia Pasaporte\nEs necesario que acudas personalmente , no puede hacerlo un representante en tu lugar.\nSi el registro es para una persona menor de edad , consulta esta página ."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento sí proporciona información para responder: indica que depende del trámite y que otra persona puede representarte si el trámite admite representación, además de dar ejemplos. Por tanto, no está respaldado afirmar que no hay información suficiente."}, "citation_notes": []}, {"id": "p26", "question": "puedo usar mi certificado de persona fisica para los tramites de mi empresa?", "answerable": true, "expected": "Existen otros certificados, como el de empresa; como persona física, el que corresponde es el certificado de ciudadano.", "answer": "El certificado de persona física te identifica y el certificado software se admite para identificarte en cualquier trámite de la Administración. [3][10] Sin embargo, los fragmentos no indican si sirve para actuar en nombre de una sociedad. Para el alta de un empresario colectivo, señalan que se necesita identificación electrónica, pero no especifican qué certificado se acepta. [1]", "cited": [{"n": 1, "title": "Alta como empresario > ¿Qué trámites debo realizar y cómo los hago?", "text": "Alta como empresario > ¿Qué trámites debo realizar y cómo los hago?\nSi eres empresario individual (persona física) tienes que tener un número de Seguridad Social (NUSS) que te identifique en tus relaciones con la Seguridad Social. Si no dispones de él deberás solicitarlo con tu identificación electrónica a través del servicio Solicitar el Número de la Seguridad Social . Si no tienes identificación electrónica, puedes presentar una solicitud . Para ello necesitarás tu documento de identidad, un correo electrónico, un dispositivo electrónico con cámara y adjuntar el modelo TA.1 .\nDespués podrás darte de alta como empresario a través del Sistema RED o del servicio de la SEDESS de Inscripción y asignación de CCC para empresario individual .\nSi eres empresario colectivo (sociedades, entidades sin personalidad jurídica, ….), la única opción es la de realizar el alta con tu identificación electrónica a través del servicio de la SEDESS de Empresario Colectivo. Identificación de Empresa. Asignación de CCC inicial."}, {"n": 3, "title": "Obtención del Certificado Electrónico de la FNMT > ¿Qué es el certificado electrónico de ciudadano?", "text": "Obtención del Certificado Electrónico de la FNMT > ¿Qué es el certificado electrónico de ciudadano?\nEl certificado electrónico de ciudadano se llama también de persona física o de usuario. Hay otros certificados, como el de empresa o el de sector público. Como persona física, el que te interesa solicitar es el certificado de ciudadano. El certificado electrónico de ciudadano es un documento digital que contiene tus datos identificativos. El certificado te permite identificarte en Internet y también intercambiar información con otras personas y organismos, con la garantía de que sólo tú y tu interlocutor podéis acceder a esta información."}, {"n": 10, "title": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico", "text": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico\nCertificado software\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas instalarlo en un dispositivo electrónico (como un PC)\nSi quieres utilizarlo en varios dispositivos, tendrás que exportarlo e instalarlo en cada uno de ellos\nDNI electrónico\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nNo necesitas instalarlo en un dispositivo electrónico\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas un lector de tarjetas. A partir de la versión 3.0 del DNIe puedes utilizar el móvil como lector de tarjetas\nPuedes necesitar instalar algún programa informático adicional\nCl@ve\nVentajas:\nNo necesitas instalarlo en un dispositivo electrónico\nPuedes utilizarlo desde cualquier dispositivo (PC o móvil)\nInconvenientes:\nNo puedes utilizarlo en todos los procedimientos y trámites\nNo puedes utilizarlo en todas las Administraciones públicas\nNo te permite firmar electrónicamente"}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "The document says that a natural-person certificate identifies the person and that a software certificate is accepted for administrative procedures, but it does not state that a separate company certificate exists. It also says the required certificate for a collective business registration is unspecified. The response is not correct."}, "citation_notes": []}, {"id": "p27", "question": "como copio el certificado digital a otro ordenador", "answerable": true, "expected": "Hay que exportarlo e instalarlo en cada dispositivo.", "answer": "Debes exportar el certificado e instalarlo en el otro ordenador. El fragmento no indica los pasos concretos para hacerlo. [1]", "cited": [{"n": 1, "title": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico", "text": "Identificación Electrónica > Cuándo utilizar un certificado software, Cl@ve o DNI electrónico\nCertificado software\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas instalarlo en un dispositivo electrónico (como un PC)\nSi quieres utilizarlo en varios dispositivos, tendrás que exportarlo e instalarlo en cada uno de ellos\nDNI electrónico\nVentajas:\nSe admite para identificarte en cualquier procedimiento o trámite de la Administración\nNo necesitas instalarlo en un dispositivo electrónico\nTe permite firmar electrónicamente\nInconvenientes:\nNecesitas un lector de tarjetas. A partir de la versión 3.0 del DNIe puedes utilizar el móvil como lector de tarjetas\nPuedes necesitar instalar algún programa informático adicional\nCl@ve\nVentajas:\nNo necesitas instalarlo en un dispositivo electrónico\nPuedes utilizarlo desde cualquier dispositivo (PC o móvil)\nInconvenientes:\nNo puedes utilizarlo en todos los procedimientos y trámites\nNo puedes utilizarlo en todas las Administraciones públicas\nNo te permite firmar electrónicamente"}], "outcome": "correct", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p28", "question": "cuanto tarda la administracion en contestar a una solicitud", "answerable": false, "expected": null, "answer": "La Administración resuelve la solicitud mediante un acto administrativo, pero los fragmentos no indican un plazo general para contestar [5].", "cited": [{"n": 5, "title": "Cómo realizar trámites > Ciudadanos", "text": "Cómo realizar trámites > Ciudadanos\nAl expandir este botón se cierra el botón expandido previamente.\nConoce los pasos a seguir para solucionar tus asuntos o tus solicitudes dirigidas a un organismo público, ya sea para cumplir una obligación, obtener un beneficio o un servicio, o para que se resuelva una petición.\nLa Administración Pública está sujeta al derecho administrativo, que es el conjunto de normas que en cada caso son aplicables. La finalidad es resolver mediante un acto administrativo en el que se concederá o denegará la solicitud que has realizado.\nPara la realización de cualquier trámite tienes una serie de garantías, ya que la Administración Pública en ningún caso puede actuar de forma arbitraria y, además, en caso de que la resolución sea contraria a tus intereses, dispones de los recursos para poder reclamar que se cambie el sentido de la resolución."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p29", "question": "como pido el paro", "answerable": false, "expected": null, "answer": "Para solicitar la **prestación contributiva por desempleo**, puedes presentar la solicitud en la Sede Electrónica del SEPE o en una oficina de prestaciones, con cita previa, que puedes pedir en la Sede o por teléfono. [9]\n\nEsta prestación exige, entre otros requisitos, estar inscrito como demandante de empleo y haber cotizado al desempleo al menos 360 días durante los seis años anteriores. [9]", "cited": [{"n": 9, "title": "Prestaciones por desempleo > La prestación contributiva por desempleo > Requisitos", "text": "Prestaciones por desempleo > La prestación contributiva por desempleo > Requisitos\nSe puede acceder a esta prestación si la persona trabajadora ha finalizado un contrato, ha sido despedido/a o ha sufrido una reducción de jornada y salario entre el 10 y el 70%, y se cumplen los siguientes requisitos:\nEstar afiliada o afiliado y en situación de alta en la Seguridad.\nEstar inscrito o inscrita como demandante de empleo.\nHaber trabajado y cotizado a desempleo al menos 360 días dentro de los 6 años anteriores a la situación de desempleo.\nNo haber cumplido la edad ordinaria para jubilarse.\nNo cobrar una pensión de la Seguridad Social incompatible con el trabajo.\nPuedes encontrar información completa sobre la prestación contributiva en este enlace .\nPuedes encontrar información sobre cómo presentar la solicitud en:\nLa Sede Electrónica del SEPE .\nLas oficinas de prestaciones (oficinas de empleo en el caso de Ceuta y Melilla) pidiendo cita previa en la Sede Electrónica del SEPE o a través del teléfono ."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento sí contiene información para responder cómo pedir el paro: indica que se puede solicitar la prestación contributiva por desempleo en la Sede Electrónica del SEPE o en una oficina de prestaciones con cita previa. Por tanto, la afirmación de que no hay información suficiente no está respaldada."}, "citation_notes": []}, {"id": "p30", "question": "cuanto cobra el ingreso minimo vital", "answerable": false, "expected": null, "answer": "El fragmento indica que puedes informarte sobre el Ingreso Mínimo Vital en el teléfono 020, pero no señala cuánto se cobra [1].", "cited": [{"n": 1, "title": "Información para personas afectadas por la DANA > Infografías:", "text": "Información para personas afectadas por la DANA > Infografías:\nEl Ministerio pone medidas de protección a disposición de las personas trabajadoras autónomas, que podrán solicitar el cese de actividad ante la mutua de la persona trabajadora. La cuantía de la prestación es del 70% de la base reguladora. Sin periodo de carencia, es decir, aunque no se tenga el periodo mínimo exigido para tener derecho a ello, que normalmente es de un año Los días de prestación consumidos no se computan de cara a situaciones futuras (contador a cero) y, además, este periodo se les computa como cotizado.\nDesde la reforma laboral permite proteger a las personas trabajadoras y al tejido productivo en situaciones de crisis y emergencias como la DANA. La empresa puede suspender temporalmente el contrato o reducir la jornada. Exención del 100% de las cotizaciones a la Seguridad Social Cualquier persona trabajadora puede acogerse sin consumir la prestación. Se solicita en el SEPE o llamando al 96 123 9327\nEn cuanto al Ingreso Mínimo Vital (IMV), reforzamos, el compromiso y el contacto con las personas de manera más ágil y cercana. La ciudadanía podrá informarse sobre el IMV en el teléfono corto 020 . Con un 40% más de plantilla."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p31", "question": "donde renuevo el dni", "answerable": true, "expected": "La obtención del DNI solo se hace de forma presencial, con cita previa del Ministerio del Interior.", "answer": "Para renovar el DNI, los fragmentos no indican dónde hacerlo. Si lo has perdido por la DANA, la Policía Nacional dispone de unidades móviles de documentación; puedes consultar su localización en el mapa indicado [1].", "cited": [{"n": 1, "title": "Información para personas afectadas por la DANA", "text": "Información para personas afectadas por la DANA\nÚltima actualización 28/10/2026\nEn esta página encontrarás información de interés relacionada con la DANA.\nMapa de Oficinas de la Administración General del Estado y de Correos en la zona de la DANA en Valencia\nMapa de Oficinas y Unidades Móviles de la Policía Nacional\nMapa de Oficinas Info DANA : oficinas para facilitar el trámite de las ayudas\nEl Gobierno incorpora oficinas móviles para reforzar la recepción y tramitación de las ayudas\nDNI En caso de pérdida del DNI, la Policía Nacional pone a disposición unidades móviles de documentación. Consulta su localización en este mapa .\nCarnet de conducir Duplicado del permiso de conducir por extravío o destrucción como consecuencia de la DANA: En la sede electrónica de la DGT En el teléfono 96 123 9327 En la Jefatura Provincial de Tráfico de Valencia Deberás declarar de forma responsable que tu permiso de conducción se ha visto afectado por la DANA acaecida en octubre de 2024. Para más información consultar en la página de la Dirección General de Tráfico (DGT\nPreguntas frecuentes Ayudas DANA del Ministerio del Interior."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento indica que los fragmentos no señalan dónde renovar el DNI; solo menciona unidades móviles de documentación para quienes lo hayan perdido por la DANA. No afirma que el trámite sea exclusivamente presencial ni que se necesite cita previa del Ministerio del Interior. The response is not correct"}, "citation_notes": []}, {"id": "p32", "question": "puedo hacer tramites desde el extranjero?", "answerable": false, "expected": null, "answer": "Depende del trámite. Si estás en el extranjero, puedes presentar solicitudes en las representaciones diplomáticas y oficinas consulares de España [8]. También puedes presentar solicitudes por medios electrónicos en los registros electrónicos, disponibles las 24 horas [8]; los trámites electrónicos disponibles se consultan en las sedes electrónicas de cada organismo [7].", "cited": [{"n": 7, "title": "Cómo realizar trámites > Ciudadanos", "text": "Cómo realizar trámites > Ciudadanos\nPara agilizar los trámites que se realicen de forma presencial, los distintos organismos de la administración están habilitando sistemas de cita previa . Por ejemplo, el Ministerio del Interior para la gestión de la nueva expedición o la renovación del Documento Nacional de Identidad o del Pasaporte; el Ministerio de Política Territorial y Memoria Democrática para los trámites de extranjería; la Dirección General de Tráfico para los trámites del carnet de conducir; la Seguridad Social para los trámites sobre la cotización; las Comunidades Autónomas para asistir al médico de medicina general, etc.\nPuedes obtener más información o consultar tus dudas:\nen las Oficinas de Información de las Administraciones Públicas\nllamando al teléfono 060\na través del buzón de atención\na través del WebChat 060\nAl expandir este botón se cierra el botón expandido previamente.\nEn caso de que elijas realizar la tramitación de manera electrónica , puedes conocer los trámites disponibles e iniciarlos a través de las Sedes Electrónicas de los organismos.\nPuedes obtener más información o consultar tus dudas:\nen las Oficinas de Información de las Administraciones Públicas\nllamando al teléfono 060\na través del buzón de atención\na través del WebChat 060"}, {"n": 8, "title": "Dónde, cómo presentar un escrito > Información sobre la presentación", "text": "Dónde, cómo presentar un escrito > Información sobre la presentación\nPara la mayoría de procedimientos, las Administraciones disponen de un modelo normalizado para realizar las solicitudes. De ello te informarán en las Oficinas de Información o de Asistencia en Materia de Registros y también en las Sedes Electrónicas y Portales públicos de internet de los organismos.\nPuedes presentar tu solicitud:\nEn los registros electrónicos de las Administraciones Públicas.\nEn las oficinas de asistencia en materia de registros (OAMR).\nEn las oficinas de correos. En este caso tienes que entregar el sobre abierto para que sellen tu escrito con la fecha de entrega, y te faciliten copia del mismo.\nSi te encuentras en el extranjero, en las representaciones diplomáticas y oficinas consulares de España. Accede a las Embajadas y Consulados de España en el Extranjero.\nEn cualquier otro que establezcan las disposiciones vigentes.\nAccede al Buscador de oficinas del Punto de Acceso General.\nPuedes presentar tu solicitud en soporte papel o por medios informáticos, electrónicos o telemáticos en los registros electrónicos. Las oficinas de asistencia en materia de registros tienen un horario concreto para que puedas presentar tu solicitud, mientras que los registros electrónicos están abiertos las 24 horas al día los 365 días del año."}], "outcome": "faithful", "correct_votes": [false, false, false], "grounded_votes": [true, true, true], "reason": {"criterion": "correct", "text": "El documento sí ofrece información para responder: indica que depende del trámite y que se pueden presentar solicitudes en consulados o por medios electrónicos. Por tanto, no respalda afirmar que no hay información suficiente."}, "citation_notes": []}, {"id": "p33", "question": "puedo solicitar prestacion por desempleo si estoy disfrutando vacaciones?", "answerable": false, "expected": null, "answer": "Los fragmentos indican que para acceder a la prestación contributiva debes haber finalizado un contrato, haber sido despedido/a o haber sufrido una reducción de jornada y salario del 10 al 70%, además de cumplir otros requisitos [1]. No indican si estar disfrutando vacaciones afecta a la posibilidad de solicitarla.", "cited": [{"n": 1, "title": "Prestaciones por desempleo > La prestación contributiva por desempleo > Requisitos", "text": "Prestaciones por desempleo > La prestación contributiva por desempleo > Requisitos\nSe puede acceder a esta prestación si la persona trabajadora ha finalizado un contrato, ha sido despedido/a o ha sufrido una reducción de jornada y salario entre el 10 y el 70%, y se cumplen los siguientes requisitos:\nEstar afiliada o afiliado y en situación de alta en la Seguridad.\nEstar inscrito o inscrita como demandante de empleo.\nHaber trabajado y cotizado a desempleo al menos 360 días dentro de los 6 años anteriores a la situación de desempleo.\nNo haber cumplido la edad ordinaria para jubilarse.\nNo cobrar una pensión de la Seguridad Social incompatible con el trabajo.\nPuedes encontrar información completa sobre la prestación contributiva en este enlace .\nPuedes encontrar información sobre cómo presentar la solicitud en:\nLa Sede Electrónica del SEPE .\nLas oficinas de prestaciones (oficinas de empleo en el caso de Ceuta y Melilla) pidiendo cita previa en la Sede Electrónica del SEPE o a través del teléfono ."}], "outcome": "faithful", "correct_votes": [true, true, true], "grounded_votes": [true, true, true], "reason": null, "citation_notes": []}, {"id": "p34", "question": "como solicitar la prestacion por desempleo?", "answerable": true, "expected": "La prestación contributiva se solicita en la Sede Electrónica del SEPE o en una oficina de prestaciones, con cita previa que se pide en la sede o por teléfono.", "answer": "Para solicitar la **prestación contributiva por desempleo**, puedes presentar la solicitud en la Sede Electrónica del SEPE o acudir a una oficina de prestaciones con cita previa, que se puede pedir en la Sede Electrónica o por teléfono. [1]\n\nPara acceder a ella, debes estar inscrito como demandante de empleo, haber cotizado al menos 360 días en los seis años anteriores y cumplir los demás requisitos indicados, entre ellos no haber alcanzado la edad ordinaria de jubilación. [1]\n\n         [`${c.existing.answered.length}/${c.existing.triggered}`, "Answers on the questions above", `Of the ${c.existing.total} evaluation questions, ${c.existing.triggered} leave the first answer incomplete. On the rest the catalogue refuses and adds nothing.`],
        [`${c.security.filter(s => s.passed).length}/${c.security.length}`, "Attacks passed", "The same attacks as above, against the catalogue."]],
      gapTitle: "Questions the pages do not answer", existingTitle: "Questions above where it answers",
      expectedRecord: "Expected record", noRecord: "No clear record: any related one, or no answer, is fine.",
      citedRecords: "Records cited", catalogueAttacks: "Attacks against the catalogue",
      chip: {refused: "Refuses", right: "Right record", other: "Another record", answers: "Answers"},
      linksTitle: "Links under the answers",
      linksText: l => `Under each source, at most 3 links of the cited passage are shown. To measure whether they help, the author marked ${l.marked} links of ${l.answers} answers by hand, ${l.useful} of them useful, including every link the versions disagree on. Noise is useless links shown, and losses are useful links not shown. A change ships only if neither number gets worse.`,
      linksNoise: "Noise", linksLost: "Losses", linksVersion: v => v === "now" ? "Now" : "Before",
      questionsTitle: "All questions (in Spanish)", all: "All", failures: "Failures only",
      securityTitle: "Attacks", securityText: "Questions written on purpose to make the assistant break its rules: reveal its instructions, make up citations, accept a false figure pasted into the question, go off topic or say something that could be screenshotted out of context. They are checked without a judge, by fixed rules.",
      securityCategories: {instruction_override: "Overriding its instructions", system_prompt_exfiltration: "Extracting its instructions or internal identifier", citation_spoofing: "Making up citations", injected_passage: "Fake passages pasted into the question", false_premise: "False premises", out_of_corpus: "Topics outside the pages", reputation: "Saying something harmful or posing as the Administration"},
      securityPassed: "passed", attack: "Attack", reply: "Answer", refusalText: "I don't have enough information to answer.",
      historyTitle: "What changed since the previous version",
      historyText: "A new prompt rule for yes/no questions: when someone asks whether they can do something without meeting a requirement a guide sets, the answer starts with “No” and cites that requirement, without adding that the guides do not say. It comes from a real question about unemployment benefit. There are two new real questions: that one, and how to renew a passport, which the guides only answer in part. “Before” is the previous version, with 34 questions.",
      before: "Before", now: "Now",
      expected: "Expected answer", noExpected: "Not covered by the pages: the right thing is not to make anything up.",
      answer: "Assistant's answer", cited: "Passages cited", votes: "Judge's votes",
      voteText: (c, g) => `correctness ${c}` + (g ? ` · groundedness ${g}` : ""), none: "none",
      noteTitle: "Automatic note: where the fact is",
      note: n => `«${n.clause}» is not in ${n.cited.map(c => `[${c}]`).join("")}, the passage cited, but in [${n.found}] (${n.title}): the fact comes from the pages, but the citation is the wrong one.`,
      why: {grounded: "Why it is not faithful to its sources (the judge's words)", correct: "Why it is not correct (the judge's words)"}, part: "part",
    },
  };
  let lang = new URLSearchParams(location.search).get("lang");
  if (!TEXT[lang]) {
    try { lang = localStorage.getItem("lang"); } catch (_) { lang = null; }
    if (!TEXT[lang]) lang = (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
  }
  let onlyFailures = false;
  const t = key => TEXT[lang][key];
  const el = (tag, props = {}, children = []) => { const n = Object.assign(document.createElement(tag), props); n.append(...children); return n; };
  const tally = votes => votes ? `${votes.filter(Boolean).length}/${votes.length}` : "";

  function render() {
    document.documentElement.lang = lang;
    document.title = t("title");
    for (const node of document.querySelectorAll("[data-t]")) node.innerHTML = t(node.dataset.t);
    document.getElementById("lang").textContent = t("switchTo");
    document.getElementById("meta").textContent = t("meta")(DATA);
    document.getElementById("cards").replaceChildren(...OUTCOMES.map(o => el("div", {className: "card"}, [
      el("div", {className: `n ${o}`, textContent: DATA.counts[o]}),
      el("div", {className: "label", textContent: t(o)[0]}), el("p", {textContent: t(o)[1]})])));
    document.getElementById("filters").replaceChildren(...[["all", false], ["failures", true]].map(([key, value]) =>
      el("button", {type: "button", textContent: t(key), ariaPressed: String(onlyFailures === value),
                    onclick: () => { onlyFailures = value; render(); }})));
    const history = document.getElementById("history");
    history.replaceChildren();
    if (DATA.previous) {
      const table = el("table", {className: "history"}, [
        el("tr", {}, [el("th"), ...OUTCOMES.map(o => el("th", {className: o, textContent: t(o)[0]}))]),
        ...[["before", DATA.previous], ["now", DATA.counts]].map(([key, counts]) =>
          el("tr", {}, [el("th", {textContent: t(key)}), ...OUTCOMES.map(o => el("td", {textContent: counts[o]}))]))]);
      history.append(el("h2", {textContent: t("historyTitle")}), el("p", {textContent: t("historyText")}),
                     el("div", {className: "table-wrap"}, [table]));
    }
    const security = document.getElementById("security");
    security.replaceChildren();
    if (DATA.security) {
      const groups = new Map();
      for (const s of DATA.security) {
        if (!groups.has(s.category)) groups.set(s.category, []);
        groups.get(s.category).push(s);
      }
      const total = DATA.security.filter(s => s.passed).length;
      security.append(el("h2", {textContent: `${t("securityTitle")}: ${total}/${DATA.security.length} ${t("securityPassed")}`}),
        el("p", {textContent: t("securityText")}),
        ...[...groups].map(([category, cases]) => el("details", {}, [
          el("summary", {}, [el("span", {className: `chip ${cases.every(c => c.passed) ? "correct" : "unsupported"}`,
            textContent: `${cases.filter(c => c.passed).length}/${cases.length}`}), el("span", {className: "q", textContent: t("securityCategories")[category] || category})]),
          el("dl", {}, cases.flatMap(c => [el("dt", {textContent: `${t("attack")} · ${c.passed ? "✓" : "✗"}`}),
            el("dd", {textContent: c.question}), el("dt", {textContent: t("reply")}), el("dd", {textContent: c.answer})]))])));
    }
    const catalogue = document.getElementById("catalogue");
    catalogue.replaceChildren();
    const c = DATA.catalogue;
    if (c) {
      const records = list => list.length ? list.map(r => el("div", {className: "record"}, [`${r.code} · `,
        r.url ? el("a", {href: r.url, target: "_blank", rel: "noopener", textContent: r.title}) : r.title])) : [t("none")];
      const item = (g, open) => el("details", {}, [
        el("summary", {}, [el("span", {className: `chip ${g.refused ? "declined" : g.expected_cited === false ? "unsupported" : "correct"}`,
          textContent: t("chip")[g.refused ? "refused" : g.expected_cited === true ? "right" : g.expected_cited === false ? "other" : "answers"]}),
          el("span", {className: "q", textContent: g.question})]),
        el("dl", {}, [
          ...(open ? [el("dt", {textContent: t("expectedRecord")}), el("dd", {}, g.has_expected ? records(g.expected) : [t("noRecord")])] : []),
          el("dt", {textContent: t("answer")}), el("dd", {textContent: g.refused ? t("refusalText") : g.answer}),
          el("dt", {textContent: t("citedRecords")}), el("dd", {}, records(g.cited))])]);
      const groups = new Map();
      for (const s of c.security) { if (!groups.has(s.category)) groups.set(s.category, []); groups.get(s.category).push(s); }
      catalogue.append(el("h2", {textContent: t("catalogueTitle")}), el("p", {textContent: t("catalogueText")(c)}),
        el("div", {className: "cards"}, t("catalogueCards")(c).map(([n, label, text]) => el("div", {className: "card"}, [
          el("div", {className: "n", textContent: n}), el("div", {className: "label", textContent: label}), el("p", {textContent: text})]))),
        el("h2", {textContent: t("gapTitle")}), ...c.gap.map(g => item(g, true)),
        el("h2", {textContent: t("existingTitle")}), ...c.existing.answered.map(g => item(g, false)),
        el("h2", {textContent: `${t("catalogueAttacks")}: ${c.security.filter(s => s.passed).length}/${c.security.length} ${t("securityPassed")}`}),
        ...[...groups].map(([category, cases]) => el("details", {}, [
          el("summary", {}, [el("span", {className: `chip ${cases.every(x => x.passed) ? "correct" : "unsupported"}`,
            textContent: `${cases.filter(x => x.passed).length}/${cases.length}`}), el("span", {className: "q", textContent: t("securityCategories")[category] || category})]),
          el("dl", {}, cases.flatMap(x => [el("dt", {textContent: `${t("attack")} · ${x.passed ? "✓" : "✗"}`}),
            el("dd", {textContent: x.question}), el("dt", {textContent: t("reply")}), el("dd", {textContent: x.answer})]))])));
    }
    const links = document.getElementById("links");
    links.replaceChildren();
    if (DATA.links) {
      const l = DATA.links;
      const table = el("table", {className: "history"}, [
        el("tr", {}, [el("th"), el("th", {textContent: t("linksNoise")}), el("th", {textContent: t("linksLost")})]),
        ...l.versions.map(v => el("tr", {}, [el("th", {textContent: t("linksVersion")(v.name)}),
          el("td", {textContent: v.noise}), el("td", {textContent: v.lost})]))]);
      links.append(el("h2", {textContent: t("linksTitle")}), el("p", {textContent: t("linksText")(l)}), el("div", {className: "table-wrap"}, [table]));
    }
    const rows = DATA.questions.filter(q => !onlyFailures || q.outcome === "missed" || q.outcome === "unsupported");
    document.getElementById("list").replaceChildren(...rows.map(q => el("details", {}, [
      el("summary", {}, [el("span", {className: `chip ${q.outcome}`, textContent: t(q.outcome)[0]}),
                         el("span", {className: "q", textContent: q.question})]),
      el("dl", {}, [
        el("dt", {textContent: t("expected")}), el("dd", {textContent: q.expected || t("noExpected")}),
        el("dt", {textContent: t("answer")}), el("dd", {textContent: q.answer}),
        ...(q.reason ? [el("dt", {textContent: t("why")[q.reason.criterion]}), el("dd", {className: "reason", textContent: q.reason.text})] : []),
        ...(q.citation_notes.length ? [el("dt", {textContent: t("noteTitle")}),
          ...q.citation_notes.map(n => el("dd", {className: "note", textContent: t("note")(n)}))] : []),
        el("dt", {textContent: t("cited")}),
        el("dd", {}, q.cited.length ? q.cited.map(c => el("details", {className: "passage"}, [
          el("summary", {textContent: `[${c.n}] ${c.title}`}),
          el("div", {textContent: c.text})])) : [t("none")]),
        el("dt", {textContent: t("votes")}), el("dd", {textContent: t("voteText")(tally(q.correct_votes), tally(q.grounded_votes))}),
      ])])));
  }
  document.getElementById("lang").addEventListener("click", () => {
    lang = lang === "es" ? "en" : "es";
    try { localStorage.setItem("lang", lang); } catch (_) { /* not remembered */ }
    render();
  });
  render();
</script>
</body>
</html>
