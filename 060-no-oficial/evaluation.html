      faithful: ["Parcial fiel", "Responde en parte, y todo lo que dice está en sus fuentes."],
      missed: ["Rechazo indebido", "Dice que no tiene información, aunque las guías sí la tienen."],
      unsupported: ["Sin respaldo", "Afirma algo que las guías citadas no dicen. Es el fallo grave."],
      howTitle: "Cómo se evalúa",
      how: `<ul>
        <li>Las ${DATA.questions.length} preguntas se escribieron como las escribiría cualquiera, <strong>antes de leer las guías</strong>, para no copiar su redacción. Después se marcó cuáles se pueden responder con ellas (${DATA.answerable}) y qué datos debe dar la respuesta.</li>
        <li>Las respuestas se generan exactamente como en la demo: las seis guías completas, el mismo modelo y las mismas reglas.</li>
        <li>Un modelo juez (GPT-6 Luna, con los jueces de corrección y fidelidad de MLflow) vota tres veces cada criterio y gana la mayoría: si la respuesta da los datos esperados, y si todo lo que dice está en los fragmentos que cita.</li>
      </ul>`,
      limitsTitle: "Límites de esta evaluación",
      limits: `<ul>
        <li><strong>El juez es el mismo modelo que responde</strong>, así que puede ser indulgente con sus propios errores. Por eso las respuestas se publican enteras: se pueden leer, no solo contar.</li>
        <li>Son ${DATA.questions.length} preguntas escritas por una persona, no preguntas reales; las reales se irán incorporando.</li>
        <li>Solo cubre seis guías: no mide prestaciones, ayudas ni trámites concretos de cada organismo.</li>
      </ul>`,
      questionsTitle: "Todas las preguntas", all: "Todas", failures: "Solo fallos",
      expected: "Respuesta esperada", noExpected: "Las guías no lo cubren: lo correcto es no inventar.",
      answer: "Respuesta del asistente", cited: "Fragmentos citados", votes: "Votos del juez",
      voteText: (c, g) => `corrección ${c}` + (g ? ` · fidelidad ${g}` : ""), none: "ninguno",
    },
    en: {
      back: "← Back to the assistant", switchTo: "Español",
      title: "How the procedures assistant is evaluated",
      lead: "Results of the latest evaluation of the unofficial demo: what it answers well, when it says it does not know, and where it fails.",
      meta: d => `Evaluated on ${d.generated} · ${d.questions.length} questions, ${d.answerable} answerable from the guides · model ${d.model} · ${d.guides} PAG guides captured on ${d.captured}, ${d.passages} passages`,
      correct: ["Correct", "Gives the expected facts, supported by the guides it cites."],
      declined: ["Correct refusal", "The guides do not cover it and it says so, instead of making something up."],
      faithful: ["Faithful partial", "Answers in part, and everything it says is in its sources."],
      missed: ["Wrong refusal", "Says it has no information, although the guides do."],
      unsupported: ["Unsupported", "States something the cited guides do not say. This is the serious failure."],
      howTitle: "How it is evaluated",
      how: `<ul>
        <li>The ${DATA.questions.length} questions were written the way anyone would type them, <strong>before reading the guides</strong>, so as not to copy their wording. Then each was marked as answerable from them or not (${DATA.answerable} are), with the facts an answer must give.</li>
        <li>Answers are generated exactly as in the demo: the six full guides, the same model and the same rules.</li>
        <li>A judge model (GPT-6 Luna, with MLflow's correctness and groundedness judges) votes three times on each criterion and the majority wins: whether the answer gives the expected facts, and whether everything it says is in the passages it cites.</li>
      </ul>`,
      limitsTitle: "Limits of this evaluation",
      limits: `<ul>
        <li><strong>The judge is the same model that answers</strong>, so it may be lenient with its own mistakes. That is why the answers are published in full: they can be read, not just counted.</li>
        <li>These are ${DATA.questions.length} questions written by one person, not real ones; real questions will be added.</li>
        <li>It covers six guides only: it does not measure benefits, grants or each body's specific procedures.</li>
      </ul>`,
      questionsTitle: "All questions (in Spanish)", all: "All", failures: "Failures only",
      expected: "Expected answer", noExpected: "Not covered by the guides: the right thing is not to make anything up.",
      answer: "Assistant's answer", cited: "Passages cited", votes: "Judge's votes",
      voteText: (c, g) => `correctness ${c}` + (g ? ` · groundedness ${g}` : ""), none: "none",
    },
  };
  let lang = new URLSearchParams(location.search).get("lang");
  if (!TEXT[lang]) {
    try { lang = localStorage.getItem("lang"); } catch (_) { lang = null; }
    if (!TEXT[lang]) lang = (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
  }
  let onlyFailures = false;
  const t = key => TEXT[lang][key];
  const el = (tag, props = {}, children = []) => { const n = Object.assign(document.createElement(tag), props); n.append(...children); return n; };
  const tally = votes => votes ? `${votes.filter(Boolean).length}/${votes.length}` : "";

  function render() {
    document.documentElement.lang = lang;
    document.title = t("title");
    for (const node of document.querySelectorAll("[data-t]")) node.innerHTML = t(node.dataset.t);
    document.getElementById("lang").textContent = t("switchTo");
    document.getElementById("meta").textContent = t("meta")(DATA);
    document.getElementById("cards").replaceChildren(...OUTCOMES.map(o => el("div", {className: "card"}, [
      el("div", {className: `n ${o}`, textContent: DATA.counts[o]}),
      el("div", {className: "label", textContent: t(o)[0]}), el("p", {textContent: t(o)[1]})])));
    document.getElementById("filters").replaceChildren(...[["all", false], ["failures", true]].map(([key, value]) =>
      el("button", {type: "button", textContent: t(key), ariaPressed: String(onlyFailures === value),
                    onclick: () => { onlyFailures = value; render(); }})));
    const rows = DATA.questions.filter(q => !onlyFailures || q.outcome === "missed" || q.outcome === "unsupported");
    document.getElementById("list").replaceChildren(...rows.map(q => el("details", {}, [
      el("summary", {}, [el("span", {className: `chip ${q.outcome}`, textContent: t(q.outcome)[0]}),
                         el("span", {className: "q", textContent: q.question})]),
      el("dl", {}, [
        el("dt", {textContent: t("expected")}), el("dd", {textContent: q.expected || t("noExpected")}),
        el("dt", {textContent: t("answer")}), el("dd", {textContent: q.answer}),
        el("dt", {textContent: t("cited")}), el("dd", {textContent: q.cited.length ? q.cited.join(", ") : t("none")}),
        el("dt", {textContent: t("votes")}), el("dd", {textContent: t("voteText")(tally(q.correct_votes), tally(q.grounded_votes))}),
      ])])));
  }
  document.getElementById("lang").addEventListener("click", () => {
    lang = lang === "es" ? "en" : "es";
    try { localStorage.setItem("lang", lang); } catch (_) { /* not remembered */ }
    render();
  });
  render();
</script>
</body>
</html>
