<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Asistente de trámites con la Administración española (demo)</title>
<meta name="description" content="Demo no oficial de un asistente que responde dudas sobre trámites con la Administración española citando las guías del Punto de Acceso General.">
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --ink: #1d1d1b; --muted: #5f5f5a; --line: #deded8;
    --accent: #1f5fa8; --accent-ink: #ffffff; --note: #fff7e0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --surface: #1f1f1d; --ink: #ececea; --muted: #a5a59f; --line: #34342f;
      --accent: #7fb0ea; --accent-ink: #101010; --note: #2d2818;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  .top { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
  .top button { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 4px 10px; font-size: .85rem; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 6px; }
  .about { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 16px 12px;
           font-size: .92rem; margin-bottom: 20px; }
  .about h2 { font-size: 1rem; margin: 14px 0 4px; }
  .about p, .about ul { margin: 0 0 6px; }
  .about ul { padding-left: 20px; }
  .lead { color: var(--muted); margin: 0 0 16px; }
  .disclaimer { background: var(--note); border: 1px solid var(--line); border-radius: 8px;
                padding: 8px 12px; font-size: .88rem; margin-bottom: 16px; }
  .disclaimer p { margin: 0; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; padding: 12px; font: inherit; color: var(--ink);
          background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  button { padding: 12px 18px; font: inherit; border: 0; border-radius: 8px; cursor: pointer;
           background: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: .6; cursor: wait; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 24px; }
  .examples button { background: var(--surface); color: var(--ink); border: 1px solid var(--line);
                     padding: 6px 10px; font-size: .9rem; text-align: left; }
  .answer { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .answer p { margin: 0 0 8px; white-space: pre-wrap; }
  .sources { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; font-size: .9rem; }
  a { color: var(--accent); }
  details { margin: 6px 0; } summary { cursor: pointer; }
  details div { color: var(--muted); white-space: pre-wrap; margin: 6px 0 0 16px; }
  .meta { color: var(--muted); font-size: .85rem; margin-top: 8px; }
  .nostore { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: .85rem; color: var(--muted); cursor: pointer; }
  .server { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; margin: 8px 0 0; min-height: 1.4em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .server.ready .dot { background: #2f9e5b; }
  .server.waking .dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  .server.down .dot { background: #c0392b; }
  .waiting { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .waiting .row { display: flex; align-items: center; gap: 12px; }
  .waiting .elapsed { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .waiting .hint { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }
  .dots { display: inline-flex; gap: 4px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1s ease-in-out infinite; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  .bar { height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 12px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 1s linear; }
  @keyframes pulse { 50% { opacity: .3; } }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(.6); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots span, .server.waking .dot { animation: none; } .bar i { transition: none; } }
  footer { color: var(--muted); font-size: .85rem; margin-top: 32px; }
  .storage { font-size: .85rem; color: var(--muted); margin-top: 2px !important; }
  .feedback { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .feedback button { background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 4px 10px; }
</style>
</head>
<body>
<main>
  <div class="top"><button id="info" type="button" aria-expanded="false" aria-controls="about"></button><button id="lang" type="button"></button></div>
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>
  <section class="about" id="about" hidden data-t="about"></section>
  <div class="disclaimer">
    <p data-t="disclaimer"></p>
    <p class="storage" data-t="storage"></p>
  </div>

  <form id="ask">
    <input id="q" name="q" maxlength="500" autocomplete="off" required>
    <button id="send" type="submit" data-t="send"></button>
  </form>
  <label class="nostore"><input type="checkbox" id="nostore"> <span data-t="noStore"></span></label>
  <p class="server" id="server" aria-live="polite"><span class="dot"></span><span id="server-text"></span></p>
  <div class="examples" id="examples"></div>
  <section id="out" aria-live="polite"></section>

  <footer data-t="footer"></footer>
</main>
<script>
  const API = new URLSearchParams(location.search).get("api") || "https://webchat060.icyfield-0b37f951.northeurope.azurecontainerapps.io";
  const PAG = '<a href="https://administracion.gob.es/">Punto de Acceso General</a>';
  const GUIDES = [
    ["Cómo realizar trámites", "realizar-un-tramite-nuevo"],
    ["Relacionarte electrónicamente con la Administración", "relacionarte-electronicamente-administracion"],
    ["Identificación Electrónica", "identificacion-electronica"],
    ["Notificaciones", "notificaciones"],
    ["Registrarte en Cl@ve", "servicioselectronicosfrecuentes/necesito-registrarme-en-clave"],
    ["Obtención del Certificado Electrónico de la FNMT", "servicioselectronicosfrecuentes/obtencion-certificado-electronico-fnmt"],
  ].map(([title, path]) => `<li><a href="https://administracion.gob.es/tramites-electronicos/${path}" target="_blank" rel="noopener">${title}</a></li>`).join("");
  const TEXT = {
    es: {
      title: "Asistente de trámites con la Administración española",
      lead: "Dudas sobre identificación electrónica, Cl@ve, certificado digital y notificaciones.",
      disclaimer: `<strong><em>Demo no oficial.</em></strong> No es el Webchat 060. Responde con guías del ${PAG} y puede equivocarse.`,
      storage: "Guardamos las preguntas 30 días para mejorarlo, salvo que marques «No guardar mi pregunta». <strong>No incluyas datos personales.</strong>",
      noStore: "No guardar mi pregunta",
      placeholder: "Escribe tu pregunta",
      send: "Preguntar", switchTo: "English", info: "Acerca de", infoClose: "Cerrar información", docTitle: "Asistente de trámites con la Administración española (demo)",
      examples: ["¿Cuánto cuesta el certificado digital?", "¿Qué diferencia hay entre Cl@ve PIN y Cl@ve Permanente?",
                 "¿Dónde veo una notificación electrónica?", "¿Se puede firmar con Cl@ve?"],
      thinking: "Consultando las guías…",
      waking: "Arrancando el servidor y consultando las guías…",
      wakingHint: "El servidor estaba en reposo: la primera respuesta tarda unos 30 segundos. Las siguientes, 2 o 3.",
      slowHint: "Está tardando más de lo normal; sigue en marcha.",
      asking: "Preguntando…", retry: "Reintentar",
      timeout: "No ha llegado respuesta en 90 segundos. Puede que el servidor esté arrancando o muy ocupado.",
      serverWaking: s => s > 0 ? `Arrancando el servidor… listo en ~${s} s` : "Arrancando el servidor… tarda más de lo normal",
      serverRetry: "El servidor no responde; reintentando…", serverReady: "Listo para responder", serverDown: "El servidor no responde ahora mismo",
      refused: 'Las guías incluidas no cubren esta pregunta. Puedes consultarla llamando al <a href="https://administracion.gob.es/informacion/formas-recibir-orientacion/canales-atencion/060" target="_blank" rel="noopener">060</a>, por el <a href="https://administracion.gob.es/informacion/formas-recibir-orientacion/canales-atencion/buzon" target="_blank" rel="noopener">buzón de atención</a> o en una <a href="https://administracion.gob.es/informacion/buscador-de-oficinas/oficinas-de-informacion-y-atencion-a-la-ciudadania/oficinas-informacion-administracion-general-estado" target="_blank" rel="noopener">oficina de información</a>.',
      refusal: "No tengo información suficiente para responder.",
      sources: "Fuentes", helpful: "¿Te ha servido?", yes: "👍 Sí", no: "👎 No", thanks: "Gracias.",
      error: "No se ha podido responder: {e}. Si es la primera pregunta en un rato, el servidor puede estar arrancando; inténtalo de nuevo.",
      about: `<h2>Qué es</h2>
        <p>Un experimento personal e independiente: probar si un asistente puede resolver dudas de trámites respondiendo solo con fuentes oficiales y citándolas. Nace de la idea de mejorar el Webchat 060, pero no tiene relación con la Administración ni con el servicio 060.</p>
        <h2>De dónde salen las respuestas</h2>
        <p>Solo de estas seis guías del ${PAG}, capturadas el 8 de noviembre de 2026. Si una guía cambia después, la respuesta puede estar desactualizada.</p>
        <ul>${GUIDES}</ul>
        <p>Las propias guías no siempre coinciden: una explica Cl@ve Firma y otra dice que Cl@ve no permite firmar. El asistente intenta avisar cuando ocurre, pero no siempre lo consigue.</p>
        <h2>Cómo responde</h2>
        <p>Cada pregunta se envía, junto con las seis guías completas, a GPT-6 Luna en Microsoft Azure, dentro de la Unión Europea. Debe citar el fragmento que usa; si no lo cita, o si las guías no tratan el tema, contesta que no tiene información suficiente. No consulta tus datos ni hace trámites por ti.</p>
        <h2>Qué no cubre</h2>
        <p>Prestaciones, ayudas, impuestos o trámites concretos de cada organismo (por ejemplo, cómo pedir el paro). Para eso, consulta la sede del organismo o los canales oficiales de atención, como el 060.</p>
        <h2>Cómo se evalúa</h2>
        <p>Con 32 preguntas escritas antes de leer las guías y un modelo juez que comprueba si cada respuesta es correcta y si todo lo que dice está en sus fuentes. <a href="evaluation.html">Ver los resultados y todas las respuestas</a>.</p>
        <h2>Privacidad</h2>
        <p><strong>Responsable:</strong> muoten, a título personal (no es un servicio de la Administración). Contacto: <a href="mailto:nw8bm9p6f@mozmail.com">nw8bm9p6f@mozmail.com</a>.</p>
        <p><strong>Qué se guarda:</strong> el texto de cada pregunta, si se respondió, qué guías citó, cuánto tardó y tu valoración (👍/👎). Antes de guardarla se borran DNI, NIE, teléfonos, correos, IBAN y números largos. El borrado es automático y no detecta todo: nombres, direcciones o datos de salud que escribas quedarían guardados. No se guarda tu IP ni ningún identificador tuyo, y la página no usa cookies (solo recuerda en tu navegador el idioma elegido).</p>
        <p><strong>Si no quieres que se guarde,</strong> marca «No guardar mi pregunta» antes de enviarla: se responde igual y no queda registro.</p>
        <p><strong>Para qué y por qué:</strong> para encontrar las dudas que el asistente no resuelve y mejorarlo. La base es el interés legítimo en mejorar un servicio gratuito, limitado a texto sin identificadores y con la opción de no guardarlo.</p>
        <p><strong>Cuánto tiempo:</strong> 30 días; después se borra automáticamente.</p>
        <p><strong>Quién más interviene:</strong> Microsoft Azure aloja el servidor y el registro en la UE (Irlanda) y procesa las preguntas con GPT-6 Luna en países de la Unión Europea. Según Microsoft, no las usa para entrenar modelos ni las comparte con OpenAI. Su sistema contra abusos las revisa de forma automática y, si detecta un posible abuso, puede conservar una muestra para revisión por personal de Microsoft en el Espacio Económico Europeo. La página la sirve GitHub Pages, que gestiona sus propios registros de acceso.</p>
        <p><strong>Tus derechos:</strong> como no se guarda nada que te identifique, solo podemos localizar una pregunta si nos indicas su texto exacto y el día. Con eso puedes pedir que se borre. También puedes reclamar ante la Agencia Española de Protección de Datos.</p>
        <h2>Autoría</h2>
        <p>Hecho por <a href="https://muoten.github.io/">muoten</a>. Sigue el enfoque de <a href="https://muoten.github.io/rag-against-the-machine.html">RAG against the machine</a>.</p>`,
      footer: 'Fuente: guías de <a href="https://administracion.gob.es/">administracion.gob.es</a>, capturadas el 8 de noviembre de 2026. Las preguntas se procesan con GPT-6 Luna en centros de datos de Microsoft en la UE y se guardan 30 días, sin datos de conexión, salvo que pidas lo contrario. Más detalles en «Acerca de».',
    },
    en: {
      title: "Assistant for procedures with the Spanish public administration",
      lead: "Questions about electronic identification, Cl@ve, the digital certificate and notifications.",
      disclaimer: `<strong><em>Unofficial demo.</em></strong> Not the Webchat 060. It answers from guides of Spain's ${PAG} and can be wrong.`,
      storage: "We keep questions for 30 days to improve it, unless you tick “Do not store my question”. <strong>Do not include personal data.</strong>",
      noStore: "Do not store my question",
      placeholder: "Type your question",
      send: "Ask", switchTo: "Español", info: "About", infoClose: "Close information", docTitle: "Assistant for procedures with the Spanish administration (demo)",
      examples: ["How much does the digital certificate cost?", "What is the difference between Cl@ve PIN and Cl@ve Permanente?",
                 "Where can I see an electronic notification?", "Can I sign documents with Cl@ve?"],
      thinking: "Checking the guides…",
      waking: "Starting the server and checking the guides…",
      wakingHint: "The server was idle: the first answer takes about 30 seconds. The next ones, 2 or 3.",
      slowHint: "It is taking longer than usual; still working.",
      asking: "Asking…", retry: "Try again",
      timeout: "No answer arrived within 90 seconds. The server may be starting or very busy.",
      serverWaking: s => s > 0 ? `Starting the server… ready in ~${s} s` : "Starting the server… taking longer than usual",
      serverRetry: "The server is not responding; retrying…", serverReady: "Ready to answer", serverDown: "The server is not responding right now",
      refused: 'The guides included do not cover this question. You can ask it by calling <a href="https://administracion.gob.es/informacion/formas-recibir-orientacion/canales-atencion/060" target="_blank" rel="noopener">060</a>, through the <a href="https://administracion.gob.es/informacion/formas-recibir-orientacion/canales-atencion/buzon" target="_blank" rel="noopener">help mailbox</a> or at an <a href="https://administracion.gob.es/informacion/buscador-de-oficinas/oficinas-de-informacion-y-atencion-a-la-ciudadania/oficinas-informacion-administracion-general-estado" target="_blank" rel="noopener">information office</a> (in Spanish).',
      refusal: "I don't have enough information to answer.",
      sources: "Sources (in Spanish)", helpful: "Was this helpful?", yes: "👍 Yes", no: "👎 No", thanks: "Thank you.",
      error: "Could not answer: {e}. If this is the first question in a while, the server may be starting; please try again.",
      about: `<h2>What this is</h2>
        <p>A personal, independent experiment: testing whether an assistant can answer questions about procedures using only official sources, and citing them. It grew out of the idea of improving the Webchat 060, but it has no connection with the Spanish administration or the 060 service.</p>
        <h2>Where answers come from</h2>
        <p>Only from these six guides of Spain's ${PAG} (in Spanish), captured on 8 November 2026. If a guide has changed since, an answer may be out of date.</p>
        <ul>${GUIDES}</ul>
        <p>The guides themselves do not always agree: one explains Cl@ve Firma and another says Cl@ve cannot sign. The assistant tries to point this out, but does not always manage to.</p>
        <h2>How it answers</h2>
        <p>Each question is sent, together with the six full guides, to GPT-6 Luna on Microsoft Azure, within the European Union. It must cite the passage it uses; if it cites none, or the guides do not cover the topic, it says it does not have enough information. It does not look up your data or carry out procedures for you.</p>
        <h2>What it does not cover</h2>
        <p>Benefits, grants, taxes or the specific procedures of each body (for example, how to claim unemployment benefit). For those, check that body's website or the official help channels, such as the 060.</p>
        <h2>How it is evaluated</h2>
        <p>With 32 questions written before reading the guides and a judge model that checks whether each answer is correct and whether everything it says is in its sources. <a href="evaluation.html?lang=en">See the results and every answer</a>.</p>
        <h2>Privacy</h2>
        <p><strong>Controller:</strong> muoten, as a private individual (this is not a government service). Contact: <a href="mailto:nw8bm9p6f@mozmail.com">nw8bm9p6f@mozmail.com</a>.</p>
        <p><strong>What is stored:</strong> the text of each question, whether it was answered, which guides it cited, how long it took and your rating (👍/👎). Before storing, ID numbers, phone numbers, e-mail addresses, IBANs and long numbers are removed. The removal is automatic and does not catch everything: names, addresses or health details you type would be stored. Your IP address and any identifier of yours are not stored, and the page uses no cookies (it only remembers the language you chose, in your browser).</p>
        <p><strong>If you do not want it stored,</strong> tick “Do not store my question” before sending: you get the same answer and nothing is kept.</p>
        <p><strong>Why:</strong> to find the questions the assistant cannot answer and improve it. The basis is the legitimate interest in improving a free service, limited to text without identifiers and with the option not to store it.</p>
        <p><strong>For how long:</strong> 30 days; then it is deleted automatically.</p>
        <p><strong>Who else is involved:</strong> Microsoft Azure hosts the server and the log in the EU (Ireland) and processes questions with GPT-6 Luna in European Union countries. According to Microsoft, it does not use them to train models or share them with OpenAI. Its abuse monitoring reviews them automatically and, if it detects possible abuse, may keep a sample for review by Microsoft staff in the European Economic Area. The page is served by GitHub Pages, which keeps its own access logs.</p>
        <p><strong>Your rights:</strong> since nothing that identifies you is stored, a question can only be found if you give its exact text and the day. With that you can ask for it to be deleted. You can also complain to the Spanish Data Protection Agency (AEPD).</p>
        <h2>Author</h2>
        <p>Made by <a href="https://muoten.github.io/">muoten</a>. It follows the approach of <a href="https://muoten.github.io/rag-against-the-machine.html">RAG against the machine</a>.</p>`,
      footer: 'Source: guides from <a href="https://administracion.gob.es/">administracion.gob.es</a>, captured on 8 November 2026. Questions are processed with GPT-6 Luna in Microsoft data centres in the EU and kept for 30 days, without connection data, unless you ask otherwise. More details under “About”.',
    },
  };
  const out = document.getElementById("out"), q = document.getElementById("q"), send = document.getElementById("send");
  let lang = new URLSearchParams(location.search).get("lang");
  if (!TEXT[lang]) {
    try { lang = localStorage.getItem("lang"); } catch (_) { lang = null; }
    if (!TEXT[lang]) lang = (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
  }
  const t = key => TEXT[lang][key];

  function el(tag, props = {}, children = []) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  function render() {
    document.documentElement.lang = lang;
    document.title = t("docTitle");
    for (const node of document.querySelectorAll("[data-t]")) node.innerHTML = t(node.dataset.t);
    q.placeholder = t("placeholder");
    document.getElementById("lang").textContent = t("switchTo");
    const about = document.getElementById("about"), info = document.getElementById("info");
    info.textContent = about.hidden ? t("info") : t("infoClose");
    info.setAttribute("aria-expanded", String(!about.hidden));
    const examples = document.getElementById("examples");
    examples.replaceChildren(...t("examples").map(text => el("button", {type: "button", textContent: text,
      onclick: () => { q.value = text; ask(text); }})));
  }

  async function ask(question) {
    if (!question) return;
    send.disabled = true;
    send.textContent = t("asking");
    // A cold server shows its wait from the first second; a warm one only if it drags.
    const cold = server !== "ready";
    const label = el("span", {textContent: cold ? t("waking") : t("thinking")});
    const elapsed = el("span", {className: "elapsed", textContent: "0 s"});
    const hint = el("p", {className: "hint", textContent: cold ? t("wakingHint") : ""});
    const fill = el("i");
    out.replaceChildren(el("div", {className: "waiting", role: "status"}, [
      el("div", {className: "row"}, [el("span", {className: "dots", ariaHidden: "true"}, [el("span"), el("span"), el("span")]), label, elapsed]),
      hint, el("div", {className: "bar", ariaHidden: "true"}, [fill])]));
    // A cold server needs what is left of its start-up, plus the answer itself.
    const expected = cold ? Math.max(5, wakeRemaining()) + 5 : 6;
    const started = Date.now();
    const tick = setInterval(() => {
      const s = Math.round((Date.now() - started) / 1000);
      elapsed.textContent = `${s} s`;
      fill.style.width = `${Math.min(95, 100 * s / expected)}%`;
      if (!cold && s >= 8) hint.textContent = t("slowHint");
    }, 1000);
    const abort = new AbortController();
    const limit = setTimeout(() => abort.abort(), 90000);
    try {
      const res = await fetch(API + "/ask", {method: "POST", headers: {"Content-Type": "application/json"},
                                             body: JSON.stringify({question, store: !document.getElementById("nostore").checked}), signal: abort.signal});
      setServer("ready");
      const body = await res.json();
      if (!res.ok) throw new Error(body.detail || "Error " + res.status);
      // The service's refusal is in Spanish; show it in the page's language.
      const box = el("div", {className: "answer"}, [el("p", {textContent: body.refused ? t("refusal") : body.answer})]);
      if (body.refused) {
        box.append(el("p", {className: "meta", innerHTML: t("refused")}));
      } else if (body.sources.length) {
        // One entry per guide, with the cited passages of that guide inside.
        const guides = new Map();
        for (const s of body.sources) {
          if (!guides.has(s.url)) guides.set(s.url, {title: s.title, passages: []});
          guides.get(s.url).passages.push(s);
        }
        const list = el("div", {className: "sources"}, [el("strong", {textContent: t("sources")})]);
        for (const [url, g] of guides) {
          const marks = g.passages.map(s => `[${s.n}]`).join("");
          list.append(el("details", {}, [
            el("summary", {}, [`${marks} `, el("a", {href: url, target: "_blank", rel: "noopener", textContent: g.title})]),
            ...g.passages.map(s => el("div", {textContent: `[${s.n}] ${s.text}`}))]));
        }
        box.append(list);
      }
      const thanks = el("span");
      const rate = helpful => async () => {
        for (const b of box.querySelectorAll(".feedback button")) b.disabled = true;
        thanks.textContent = t("thanks");
        try {
          await fetch(API + "/feedback", {method: "POST", headers: {"Content-Type": "application/json"},
                                          body: JSON.stringify({id: body.id, helpful})});
        } catch (_) { /* feedback is optional */ }
      };
      box.append(el("div", {className: "feedback"}, [t("helpful"),
        el("button", {type: "button", textContent: t("yes"), onclick: rate(true)}),
        el("button", {type: "button", textContent: t("no"), onclick: rate(false)}), thanks]));
      out.replaceChildren(box);
      // On a phone the answer lands below the fold; bring it into view.
      if (box.getBoundingClientRect().top > window.innerHeight * 0.6) box.scrollIntoView({behavior: "smooth", block: "start"});
    } catch (err) {
      const message = err.name === "AbortError" ? t("timeout") : t("error").replace("{e}", err.message.replace(/\.+$/, ""));
      out.replaceChildren(el("div", {className: "waiting"}, [el("p", {textContent: message}),
        el("button", {type: "button", textContent: t("retry"), onclick: () => ask(question)})]));
    } finally {
      clearInterval(tick);
      clearTimeout(limit);
      send.disabled = false;
      send.textContent = t("send");
    }
  }

  document.getElementById("lang").addEventListener("click", () => {
    lang = lang === "es" ? "en" : "es";
    try { localStorage.setItem("lang", lang); } catch (_) { /* the choice just won't be remembered */ }
    out.replaceChildren();
    render();
    setServer(server);
  });
  document.getElementById("info").addEventListener("click", () => {
    const about = document.getElementById("about");
    about.hidden = !about.hidden;
    render();
  });
  document.getElementById("ask").addEventListener("submit", e => { e.preventDefault(); ask(q.value.trim()); });
  // Wake the API while the visitor reads and types: after a quiet spell it takes ~25 s
  // to start, so the page says so before anyone asks.
  // Measured cold start: about 25 s from the first request to a ready container.
  const COLD_START_S = 25, RETRY_S = 5, GIVE_UP_S = 120;
  let server = "waking", wakeStarted = Date.now(), retrying = false;
  const wakeElapsed = () => Math.round((Date.now() - wakeStarted) / 1000);
  const wakeRemaining = () => Math.max(0, COLD_START_S - wakeElapsed());
  function setServer(state) {
    server = state;
    paintServer();
  }
  function paintServer() {
    const label = server === "waking" ? (retrying ? t("serverRetry") : t("serverWaking")(wakeRemaining()))
      : t({ready: "serverReady", down: "serverDown"}[server]);
    document.getElementById("server").className = `server ${server}`;
    document.getElementById("server-text").textContent =
      server === "waking" && wakeRemaining() === 0 && !retrying ? `${label} (${wakeElapsed()} s)` : label;
  }
  // The countdown repaints every second while the server is starting.
  const countdown = setInterval(() => { if (server === "waking") paintServer(); else clearInterval(countdown); }, 1000);
  // One request wakes the container; if it fails, try again every few seconds.
  function wake() {
    const attempt = new AbortController();
    setTimeout(() => attempt.abort(), 60000);
    fetch(API + "/health", {signal: attempt.signal})
      .then(res => { if (!res.ok) throw new Error(res.status); setServer("ready"); })
      .catch(() => {
        if (server === "ready") return;
        if (wakeElapsed() >= GIVE_UP_S) { setServer("down"); return; }
        retrying = true; paintServer();
        setTimeout(() => { retrying = false; wake(); }, RETRY_S * 1000);
      });
  }
  render();
  setServer("waking");
  wake();
</script>
</body>
</html>
