      sources: "Fuentes", helpful: "¿Te ha servido?", yes: "👍 Sí", no: "👎 No", thanks: "Gracias.", share: "Copiar enlace a la pregunta", copied: "Enlace copiado.",
      lookingCatalogue: "Las guías del Punto de Acceso General no lo explican del todo. Buscando en el catálogo oficial de trámites…",

      about: `<h2>Qué es</h2>
        <p>Un experimento personal e independiente: probar si un asistente puede resolver dudas de trámites respondiendo solo con fuentes oficiales y citándolas. Nace de la idea de mejorar el Webchat 060, pero no tiene relación con la Administración ni con el servicio 060.</p>
        <h2>De dónde salen las respuestas</h2>
        <p>Conoce 322 de las 606 páginas que el ${PAG} incluye en su mapa web, tal como estaban el 9 y el 11 de noviembre de 2026: las de atención a la ciudadanía, trámites, empleo público, ayudas, lectura fácil y «Tu espacio europeo» (derechos y trámites en la Unión Europea). No incluye la sección sobre la organización del Estado. No busca en internet. Si alguna página ha cambiado después, la respuesta puede no estar al día.</p>
        <ul>${sectionList("páginas")}</ul>
        <p>Si esas páginas no lo explican del todo, busca también en el catálogo oficial de procedimientos de la Administración General del Estado: 8.000 fichas, exportadas el 8 de noviembre de 2026, que dicen qué trámite es, de qué ministerio depende y cómo se hace, con su enlace. No incluye los trámites de comunidades autónomas ni de ayuntamientos.</p>
        <p>Las propias páginas no siempre coinciden: una explica Cl@ve Firma y otra dice que Cl@ve no permite firmar. El asistente intenta avisar cuando ocurre, pero no siempre lo consigue.</p>
        <h2>Cómo responde</h2>
        <p>Para cada pregunta se buscan los 10 fragmentos de esas páginas más relacionados con ella, y se envían con la pregunta a GPT-6 Luna en Microsoft Azure, dentro de la Unión Europea. Debe citar el fragmento que usa. Si no lo cita, o si esos fragmentos no tratan el tema, contesta que no tiene información suficiente. Si la búsqueda no da con el fragmento adecuado, puede contestar eso aunque alguna página sí lo explique. Cuando busca en el catálogo, envía las 5 fichas más relacionadas en una segunda consulta, que tarda unos segundos más, y solo muestra la respuesta si alguna ficha es el trámite que buscas. No consulta tus datos ni hace trámites por ti.</p>
        <h2>Qué no cubre</h2>
        <p>Los pasos, requisitos y plazos de cada trámite concreto (por ejemplo, cómo pedir el paro): las páginas enlazan a la sede de cada organismo, y el catálogo dice qué trámite es y dónde se hace, pero no los explican. Para eso, consulta la sede del organismo o los canales oficiales de atención, como el 060.</p>
        <h2>Cómo se evalúa</h2>
        <p>Con 33 preguntas (32 escritas antes de leer las páginas y una real, hecha en la demo) y un modelo juez que comprueba si cada respuesta es correcta y si todo lo que dice está en sus fuentes, y con 34 ataques (instrucciones escondidas, citas falsas, premisas falsas) que debe resistir. La búsqueda en el catálogo se evalúa aparte, con 14 preguntas que las páginas no responden y los mismos 34 ataques. <a href="evaluation.html">Ver los resultados y todas las respuestas</a>.</p>
        <h2>Privacidad</h2>
        <p><strong>Responsable:</strong> muoten, a título personal (no es un servicio de la Administración). Contacto: <a href="mailto:nw8bm9p6f@mozmail.com">nw8bm9p6f@mozmail.com</a>.</p>
        <p><strong>Qué se guarda:</strong> el texto de cada pregunta, si se respondió, qué páginas o fichas citó, cuánto tardó y tu valoración (👍/👎). Antes de guardarla se borran DNI, NIE, teléfonos, correos, IBAN y números largos. El borrado es automático y no detecta todo: nombres, direcciones o datos de salud que escribas quedarían guardados. No se guarda tu IP ni ningún identificador tuyo, y la página no usa cookies (solo recuerda en tu navegador el idioma elegido).</p>
        <p><strong>Si no quieres que se guarde,</strong> marca «No guardar mi pregunta» antes de enviarla: se responde igual y no queda registro.</p>
        <p><strong>Para qué y por qué:</strong> para encontrar las dudas que el asistente no resuelve y mejorarlo. La base es el interés legítimo en mejorar un servicio gratuito, limitado a texto sin identificadores y con la opción de no guardarlo.</p>
        <p><strong>Cuánto tiempo:</strong> 30 días. Después se borra automáticamente.</p>
        <p><strong>Quién más interviene:</strong> Microsoft Azure aloja el servidor y el registro en la UE (Irlanda) y procesa las preguntas con GPT-6 Luna en países de la Unión Europea. Según Microsoft, no las usa para entrenar modelos ni las comparte con OpenAI. Su sistema contra abusos las revisa de forma automática y, si detecta un posible abuso, puede conservar una muestra para revisión por personal de Microsoft en el Espacio Económico Europeo. La página la sirve GitHub Pages, que gestiona sus propios registros de acceso.</p>
        <p><strong>Tus derechos:</strong> como no se guarda nada que te identifique, solo podemos localizar una pregunta si nos indicas su texto exacto y el día. Con eso puedes pedir que se borre. También puedes reclamar ante la Agencia Española de Protección de Datos.</p>
        <h2>Autoría</h2>

      sources: "Sources (in Spanish)", helpful: "Was this helpful?", yes: "👍 Yes", no: "👎 No", thanks: "Thank you.", share: "Copy a link to the question", copied: "Link copied.",
      lookingCatalogue: "The Punto de Acceso General guides do not fully explain this. Searching the official catalogue of procedures…",
      catalogueTitle: "In the official catalogue of procedures:", records: "Catalogue records (in Spanish)",
      goTo: "Go to the procedure: ", siteHome: h => `Website of the body: ${h}`, noDirect: "(the record does not link to the procedure itself)",

      about: `<h2>What this is</h2>
        <p>A personal, independent experiment: testing whether an assistant can answer questions about procedures using only official sources, and citing them. It grew out of the idea of improving the Webchat 060, but it has no connection with the Spanish administration or the 060 service.</p>
        <h2>Where answers come from</h2>
        <p>It knows 322 of the 606 pages that Spain's ${PAG} lists in its site map (in Spanish), as they were on 9 and 11 November 2026: those on public information services, procedures, public employment, grants, easy reading and "Tu espacio europeo" (rights and procedures in the European Union). It does not include the section on how the State is organised. It does not search the internet. If a page has changed since, an answer may be out of date.</p>
        <ul>${sectionList("pages")}</ul>
        <p>If those pages do not fully explain something, it also searches the official catalogue of procedures of the State administration: 8,000 records, exported on 8 November 2026, that say which procedure it is, which ministry it belongs to and how it is done, with its link. It does not include the procedures of regions or town councils.</p>
        <p>The pages themselves do not always agree: one explains Cl@ve Firma and another says Cl@ve cannot sign. The assistant tries to point this out, but does not always manage to.</p>
        <h2>How it answers</h2>
        <p>For each question, the 10 passages of those pages most related to it are found and sent with the question to GPT-6 Luna on Microsoft Azure, within the European Union. It must cite the passage it uses. If it cites none, or those passages do not cover the topic, it says it does not have enough information. If the search misses the right passage, it may say so even though some page does explain it. When it searches the catalogue, it sends the 5 most related records in a second request, which takes a few seconds more, and only shows the answer if one of them is the procedure you are looking for. It does not look up your data or carry out procedures for you.</p>
        <h2>What it does not cover</h2>
        <p>The steps, requirements and deadlines of each specific procedure (for example, how to claim unemployment benefit): the pages link to each body's website, and the catalogue says which procedure it is and where it is done, but neither explains them. For those, check that body's website or the official help channels, such as the 060.</p>
        <h2>How it is evaluated</h2>
        <p>With 33 questions (32 written before reading the pages and one real, asked on the demo) and a judge model that checks whether each answer is correct and whether everything it says is in its sources, and with 34 attacks (hidden instructions, fake citations, false premises) it must resist. The catalogue search is evaluated separately, with 14 questions the pages do not answer and the same 34 attacks. <a href="evaluation.html?lang=en">See the results and every answer</a>.</p>
        <h2>Privacy</h2>
        <p><strong>Controller:</strong> muoten, as a private individual (this is not a government service). Contact: <a href="mailto:nw8bm9p6f@mozmail.com">nw8bm9p6f@mozmail.com</a>.</p>
        <p><strong>What is stored:</strong> the text of each question, whether it was answered, which pages or records it cited, how long it took and your rating (👍/👎). Before storing, ID numbers, phone numbers, e-mail addresses, IBANs and long numbers are removed. The removal is automatic and does not catch everything: names, addresses or health details you type would be stored. Your IP address and any identifier of yours are not stored, and the page uses no cookies (it only remembers the language you chose, in your browser).</p>
        <p><strong>If you do not want it stored,</strong> tick “Do not store my question” before sending: you get the same answer and nothing is kept.</p>
        <p><strong>Why:</strong> to find the questions the assistant cannot answer and improve it. The basis is the legitimate interest in improving a free service, limited to text without identifiers and with the option not to store it.</p>
        <p><strong>For how long:</strong> 30 days. Then it is deleted automatically.</p>
        <p><strong>Who else is involved:</strong> Microsoft Azure hosts the server and the log in the EU (Ireland) and processes questions with GPT-6 Luna in European Union countries. According to Microsoft, it does not use them to train models or share them with OpenAI. Its abuse monitoring reviews them automatically and, if it detects possible abuse, may keep a sample for review by Microsoft staff in the European Economic Area. The page is served by GitHub Pages, which keeps its own access logs.</p>
        <p><strong>Your rights:</strong> since nothing that identifies you is stored, a question can only be found if you give its exact text and the day. With that you can ask for it to be deleted. You can also complain to the Spanish Data Protection Agency (AEPD).</p>
        <h2>Author</h2>
        <p>Made by <a href="https://muoten.github.io/">muoten</a>. It follows the approach of <a href="https://muoten.github.io/rag-against-the-machine.html">RAG against the machine</a>.</p>`,
      footer: 'Source: pages from <a href="https://administracion.gob.es/">administracion.gob.es</a>, captured on 9 and 11 November 2026, and its catalogue of procedures, exported on 8 November. Questions are processed with GPT-6 Luna in Microsoft data centres in the EU and kept for 30 days, without connection data, unless you ask otherwise. More details under “About”.',
    },
  };
  const out = document.getElementById("out"), q = document.getElementById("q"), send = document.getElementById("send");
  let lang = new URLSearchParams(location.search).get("lang");
  if (!TEXT[lang]) {
    try { lang = localStorage.getItem("lang"); } catch (_) { lang = null; }
    if (!TEXT[lang]) lang = (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
  }
  const t = key => TEXT[lang][key];
  let turn = 0;

  function el(tag, props = {}, children = []) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  // Catalogue answers mark procedure names in bold, as **name**; nothing else is markup.
  function rich(text) {
    return text.split(/\*\*(.+?)\*\*/s).map((part, i) => i % 2 ? el("strong", {textContent: part}) : part);
  }

  // One answer with its sources, notes and rating; the catalogue's cites records, not pages.
  function answerBox(body, catalogue, question) {
    // The service's refusal is in Spanish; show it in the page's language.
    const box = el("div", {className: "answer"}, [el("p", {}, body.refused ? [t("refusal")] : rich(body.answer))]);
    // What saves the visitor time: the page of each cited procedure, first and in view.
    // A record that only links to a website's home page says so.
    if (catalogue && !body.refused) {
      const go = body.sources.filter(s => /^https?:/.test(s.url)).map(s => {
        const u = new URL(s.url), home = u.pathname.replace(/\/+$/, "") === "" && !u.search;
        const text = home ? t("siteHome")(u.hostname) : t("goTo") + s.title.replace(/\.$/, "");
        return el("li", {}, [el("a", {href: s.url, target: "_blank", rel: "noopener", textContent: text}),
                             " ", el("span", {className: "host", textContent: home ? t("noDirect") : `(${u.hostname})`})]);
      });
      if (go.length) box.append(el("ul", {className: "go"}, go));
    }
    if (body.refused) {
      box.append(el("p", {className: "meta", innerHTML: t("refused")}));
    } else if (body.sources.length) {
      // One entry per guide, with the cited passages of that guide inside.
      const guides = new Map();
      for (const s of body.sources) {
        if (!guides.has(s.url)) guides.set(s.url, {title: s.title, passages: []});
        guides.get(s.url).passages.push(s);
      }
      const list = el("div", {className: "sources"}, [el("strong", {textContent: t(catalogue ? "records" : "sources")})]);
      for (const [url, g] of guides) {
        const marks = g.passages.map(s => `[${s.n}]`).join("");
        list.append(el("details", {}, [
          el("summary", {}, [`${marks} `, el("a", {href: url, target: "_blank", rel: "noopener", textContent: g.title})]),
          ...g.passages.map(s => {
            // A passage starts with its heading path, which repeats the page title above:
            // show only the section below it, as a label. A record's is the catalogue's
            // name and the ministry: the ministry is the label.
            const [head, ...body] = s.text.split("\n");
            const own = catalogue || head.startsWith(g.title);
            const section = catalogue ? head.split(" > ").slice(1).join(" > ")
              : own ? head.slice(g.title.length).replace(/^\s*>\s*/, "") : "";
            return el("div", {}, [`[${s.n}] `, ...(section ? [el("em", {textContent: section}), "\n"] : []),
                                  own ? body.join("\n") : s.text]);
          })]));
        // Where the cited passages point, visible without opening them.
        const seen = new Set();
        const links = g.passages.flatMap(s => s.links || []).filter(l => !seen.has(l.url) && seen.add(l.url)).slice(0, 5);
        if (links.length) list.append(el("ul", {className: "links"}, links.map(l =>
          el("li", {}, [el("a", {href: l.url, target: "_blank", rel: "noopener", textContent: l.label})]))));
      }
      box.append(list);
      // Every source is about one particular case (the DANA, say): point elsewhere too.
      const cases = [...new Set(body.sources.map(s => s.case))];
      if (cases.length === 1 && cases[0]) {
        const safe = cases[0].replace(/[&<>"']/g, ch => `&#${ch.charCodeAt(0)};`);
        box.append(el("p", {className: "meta", innerHTML: t("caseNote")(safe)}));
      }
    }
    const thanks = el("span");
    const rate = helpful => async event => {
      for (const b of box.querySelectorAll(".feedback button")) b.disabled = true;
      event.currentTarget.setAttribute("aria-pressed", "true");
      thanks.textContent = t("thanks");
      try {
        await fetch(API + "/feedback", {method: "POST", headers: {"Content-Type": "application/json"},
                                        body: JSON.stringify({id: body.id, helpful})});
      } catch (_) { /* feedback is optional */ }
    };
    box.append(el("div", {className: "feedback"}, [t("helpful"),
      el("button", {type: "button", textContent: t("yes"), onclick: rate(true)}),
      el("button", {type: "button", textContent: t("no"), onclick: rate(false)}), thanks,
      el("button", {type: "button", className: "share", textContent: t("share"), onclick: () => share(question, thanks)})]));
    return box;
  }

  // The second step: the guides left the question open, so ask the catalogue, saying so
  // while it looks. A refusal adds nothing; the first answer above stays as it was.
  // A first refusal waits off the page: shown only if the catalogue has nothing either,
  // so "not enough information" never sits above an answer.
  async function lookFurther(question, store, mine, refusal) {
    const note = el("div", {className: "waiting further", role: "status"}, [el("div", {className: "row"}, [
      el("span", {className: "dots", ariaHidden: "true"}, [el("span"), el("span"), el("span")]),
      el("span", {textContent: t("lookingCatalogue")})])]);
    out.append(note);
    const abort = new AbortController();
    const limit = setTimeout(() => abort.abort(), 90000);
    try {
      const res = await fetch(API + "/procedures", {method: "POST", headers: {"Content-Type": "application/json"},
                                                    body: JSON.stringify({question, store}), signal: abort.signal});
      const body = await res.json();
      if (mine !== turn) return;
      if (!res.ok) throw new Error(body.detail || "Error " + res.status);
      if (body.refused) { note.replaceWith(...(refusal ? [refusal] : [])); return; }
      note.replaceWith(el("section", {className: "further"}, [
        el("h2", {className: "further-title", textContent: t("catalogueTitle")}), answerBox(body, true, question)]));
    } catch (_) {
      if (mine === turn) note.replaceWith(...(refusal ? [refusal] : []),
        el("div", {className: "waiting further"}, [el("p", {className: "meta", textContent: t("catalogueError")})]));
    } finally {
      clearTimeout(limit);
    }
  }

  function render() {
    document.documentElement.lang = lang;
    document.title = t("docTitle");
    for (const node of document.querySelectorAll("[data-t]")) node.innerHTML = t(node.dataset.t);
    q.placeholder = t("placeholder");
    document.getElementById("lang").textContent = t("switchTo");
    const about = document.getElementById("about"), info = document.getElementById("info");
    info.textContent = about.hidden ? t("info") : t("infoClose");
    info.setAttribute("aria-expanded", String(!about.hidden));
    const examples = document.getElementById("examples");
    examples.replaceChildren(...t("examples").map(text => el("button", {type: "button", textContent: text,
      onclick: () => { q.value = text; ask(text); }})));
  }

  async function ask(question) {
    if (!question) return;
    // A newer question wins: answers that arrive for an older one are dropped.
    const mine = ++turn;
    const store = !document.getElementById("nostore").checked;
    // The address bar carries the question, so copying it shares it; not when the
    // visitor asked not to keep it, as the address stays in the browser's history.
    const here = new URL(location.href);
    if (store) here.searchParams.set("q", question); else here.searchParams.delete("q");
    history.replaceState(null, "", here);
    send.disabled = true;
    send.textContent = t("asking");
    // A server gone idle starts again with this question: its countdown starts now.
    if (server === "asleep") startWaking();
    // A cold server shows its wait from the first second; a warm one only if it drags.
    const cold = server !== "ready";
    const label = el("span", {textContent: cold ? t("waking") : t("thinking")});
    const elapsed = el("span", {className: "elapsed", textContent: "0 s"});
    const hint = el("p", {className: "hint", textContent: cold ? t("wakingHint") : ""});
    const fill = el("i");
    out.replaceChildren(el("div", {className: "waiting", role: "status"}, [
      el("div", {className: "row"}, [el("span", {className: "dots", ariaHidden: "true"}, [el("span"), el("span"), el("span")]), label, elapsed]),
      hint, el("div", {className: "bar", ariaHidden: "true"}, [fill])]));
    // A cold server needs what is left of its start-up, plus the answer itself.
    const expected = cold ? Math.max(5, wakeRemaining()) + 5 : 6;
    const started = Date.now();
    const tick = setInterval(() => {
      const s = Math.round((Date.now() - started) / 1000);
      elapsed.textContent = `${s} s`;
      fill.style.width = `${Math.min(95, 100 * s / expected)}%`;
      if (!cold && s >= 8) hint.textContent = t("slowHint");
    }, 1000);
    const abort = new AbortController();
    const limit = setTimeout(() => abort.abort(), 90000);
    try {
      const res = await fetch(API + "/ask", {method: "POST", headers: {"Content-Type": "application/json"},
                                             body: JSON.stringify({question, store}), signal: abort.signal});
      lastContact = Date.now();
      setServer("ready");
      const body = await res.json();
      if (!res.ok) throw new Error(body.detail || "Error " + res.status);
      if (mine !== turn) return;
      const box = answerBox(body, false, question);
      const held = body.refused && body.incomplete;
      out.replaceChildren(...(held ? [] : [box]));
      // On a phone the answer lands below the fold; bring it into view.
      if (box.getBoundingClientRect().top > window.innerHeight * 0.6) box.scrollIntoView({behavior: "smooth", block: "start"});
      clearInterval(tick);
      if (body.incomplete) await lookFurther(question, store, mine, held ? box : null);
    } catch (err) {
      if (mine !== turn) return;
      const message = err.name === "AbortError" ? t("timeout") : t("error").replace("{e}", err.message.replace(/\.+$/, ""));
      out.replaceChildren(el("div", {className: "waiting"}, [el("p", {textContent: message}),
        el("button", {type: "button", textContent: t("retry"), onclick: () => ask(question)})]));
    } finally {
      clearInterval(tick);
      clearTimeout(limit);
      if (mine === turn) {
        send.disabled = false;
        send.textContent = t("send");
      }
    }
  }

  document.getElementById("lang").addEventListener("click", () => {
    lang = lang === "es" ? "en" : "es";
    try { localStorage.setItem("lang", lang); } catch (_) { /* the choice just won't be remembered */ }
    out.replaceChildren();
    render();
    setServer(server);
  });
  document.getElementById("info").addEventListener("click", () => {
    const about = document.getElementById("about");
    about.hidden = !about.hidden;
    render();
  });
  document.getElementById("ask").addEventListener("submit", e => { e.preventDefault(); ask(q.value.trim()); });
  // A shared link fills the question in and asks it (see the end of the script).
  const shared = new URLSearchParams(location.search).get("q");
  if (shared) q.value = shared.slice(0, Number(q.maxLength) > 0 ? Number(q.maxLength) : 500);

  // The link to share carries the question only, never the API or the visitor's settings.
  async function share(question, status) {
    const link = new URL(location.pathname, location.origin);
    link.searchParams.set("q", question);
    if (lang !== "es") link.searchParams.set("lang", lang);
    try { await navigator.clipboard.writeText(link.href); status.textContent = t("copied"); }
    catch (_) { status.textContent = link.href; }
  }
  // Wake the API while the visitor reads and types: after a quiet spell it takes ~30 s
  // to start, so the page says so before anyone asks.
  // Measured cold start on 9 November: about 30 s from the first request to an answer.
  const COLD_START_S = 30, RETRY_S = 5, GIVE_UP_S = 120;
  // The container scales to zero about 5 minutes after its last request. The page
  // does not poll to keep it awake (that would keep paying for it while a tab is
  // open); it says the server is idle a little before then, and wakes it when the
  // visitor starts typing.
  const ASLEEP_AFTER_S = 270;
  let server = "waking", wakeStarted = Date.now(), retrying = false, lastContact = 0;
  const wakeElapsed = () => Math.round((Date.now() - wakeStarted) / 1000);
  const wakeRemaining = () => Math.max(0, COLD_START_S - wakeElapsed());
  function setServer(state) {
    server = state;
    paintServer();
  }
  function paintServer() {
    const label = server === "waking" ? (retrying ? t("serverRetry") : t("serverWaking")(wakeRemaining()))
      : t({ready: "serverReady", down: "serverDown", asleep: "serverAsleep"}[server]);
    document.getElementById("server").className = `server ${server}`;
    document.getElementById("server-text").textContent =
      server === "waking" && wakeRemaining() === 0 && !retrying ? `${label} (${wakeElapsed()} s)` : label;
  }
  // Every second: repaint the countdown while starting, and notice when it has gone idle.
  setInterval(() => {
    if (server === "waking") paintServer();
    else if (server === "ready" && Date.now() - lastContact > ASLEEP_AFTER_S * 1000) setServer("asleep");
  }, 1000);
  function startWaking() {
    wakeStarted = Date.now();
    retrying = false;
    setServer("waking");
    wake();
  }
  q.addEventListener("input", () => { if (server === "asleep") startWaking(); });
  // One request wakes the container; if it fails, try again every few seconds.
  function wake() {
    const attempt = new AbortController();
    setTimeout(() => attempt.abort(), 60000);
    fetch(API + "/health", {signal: attempt.signal})
      .then(res => { if (!res.ok) throw new Error(res.status); lastContact = Date.now(); setServer("ready"); })
      .catch(() => {
        if (server !== "waking") return;
        if (wakeElapsed() >= GIVE_UP_S) { setServer("down"); return; }
        retrying = true; paintServer();
        setTimeout(() => { retrying = false; wake(); }, RETRY_S * 1000);
      });
  }
  render();
  setServer("waking");
  wake();
  // A shared link asks its question, but not for an automated browser (a crawler
  // rendering the page) and not until the tab is in view, so a link opened in the
  // background costs nothing until someone looks at it. Link previews run no script.
  if (shared && !navigator.webdriver) {
    const go = () => { if (document.visibilityState !== "visible") return;
                       document.removeEventListener("visibilitychange", go); ask(q.value.trim()); };
    document.addEventListener("visibilitychange", go);
    go();
  }
</script>
</body>
</html>
